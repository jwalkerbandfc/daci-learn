<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Access practice | BTEC Unit 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Comic+Neue:wght@400;700&family=Lexend:wght@400;600;700&display=swap">
<style>
/* Layout concept: a level map (two tracks of missions) leading into one-step-at-a-time lessons with a practice Access screen. */
:root{
  --bg:#F3F5FA;--surface:#FFFFFF;--surface2:#E8ECF5;--ink:#141C33;--muted:#44506E;--line:#B9C2D8;
  --accent:#010ED0;--on-accent:#FFFFFF;
  --good:#0A6247;--good-bg:#DCF3E9;--warn:#7A4B00;--warn-bg:#FFF0CC;--info:#12408F;--info-bg:#E0EBFD;
  --focus:#0B57D0;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --font-head:"Lexend","Atkinson Hyperlegible",system-ui,"Segoe UI",Arial,sans-serif;
  --base:100%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-pal]){
  --bg:#12141D;--surface:#1C1F2B;--surface2:#272B3B;--ink:#EEF0F8;--muted:#B2B9D0;--line:#3C435C;
  --accent:#A9B1FF;--on-accent:#0A0E3D;--good:#6EDDB0;--good-bg:#12362B;--warn:#FFCF70;--warn-bg:#3A2E0D;--info:#9BC0FF;--info-bg:#172642;--focus:#7DB1FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141D;--surface:#1C1F2B;--surface2:#272B3B;--ink:#EEF0F8;--muted:#B2B9D0;--line:#3C435C;
  --accent:#A9B1FF;--on-accent:#0A0E3D;--good:#6EDDB0;--good-bg:#12362B;--warn:#FFCF70;--warn-bg:#3A2E0D;--info:#9BC0FF;--info-bg:#172642;--focus:#7DB1FF;color-scheme:dark}
/* user-chosen colour sets (after the viewer theme blocks so they win) */
:root[data-pal="light"]{--bg:#F3F5FA;--surface:#FFFFFF;--surface2:#E8ECF5;--ink:#141C33;--muted:#44506E;--line:#B9C2D8;--accent:#010ED0;--on-accent:#FFFFFF;--good:#0A6247;--good-bg:#DCF3E9;--warn:#7A4B00;--warn-bg:#FFF0CC;--info:#12408F;--info-bg:#E0EBFD;--focus:#0B57D0;color-scheme:light}
:root[data-pal="dark"]{--bg:#12141D;--surface:#1C1F2B;--surface2:#272B3B;--ink:#EEF0F8;--muted:#B2B9D0;--line:#3C435C;--accent:#A9B1FF;--on-accent:#0A0E3D;--good:#6EDDB0;--good-bg:#12362B;--warn:#FFCF70;--warn-bg:#3A2E0D;--info:#9BC0FF;--info-bg:#172642;--focus:#7DB1FF;color-scheme:dark}
:root[data-pal="contrast"]{--bg:#000000;--surface:#000000;--surface2:#1A1A1A;--ink:#FFFF4D;--muted:#FFFFFF;--line:#FFFF4D;--accent:#FFFF4D;--on-accent:#000000;--good:#4DFFB0;--good-bg:#00261A;--warn:#FFB84D;--warn-bg:#2B1B00;--info:#6EE7FF;--info-bg:#00222B;--focus:#FFFFFF;color-scheme:dark}
:root[data-pal="cream"]{--bg:#FBF1D2;--surface:#FFFAE6;--surface2:#F3E5B8;--ink:#2A2310;--muted:#54491F;--line:#C9B777;--accent:#7A1830;--on-accent:#FFFFFF;--good:#0A5A40;--good-bg:#D9EEDD;--warn:#6E4300;--warn-bg:#FBE3A6;--info:#123C85;--info-bg:#DCE7F7;--focus:#0B57D0;color-scheme:light}
:root[data-pal="blue"]{--bg:#D6E7F8;--surface:#EAF3FC;--surface2:#C3DAF1;--ink:#0C2036;--muted:#2E4764;--line:#7FA3C9;--accent:#0B4A96;--on-accent:#FFFFFF;--good:#0A5A40;--good-bg:#CDEBDD;--warn:#6E4300;--warn-bg:#FBE3A6;--info:#0B4A96;--info-bg:#D2E2F5;--focus:#7A1830;color-scheme:light}
:root[data-pal="mint"]{--bg:#D8F0E1;--surface:#EBF9F0;--surface2:#C2E5D0;--ink:#0D2A1B;--muted:#2D4D3B;--line:#7DB596;--accent:#7A1830;--on-accent:#FFFFFF;--good:#0A5A40;--good-bg:#C4EBD5;--warn:#6E4300;--warn-bg:#FBE3A6;--info:#123C85;--info-bg:#D3E3F6;--focus:#0B57D0;color-scheme:light}
:root[data-pal="pink"]{--bg:#FADDE9;--surface:#FDEEF4;--surface2:#F1C6D8;--ink:#2B1020;--muted:#5A2D45;--line:#C98AA6;--accent:#6B1030;--on-accent:#FFFFFF;--good:#0A5A40;--good-bg:#D3EEDF;--warn:#6E4300;--warn-bg:#FBE3A6;--info:#123C85;--info-bg:#DCE7F7;--focus:#0B57D0;color-scheme:light}

:root[data-font="lexend"]{--font:"Lexend",system-ui,"Segoe UI",Arial,sans-serif;--font-head:"Lexend",system-ui,"Segoe UI",Arial,sans-serif}
:root[data-font="comic"]{--font:"Comic Neue","Comic Sans MS",system-ui,sans-serif;--font-head:"Comic Neue","Comic Sans MS",system-ui,sans-serif}
:root[data-font="system"]{--font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--font-head:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
:root[data-size="2"]{--base:118%}
:root[data-size="3"]{--base:140%}
:root[data-size="4"]{--base:170%}
html{font-size:var(--base)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem;overflow-wrap:break-word}
:root[data-space="wide"] body{line-height:2.0;letter-spacing:.05em;word-spacing:.16em}
:root[data-space="wide"] p,:root[data-space="wide"] li{margin-bottom:1.2em}
:root[data-motion="off"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--font-head);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.75rem}h2{font-size:1.4rem}h3{font-size:1.15rem}
p{margin:0 0 .8em}
code,kbd{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:.92em;background:var(--surface2);padding:.1em .4em;border-radius:.3em;border:1px solid var(--line)}
kbd{border-bottom-width:2px}
a{color:var(--accent);font-weight:700}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--on-accent);padding:.6rem 1rem;z-index:50;border-radius:0 0 .5rem 0}
.skip:focus{left:0}
.wrap{max-width:62rem;margin-inline:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:.6rem max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-family:var(--font-head);font-size:1.25rem;color:var(--accent)}
.brand span{font-size:.8rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.xp{display:flex;align-items:center;gap:.6rem;font-size:.85rem}
.xpbar{width:7rem;height:.7rem;background:var(--surface2);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
:root[data-xp="hide"] .xp,:root[data-xp="hide"] .gamey{display:none!important}
.btn{font:inherit;font-weight:700;min-height:2.75rem;padding:.55rem 1.1rem;border-radius:.7rem;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;justify-content:center;text-decoration:none}
.btn.alt{background:var(--surface);color:var(--accent)}
.btn.quiet{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:2.4rem;padding:.3rem .8rem;font-size:.9rem}
main{display:block;padding-top:1.4rem;outline:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:1.2rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.lead{font-size:1.1rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:700;padding:.15rem .6rem;border-radius:2rem;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.chip.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.chip.info{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.hero{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));align-items:start}
.hero .card h2{margin-bottom:.5rem}
.checks{margin:0;padding-left:1.2rem}
.checks li{margin-bottom:.4rem}
.track{margin-top:2rem}
.track>header{display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline;margin-bottom:.8rem}
.track p.sub{margin:0;color:var(--muted)}
.mgrid{list-style:none;margin:0;padding:0;display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr))}
.mcard{display:flex;flex-direction:column;gap:.5rem;height:100%;background:var(--surface);border:2px solid var(--line);border-radius:1rem;padding:1rem;text-decoration:none;color:var(--ink);font-weight:400}
.mcard:hover{border-color:var(--accent)}
.mcard .num{font-family:var(--font-head);font-weight:700;font-size:.85rem;color:var(--accent)}
.mcard h3{font-size:1.05rem}
.mcard p{margin:0;font-size:.92rem;color:var(--muted)}
.mcard.done{border-color:var(--good)}
.mcard .foot{margin-top:auto;display:flex;gap:.4rem;flex-wrap:wrap}
.boss{border-style:dashed}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 0;padding:0;list-style:none}
.badge{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:.8rem;padding:.4rem .7rem;font-size:.82rem;background:var(--surface);max-width:13rem}
.badge.got{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.badge b{font-size:.9rem}
.crumbs{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.8rem}
.mhead{margin-bottom:1rem}
.mhead .meta{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.stepnav{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;padding:0;margin:.6rem 0 1rem}
.stepnav button{font:inherit;font-weight:700;width:2.75rem;height:2.75rem;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.stepnav button[aria-current="step"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stepnav button.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.stepnav button.ok[aria-current="step"]{background:var(--good);color:var(--surface)}
.stephead{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.stepfoot{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:space-between;margin-top:1.2rem}
.bigsteps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:.7rem}
.bigsteps li{counter-increment:s;display:grid;grid-template-columns:2.4rem 1fr;gap:.8rem;align-items:start;padding:.8rem;border:2px solid var(--line);border-radius:.8rem;background:var(--bg)}
.bigsteps li::before{content:counter(s);font-family:var(--font-head);font-weight:700;background:var(--accent);color:var(--on-accent);width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center}
.note{padding:.7rem .9rem;border-radius:.7rem;margin:0;border-left:.4rem solid var(--info);background:var(--info-bg);color:var(--ink)}
.note.tip{border-color:var(--good);background:var(--good-bg)}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
details.more{border:2px solid var(--line);border-radius:.8rem;background:var(--surface)}
details.more summary{cursor:pointer;font-weight:700;padding:.7rem .9rem;min-height:2.75rem}
details.more>div{padding:0 .9rem .8rem}
.fb{padding:.7rem .9rem;border-radius:.7rem;border:2px solid var(--line);background:var(--surface2);min-height:2.6rem}
.fb.ok{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.fb.no{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
.fb:empty{display:none}
fieldset{border:2px solid var(--line);border-radius:.8rem;padding:.8rem;margin:0;min-width:0;background:var(--surface)}
legend{font-weight:700;padding:0 .4rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .6rem;border-radius:.6rem;cursor:pointer;min-height:2.75rem}
.opt:hover{background:var(--surface2)}
.opt input{width:1.4rem;height:1.4rem;margin-top:.15rem;flex:none;accent-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:.15rem}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg label{display:inline-flex;align-items:center;gap:.4rem;border:2px solid var(--line);border-radius:.6rem;padding:.4rem .7rem;cursor:pointer;min-height:2.75rem;background:var(--surface)}
.seg input{accent-color:var(--accent);width:1.2rem;height:1.2rem}
.seg label:has(input:checked){border-color:var(--accent);background:var(--surface2);font-weight:700}
.sel,.inp{font:inherit;min-height:2.75rem;padding:.4rem .6rem;border:2px solid var(--line);border-radius:.6rem;background:var(--surface);color:var(--ink);max-width:100%}
textarea.inp{width:100%;min-height:9rem;line-height:1.5}
.tblwrap{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;min-width:30rem;font-size:.95rem}
table.t th,table.t td{border:1.5px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
table.t th{background:var(--surface2)}
table.mini{border-collapse:collapse;font-size:.85rem;width:100%}
table.mini th,table.mini td{border:1px solid var(--line);padding:.3rem .45rem;text-align:left;vertical-align:top}
table.mini th{background:var(--surface2)}
.cmp{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.cmp>div{border:3px solid var(--line);border-radius:1rem;padding:1rem;background:var(--surface);min-width:0}
.cmp .weak{border-color:var(--warn)}
.cmp .good{border-color:var(--good)}
.cmp h3{margin-bottom:.5rem;display:flex;gap:.4rem;align-items:center}
.cmp .weak h3{color:var(--warn)}.cmp .good h3{color:var(--good)}
:root[data-pal="contrast"] .cmp .weak h3,:root[data-pal="contrast"] .cmp .good h3{color:var(--ink)}
.res{display:flex;gap:.6rem;align-items:flex-start}
.mark{font-weight:700;flex:none;min-width:5.2rem}
.mark.ok{color:var(--good)}.mark.no{color:var(--warn)}
.rule{font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:2rem;padding:.1rem .6rem;font-size:.85rem;background:var(--surface2)}
.dialogbox{border:2px solid var(--warn);background:var(--warn-bg);border-radius:.5rem;padding:.6rem .8rem;max-width:30rem}
.dialogbox b{display:block;margin-bottom:.2rem}
/* practice Access screen */
.mock{border:3px solid var(--accent);border-radius:.8rem;overflow:hidden;background:var(--surface);font-size:.92rem}
.m-title{background:var(--accent);color:var(--on-accent);padding:.4rem .8rem;font-weight:700;font-size:.85rem}
.m-tabs{display:flex;flex-wrap:wrap;gap:.2rem;padding:.3rem .4rem 0;background:var(--surface2);border-bottom:2px solid var(--line)}
.m-tab{font:inherit;font-size:.88rem;border:2px solid transparent;border-bottom:0;background:transparent;color:var(--ink);padding:.3rem .7rem;border-radius:.5rem .5rem 0 0;cursor:pointer;min-height:2.4rem}
.m-tab.on{background:var(--surface);border-color:var(--line);font-weight:700;margin-bottom:-2px;color:var(--accent)}
.m-rib{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem;background:var(--surface);border-bottom:2px solid var(--line);min-height:3.6rem;align-items:center}
.m-empty{color:var(--muted);font-style:italic}
.mk{font:inherit;font-size:.88rem;border:2px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:.5rem;padding:.35rem .7rem;min-height:2.6rem;cursor:pointer;text-align:left}
.mk:hover{border-color:var(--accent)}
.mk.done{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.m-banner{background:var(--warn-bg);border-bottom:2px solid var(--warn);padding:.5rem .7rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.m-body{display:grid;grid-template-columns:minmax(8rem,12rem) minmax(0,1fr);min-height:11rem}
.m-nav{background:var(--surface2);border-right:2px solid var(--line);padding:.5rem;display:flex;flex-direction:column;gap:.3rem}
.m-nav h4{margin:0 0 .2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.m-area{padding:.7rem;min-width:0;overflow-x:auto;display:flex;flex-direction:column;gap:.5rem}
.m-area table{border-collapse:collapse}
.m-area td,.m-area th{border:1.5px solid var(--line);padding:.3rem .5rem;text-align:left}
.m-area th{background:var(--surface2)}
.m-row{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
@media (max-width:34rem){.m-body{grid-template-columns:1fr}.m-nav{border-right:0;border-bottom:2px solid var(--line);flex-direction:row;flex-wrap:wrap}}
.goal{border:2px solid var(--accent);border-radius:.8rem;padding:.7rem .9rem;background:var(--surface)}
.goal b{color:var(--accent)}
.fm{border:2px solid var(--line);border-radius:.6rem;padding:.8rem;background:var(--surface);display:grid;gap:.6rem;max-width:26rem}
.fm label{display:grid;gap:.2rem;font-weight:700}
.win{border:2px solid var(--good);background:var(--good-bg);border-radius:1rem;padding:1.2rem;text-align:center}
.win h2{margin-bottom:.4rem}
dl.gl dt{font-weight:700;margin-top:.8rem;color:var(--accent)}
dl.gl dd{margin:0}
dialog{max-width:min(40rem,calc(100% - 2rem));width:100%;border:3px solid var(--accent);border-radius:1rem;background:var(--surface);color:var(--ink);padding:1.2rem;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.setrow{display:grid;gap:.4rem;margin-bottom:1rem}
.setrow>b{font-family:var(--font-head)}
footer.foot{margin-top:3rem;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:.6rem}
@media (max-width:30rem){.xpbar{width:4.5rem}}
</style>

blockquote.note{margin:0}
