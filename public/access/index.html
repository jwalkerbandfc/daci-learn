<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Take a flat file to four tables. Normalisation, data types, input masks, validation and queries for BTEC Unit 2.">
<meta name="color-scheme" content="light dark">
<title>Normalise It</title>
<script>try{var t=localStorage.getItem("nrm-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* Normalise It. No web fonts and no network: this has to work from a VLE or a USB stick. */
:root {
  --bg: #eef1f5;
  --card: #ffffff;
  --ink: #15202b;
  --dim: #5a6876;
  --line: #d4dbe3;
  --line2: #e8edf2;
  --brand: #1d4ed8;
  --brand-ink: #ffffff;
  --brand-soft: #e5edff;
  --good: #137a3e;
  --good-soft: #ddf3e6;
  --bad: #b3261e;
  --bad-soft: #fde7e5;
  --warn: #8a5a00;
  --warn-soft: #fdf0d5;
  --t1: #1d4ed8;  /* the four table colours */
  --t2: #9333ea;
  --t3: #c2410c;
  --t4: #0f766e;
  --t1s: #e5edff; --t2s: #f5e8ff; --t3s: #ffece0; --t4s: #d8f3f0;
  --r: 12px;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --shadow: 0 1px 2px rgba(16,30,48,.08), 0 4px 16px rgba(16,30,48,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --card: #18212b; --ink: #e8eef4; --dim: #9fb0c0; --line: #2b3845; --line2: #222d39;
    --brand: #6ea0ff; --brand-ink: #0b1626; --brand-soft: #1b2b45;
    --good: #5ddb95; --good-soft: #15301f; --bad: #ff9a90; --bad-soft: #351c1a;
    --warn: #f0c060; --warn-soft: #332715;
    --t1: #6ea0ff; --t2: #c58bff; --t3: #ff9a5c; --t4: #4fd6c5;
    --t1s: #1b2b45; --t2s: #2d2040; --t3s: #3a2415; --t4s: #103230;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --card: #18212b; --ink: #e8eef4; --dim: #9fb0c0; --line: #2b3845; --line2: #222d39;
  --brand: #6ea0ff; --brand-ink: #0b1626; --brand-soft: #1b2b45;
  --good: #5ddb95; --good-soft: #15301f; --bad: #ff9a90; --bad-soft: #351c1a;
  --warn: #f0c060; --warn-soft: #332715;
  --t1: #6ea0ff; --t2: #c58bff; --t3: #ff9a5c; --t4: #4fd6c5;
  --t1s: #1b2b45; --t2s: #2d2040; --t3s: #3a2415; --t4s: #103230;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--ui);
  -webkit-text-size-adjust: 100%;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0 0 10px; }
.hide { display: none !important; }

/* ------------------------------------------------------------------ chrome */
.top {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: 10px max(12px, env(safe-area-inset-left,0px)) 10px max(12px, env(safe-area-inset-right,0px));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.logo { font: 800 17px/1 var(--ui); letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.logo svg { width: 22px; height: 22px; flex: none; }
.grow { flex: 1; min-width: 0; }
.tbtn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 6px 12px; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.tbtn:hover { border-color: var(--brand); }
.tbtn.icon { padding: 6px 9px; }
.tbtn svg { width: 18px; height: 18px; }
.wrap { max-width: 1000px; margin: 0 auto;
  padding: 16px max(12px, env(safe-area-inset-left,0px)) 110px max(12px, env(safe-area-inset-right,0px)); }

/* ------------------------------------------------------------------ home */
.hero { margin: 6px 0 18px; }
.hero h1 { font-size: clamp(26px, 6vw, 38px); font-weight: 800; letter-spacing: -.02em; }
.hero p { color: var(--dim); max-width: 46ch; margin-top: 6px; font-size: 17px; }
.steps-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 16px 0 22px; }
.strip-item { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.strip-item b { display: block; font-size: 14px; }
.strip-item span { color: var(--dim); font-size: 13px; }
.strip-item .strip-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--brand); color: var(--brand-ink); font: 700 12px var(--ui); margin-bottom: 6px; }

.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.ccard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; text-align: left; display: grid; gap: 6px; box-shadow: var(--shadow); width: 100%; }
.ccard:hover { border-color: var(--brand); }
.ccard .num { font: 700 12px var(--ui); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
.ccard h3 { font-size: 19px; font-weight: 700; }
.ccard .kind { color: var(--dim); font-size: 14px; }
.ccard .bar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; margin-top: 4px; }
.ccard .bar i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.ccard .stat { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.ccard.exam { border-color: var(--warn); background: linear-gradient(var(--warn-soft), var(--card) 60%); }
.tagx { display: inline-block; font: 700 11px var(--ui); letter-spacing: .06em; text-transform: uppercase;
  background: var(--warn-soft); color: var(--warn); border-radius: 5px; padding: 2px 7px; }

/* ------------------------------------------------------------------ step header */
.chead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.chead h2 { font-size: 20px; font-weight: 800; }
.pills { display: flex; gap: 6px; margin: 0 0 14px; flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 600; color: var(--dim); }
.pill[data-state="now"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.pill[data-state="done"] { border-color: var(--good); color: var(--good); }
.pill[data-state="locked"] { opacity: .5; }
.pill .pn { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  background: var(--line2); font: 700 11px var(--ui); color: var(--dim); }
.pill[data-state="now"] .pn { background: var(--brand); color: var(--brand-ink); }
.pill[data-state="done"] .pn { background: var(--good); color: #fff; }

.ask { background: var(--brand-soft); border-left: 4px solid var(--brand); border-radius: 0 10px 10px 0;
  padding: 11px 14px; margin: 0 0 14px; font-size: 17px; font-weight: 600; }
.ask small { display: block; font-weight: 400; font-size: 14px; color: var(--dim); margin-top: 3px; }

/* ------------------------------------------------------------------ the flat sheet */
.sheet-box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden; margin: 0 0 14px; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; background: var(--line2); }
.sheet-scroll { overflow: auto; max-height: 230px; }
table.sheet { border-collapse: collapse; font: 13px var(--mono); white-space: nowrap; }
table.sheet th, table.sheet td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
table.sheet th { background: var(--card); position: sticky; top: 0; font: 600 12px var(--ui); z-index: 1; }
table.sheet tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--line2) 50%, transparent); }
table.sheet th.c1 { background: var(--t1s); color: var(--t1); }
table.sheet th.c2 { background: var(--t2s); color: var(--t2); }
table.sheet th.c3 { background: var(--t3s); color: var(--t3); }
table.sheet th.c4 { background: var(--t4s); color: var(--t4); }

/* ------------------------------------------------------------------ step 1: sorting */
.sortbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.fchip { border: 2px solid var(--line); background: var(--card); border-radius: 10px;
  padding: 9px 13px; font: 600 14px var(--mono); min-height: 42px; }
.fchip:hover { border-color: var(--brand); }
.fchip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft);
  box-shadow: 0 0 0 3px var(--brand-soft); }
.fchip.placed { opacity: .35; }
.buckets { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.bucket { border: 2px dashed var(--line); border-radius: var(--r); background: var(--card); padding: 10px;
  min-height: 118px; display: grid; gap: 6px; align-content: start; text-align: left; width: 100%; }
.bucket:hover, .bucket.armed { border-style: solid; }
.bucket .bh { font: 700 14px var(--mono); display: flex; align-items: center; gap: 6px; }
.bucket .bsub { font-size: 12px; color: var(--dim); font-weight: 400; }
.bucket.t1 { border-color: var(--t1); } .bucket.t1 .bh { color: var(--t1); }
.bucket.t2 { border-color: var(--t2); } .bucket.t2 .bh { color: var(--t2); }
.bucket.t3 { border-color: var(--t3); } .bucket.t3 .bh { color: var(--t3); }
.bucket.t4 { border-color: var(--t4); } .bucket.t4 .bh { color: var(--t4); }
.bitem { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 9px; font: 13px var(--mono); background: var(--bg); }
.bitem .x { margin-left: auto; border: 0; background: none; color: var(--dim); font-size: 15px; padding: 0 3px; }
.bitem.right { border-color: var(--good); background: var(--good-soft); }
.bitem.wrong { border-color: var(--bad); background: var(--bad-soft); }
.bitem .mk { font-weight: 700; }
.bitem.right .mk { color: var(--good); } .bitem.wrong .mk { color: var(--bad); }

/* ------------------------------------------------------------------ step 2: tables and keys */
.tgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.tbl { background: var(--card); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tbl.t1 { border-color: var(--t1); } .tbl.t2 { border-color: var(--t2); }
.tbl.t3 { border-color: var(--t3); } .tbl.t4 { border-color: var(--t4); }
.tbl .th { padding: 8px 11px; font: 700 14px var(--mono); color: #fff; display: flex; align-items: center; gap: 6px; }
.tbl.t1 .th { background: var(--t1); } .tbl.t2 .th { background: var(--t2); }
.tbl.t3 .th { background: var(--t3); } .tbl.t4 .th { background: var(--t4); }
.tbl .th .role { margin-left: auto; font: 600 11px var(--ui); background: rgba(255,255,255,.25);
  border-radius: 5px; padding: 1px 7px; }
.frow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--line2);
  font: 13px var(--mono); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.frow:first-of-type { border-top: 0; }
.frow .kbtn { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--bg); display: grid; place-items: center; color: var(--dim); }
.frow.pk .kbtn { border-color: #c79400; background: #fff6d9; color: #8a6300; }
:root[data-theme="dark"] .frow.pk .kbtn { background: #3a2f10; color: #ffd166; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .frow.pk .kbtn { background: #3a2f10; color: #ffd166; } }
.frow.pk .fname { font-weight: 700; }
.frow .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.frow .fk { font: 600 10px var(--ui); background: var(--line2); color: var(--dim);
  border-radius: 5px; padding: 2px 6px; letter-spacing: .04em; }
.frow.badmark { background: var(--bad-soft); }
.frow.goodmark { background: var(--good-soft); }
.tbl .tfoot { padding: 8px 10px; border-top: 1px solid var(--line2); font-size: 12px; color: var(--dim); }
.linkrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px dashed var(--line);
  flex-wrap: wrap; font-size: 13px; }
.linkrow select { flex: 1; min-width: 108px; }
.linkrow .why { flex: none; }

/* ------------------------------------------------------------------ pickers */
select.pick, input.pick {
  min-height: 40px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--card);
  padding: 7px 9px; width: 100%; min-width: 0; font-size: 15px;
}
select.pick:focus, input.pick:focus { border-color: var(--brand); }
td.cellOK select.pick, td.cellOK input.pick { border-color: var(--good); background: var(--good-soft); }
td.cellNO select.pick, td.cellNO input.pick { border-color: var(--bad); background: var(--bad-soft); }
select.pick:disabled { background: var(--line2); color: var(--dim); }

table.grid { width: 100%; border-collapse: collapse; }
table.grid th, table.grid td { border-bottom: 1px solid var(--line2); padding: 6px 8px; text-align: left;
  vertical-align: middle; }
table.grid th { font: 600 13px var(--ui); color: var(--dim); white-space: nowrap; }
table.grid td.fieldname { font: 600 13.5px var(--mono); white-space: nowrap; }
table.grid tr.tsep td { background: var(--line2); font: 700 12px var(--mono); padding: 5px 8px; }
.why { font-size: 12.5px; color: var(--dim); }
.why.no { color: var(--bad); }

/* ------------------------------------------------------------------ queries */
.qbox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 14px; }
.qtop { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 9px 11px; border-bottom: 1px solid var(--line); }
.qtop b { font-size: 13px; color: var(--dim); margin-right: 2px; }
.tbtn.sm { min-height: 34px; padding: 4px 10px; font-size: 13.5px; }
.tbtn.sm.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.qgrid-scroll { overflow-x: auto; }
table.qg { border-collapse: collapse; min-width: 480px; width: 100%; }
table.qg th, table.qg td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: middle; }
table.qg th { background: var(--line2); font: 600 12.5px var(--ui); text-align: left; white-space: nowrap; width: 76px; }
table.qg td { min-width: 150px; }
table.qg td.mid { text-align: center; }
table.qg input[type=checkbox] { width: 20px; height: 20px; }
.qres { padding: 10px 11px; border-top: 1px solid var(--line); }
.qres table.sheet { width: auto; }
.qerr { color: var(--bad); font-size: 14px; padding: 10px 11px; }

/* ------------------------------------------------------------------ marking */
.verdict { border-radius: var(--r); padding: 11px 14px; margin: 14px 0 0; font-size: 16px; font-weight: 600;
  display: flex; align-items: center; gap: 9px; }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.no { background: var(--bad-soft); color: var(--bad); }
.verdict svg { width: 22px; height: 22px; flex: none; }
.fixlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.fixlist li { display: flex; gap: 8px; font-size: 14.5px; background: var(--card); border: 1px solid var(--line);
  border-radius: 9px; padding: 8px 11px; }
.fixlist li b { font-family: var(--mono); }
.stars { display: inline-flex; gap: 2px; color: #d6a700; }
.stars svg { width: 17px; height: 17px; }
.stars .off { color: var(--line); }

/* ------------------------------------------------------------------ bottom bar */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: flex; gap: 10px; align-items: center;
  padding: 10px max(12px, env(safe-area-inset-left,0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
  background: var(--card); border-top: 1px solid var(--line);
}
.bottom .inner { max-width: 1000px; margin: 0 auto; display: flex; gap: 10px; width: 100%; align-items: center; }
.big { min-height: 48px; border-radius: 11px; border: 2px solid var(--line); background: var(--card);
  padding: 10px 18px; font-weight: 700; font-size: 16px; }
.big.go { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.big.go:hover { filter: brightness(1.08); }
.big.ghost { border-color: var(--line); }
.big[disabled] { opacity: .45; }

/* ------------------------------------------------------------------ sheets that slide up */
.scrim { position: fixed; inset: 0; background: rgba(8,14,22,.5); z-index: 40; }
.sheetup { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card);
  border-radius: 18px 18px 0 0; max-height: 86vh; display: flex; flex-direction: column;
  box-shadow: 0 -8px 40px rgba(0,0,0,.3);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheetup .sh { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheetup .sh h3 { font-size: 18px; font-weight: 800; }
.sheetup .sb { overflow: auto; padding: 14px 16px 22px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 0; }
.tab { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px;
  font-size: 14px; font-weight: 600; white-space: nowrap; min-height: 38px; }
.tab.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
table.ref { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.ref th, table.ref td { border-bottom: 1px solid var(--line2); padding: 7px 8px; text-align: left; vertical-align: top; }
table.ref th { font-weight: 700; color: var(--dim); font-size: 13px; }
table.ref td code, code { font: 13px var(--mono); background: var(--line2); border-radius: 5px; padding: 1px 5px; }
.nfcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.nfcard b { display: block; font-size: 15px; }
.nfcard span { color: var(--dim); font-size: 14px; }
.helpbtns { display: grid; gap: 8px; }
.helpbtn { text-align: left; border: 2px solid var(--line); border-radius: 11px; background: var(--card);
  padding: 12px 14px; display: grid; gap: 2px; min-height: 56px; }
.helpbtn:hover { border-color: var(--brand); }
.helpbtn b { font-size: 15.5px; }
.helpbtn span { color: var(--dim); font-size: 13.5px; }
.helpbtn[disabled] { opacity: .45; }

/* ------------------------------------------------------------------ finish screen */
.done-hero { text-align: center; padding: 18px 0 8px; }
.done-hero .tick { width: 66px; height: 66px; margin: 0 auto 10px; border-radius: 50%;
  background: var(--good-soft); color: var(--good); display: grid; place-items: center; }
.done-hero .tick svg { width: 36px; height: 36px; }
.done-hero h2 { font-size: 25px; font-weight: 800; }
.dd-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 14px 0; }
.dd-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.dd-head b { font-size: 15px; }
.dd-scroll { overflow-x: auto; }
table.dd { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.dd th, table.dd td { border-bottom: 1px solid var(--line2); padding: 6px 9px; text-align: left; white-space: nowrap; }
table.dd th { background: var(--line2); font: 600 12.5px var(--ui); }
table.dd tr.sep td { background: var(--brand-soft); font: 700 13px var(--mono); color: var(--brand); }
table.dd td.k { font-family: var(--mono); }

@media print {
  .top, .bottom, .pills, .tabs, .no-print { display: none !important; }
  body { background: #fff; }
  .wrap { padding: 0; max-width: none; }
  table.dd th, table.dd td { border: 1px solid #999; }
}

/* ------------------------------------------------------------------ small screens */
@media (max-width: 560px) {
  .wrap { padding-bottom: 120px; }
  .hero h1 { font-size: 26px; }
  .ask { font-size: 16px; }
  .big { padding: 10px 12px; font-size: 15px; flex: 1; }
  .pills { gap: 5px; }
  .pill { padding: 5px 10px; font-size: 13px; }
  .pill .lbl { display: none; }
  .sheet-scroll { max-height: 190px; }
}

/* a key the learner had to invent, and the button that makes one */
.frow .fk.new { background: var(--good-soft); color: var(--good); }
.addkey { display: grid; gap: 1px; text-align: left; width: 100%; padding: 8px 10px;
  border: 0; border-top: 1px dashed var(--line); background: none; }
.addkey:hover { background: var(--brand-soft); }
.addkey b { font-size: 13px; color: var(--brand); }

<noscript><div style="padding:24px;font:16px system-ui">
<h1>Normalise It</h1><p>This page needs JavaScript switched on.</p></div></noscript>
<script>
/* Normalisation engine.
   Marks ANY valid decomposition, not just the one the author had in mind, by working
   from the functional dependencies: attribute closure for keys, subset tests for
   partial and transitive dependencies, and the chase for a lossless join. */
(function (root) {
  'use strict';

  /* ---------------------------------------------------------------- small set helpers */
  function uniq(a) { var s = [], i; for (i = 0; i < a.length; i++) if (s.indexOf(a[i]) < 0) s.push(a[i]); return s; }
  function has(a, x) { return a.indexOf(x) >= 0; }
  function subset(a, b) { for (var i = 0; i < a.length; i++) if (!has(b, a[i])) return false; return true; }
  function minus(a, b) { return a.filter(function (x) { return !has(b, x); }); }
  function inter(a, b) { return a.filter(function (x) { return has(b, x); }); }
  function same(a, b) { return a.length === b.length && subset(a, b); }
  function list(a) { return a.join(', '); }

  /* every non-empty proper subset of a small array */
  function properSubsets(a) {
    var out = [], n = a.length, i, j;
    for (i = 1; i < (1 << n) - 1; i++) {
      var s = [];
      for (j = 0; j < n; j++) if (i & (1 << j)) s.push(a[j]);
      out.push(s);
    }
    return out;
  }
  /* every subset of size 1..max */
  function smallSubsets(a, max) {
    var out = [], n = a.length, i, j;
    for (i = 1; i < (1 << n); i++) {
      var s = [];
      for (j = 0; j < n; j++) if (i & (1 << j)) s.push(a[j]);
      if (s.length <= max) out.push(s);
    }
    out.sort(function (x, y) { return x.length - y.length; });
    return out;
  }

  /* ---------------------------------------------------------------- closure */
  function closure(attrs, fds) {
    var x = uniq(attrs.slice()), grew = true;
    while (grew) {
      grew = false;
      for (var i = 0; i < fds.length; i++) {
        var f = fds[i];
        if (subset(f.d, x)) {
          for (var j = 0; j < f.r.length; j++) {
            if (!has(x, f.r[j])) { x.push(f.r[j]); grew = true; }
          }
        }
      }
    }
    return x;
  }

  /* does X -> A hold? */
  function holds(det, attr, fds) { return has(closure(det, fds), attr); }

  /* attributes that are part of SOME candidate key of the whole relation */
  function primeAttributes(attrs, fds) {
    var keys = candidateKeys(attrs, fds), out = [];
    keys.forEach(function (k) { k.forEach(function (a) { if (!has(out, a)) out.push(a); }); });
    return out;
  }

  /* candidate keys of a relation, found by trying small subsets first (tables here are small) */
  function candidateKeys(attrs, fds) {
    var found = [], subs = smallSubsets(attrs, Math.min(attrs.length, 4)), i;
    for (i = 0; i < subs.length; i++) {
      var s = subs[i];
      if (!subset(attrs, closure(s, fds))) continue;
      // minimal only: skip if it contains a key we already have
      var covered = found.some(function (k) { return subset(k, s); });
      if (!covered) found.push(s);
    }
    return found;
  }

  /* ---------------------------------------------------------------- lossless join (the chase) */
  function lossless(attrs, tables, fds) {
    var m = attrs.length, n = tables.length, i, j;
    var grid = [];
    for (i = 0; i < n; i++) {
      grid.push(attrs.map(function (a) { return has(tables[i].fields, a) ? 'a' : 'b' + i; }));
    }
    var changed = true, guard = 0;
    while (changed && guard++ < 200) {
      changed = false;
      for (var f = 0; f < fds.length; f++) {
        var fd = fds[f];
        var cols = fd.d.map(function (a) { return attrs.indexOf(a); });
        if (cols.some(function (c) { return c < 0; })) continue;
        // group rows that agree on every determinant column
        var groups = {};
        for (i = 0; i < n; i++) {
          var key = cols.map(function (c) { return grid[i][c]; }).join('|');
          (groups[key] = groups[key] || []).push(i);
        }
        Object.keys(groups).forEach(function (k) {
          var rows = groups[k];
          if (rows.length < 2) return;
          fd.r.forEach(function (a) {
            var c = attrs.indexOf(a);
            if (c < 0) return;
            var winner = null;
            for (j = 0; j < rows.length; j++) if (grid[rows[j]][c] === 'a') winner = 'a';
            if (winner === null) winner = grid[rows[0]][c];
            for (j = 0; j < rows.length; j++) {
              if (grid[rows[j]][c] !== winner) { grid[rows[j]][c] = winner; changed = true; }
            }
          });
        });
      }
      for (i = 0; i < n; i++) {
        if (grid[i].every(function (v) { return v === 'a'; })) return true;
      }
    }
    return false;
  }

  /* ---------------------------------------------------------------- the marker */
  /* A learner table is { name, pk:[...], fields:[...] }. pk attributes are part of fields. */
  function tidy(tables) {
    return (tables || []).filter(function (t) { return t && t.fields && t.fields.length; }).map(function (t) {
      var fields = uniq(t.fields.slice());
      var pk = uniq((t.pk || []).filter(function (a) { return has(fields, a); }));
      return { name: (t.name || 'Table').trim() || 'Table', pk: pk, fields: fields };
    });
  }

  function keyProblems(t, fds) {
    if (!t.pk.length) return t.name + ' has no primary key. Every table needs one.';
    var cl = closure(t.pk, fds);
    var missed = minus(t.fields, cl);
    if (missed.length) {
      return t.name + ': ' + list(t.pk) + ' does not decide ' + list(missed) +
        '. Either pick a different key, or move those fields to a table where they belong.';
    }
    if (t.pk.length > 1) {
      var subs = properSubsets(t.pk);
      for (var i = 0; i < subs.length; i++) {
        if (subset(t.fields, closure(subs[i], fds))) {
          return t.name + ': you only need ' + list(subs[i]) + ' as the key. The rest of the key is not doing anything.';
        }
      }
    }
    return null;
  }

  function partialProblem(t, fds) {
    if (t.pk.length < 2) return null;
    var nonKey = minus(t.fields, t.pk);
    var subs = properSubsets(t.pk);
    for (var i = 0; i < subs.length; i++) {
      for (var j = 0; j < nonKey.length; j++) {
        if (holds(subs[i], nonKey[j], fds)) {
          return t.name + ': ' + nonKey[j] + ' only depends on ' + list(subs[i]) +
            ', which is part of the key, not all of it. That is a partial dependency, so this is still 1NF.';
        }
      }
    }
    return null;
  }

  function transitiveProblem(t, fds, prime) {
    var nonKey = minus(t.fields, t.pk);
    if (nonKey.length < 2) return null;
    var dets = smallSubsets(nonKey, Math.min(2, nonKey.length));
    for (var i = 0; i < dets.length; i++) {
      var d = dets[i];
      var rest = minus(nonKey, d);
      for (var j = 0; j < rest.length; j++) {
        if (has(prime, rest[j])) continue;          // a prime attribute is allowed
        if (holds(d, rest[j], fds)) {
          return t.name + ': ' + rest[j] + ' depends on ' + list(d) + ', and ' + list(d) +
            ' is not the key. That is a transitive dependency, so this is still 2NF.';
        }
      }
    }
    return null;
  }

  function check(ds, learnerTables) {
    var fds = ds.fds, attrs = ds.attrs;
    var tables = tidy(learnerTables);
    var prime = primeAttributes(attrs, fds);
    var results = [];
    function add(text, points, ok, why) { results.push({ text: text, points: points, ok: !!ok, why: ok ? '' : (why || '') }); }

    /* 1. nothing lost */
    var placed = [];
    tables.forEach(function (t) { t.fields.forEach(function (a) { if (!has(placed, a)) placed.push(a); }); });
    var lost = minus(attrs, placed);
    var invented = minus(placed, attrs);
    add('Every field from the spreadsheet has a home', 2, !lost.length && !invented.length,
      lost.length ? 'These fields are missing: ' + list(lost) + '.'
        : 'These are not fields in the original data: ' + list(invented) + '.');

    /* 2. sensible number of tables */
    var want = ds.target.length;
    add('The data is split into ' + want + ' tables', 2, tables.length === want,
      tables.length < want ? 'You have ' + tables.length + ' table' + (tables.length === 1 ? '' : 's') + '. There is still repeated data to pull out.'
        : 'You have ' + tables.length + ' tables, which is more than this data needs. Two of yours probably describe the same thing.');

    /* 3. every table has a key that works */
    var keyBad = null;
    tables.forEach(function (t) { if (!keyBad) keyBad = keyProblems(t, fds); });
    add('Every table has a primary key that decides its other fields', 3, !keyBad, keyBad || '');

    /* 4. 1NF: this engine takes atomic fields as given, but repeating groups are caught
          by the author listing them as separate attributes, so we check for leftovers */
    var repeats = (ds.repeating || []).filter(function (g) {
      return tables.some(function (t) { return g.every(function (a) { return has(t.fields, a); }); });
    });
    if (ds.repeating && ds.repeating.length) {
      add('No repeating groups are left in one table', 2, !repeats.length,
        repeats.length ? 'One table still holds ' + list(repeats[0]) + ' together. A record should never hold a list.' : '');
    }

    /* 5. 2NF */
    var partial = null;
    tables.forEach(function (t) { if (!partial) partial = partialProblem(t, fds); });
    add('No partial dependencies (2NF)', 3, !partial, partial || '');

    /* 6. 3NF */
    var trans = null;
    if (ds.nf >= 3) {
      tables.forEach(function (t) { if (!trans) trans = transitiveProblem(t, fds, prime); });
      add('No transitive dependencies (3NF)', 3, !trans, trans || '');
    }

    /* 7. the tables can be joined back together */
    var join = tables.length ? lossless(attrs, tables, fds) : false;
    add('The tables can be joined back into the original data', 3, join,
      'Two of your tables have no field in common, so there is no way to link them. Every table needs a foreign key pointing at another table.');

    /* 8. foreign keys are shared, nothing else is */
    var dupBad = null;
    attrs.forEach(function (a) {
      if (dupBad) return;
      var inTables = tables.filter(function (t) { return has(t.fields, a); });
      if (inTables.length < 2) return;
      var isKeySomewhere = inTables.some(function (t) { return has(t.pk, a); });
      if (!isKeySomewhere) {
        dupBad = a + ' is stored in ' + inTables.length + ' tables and is not the primary key of any of them. ' +
          'Only a key should be repeated, as a foreign key.';
      }
    });
    add('Only keys are repeated between tables', 2, !dupBad, dupBad || '');

    var score = 0, max = 0;
    results.forEach(function (r) { max += r.points; if (r.ok) score += r.points; });
    return { score: score, max: max, results: results, tables: tables };
  }

  var API = {
    closure: closure, holds: holds, candidateKeys: candidateKeys, primeAttributes: primeAttributes,
    lossless: lossless, check: check, properSubsets: properSubsets, smallSubsets: smallSubsets,
    helpers: { uniq: uniq, subset: subset, minus: minus, inter: inter, same: same },
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  if (root) root.NORM = API;
})(typeof window !== 'undefined' ? window : null);

<script>
/* A small Access-style query engine: tables, joins, the criteria language from the
   design grid, calculated fields, and the Totals row. Runs in the page and in Node. */
(function (root) {
  'use strict';

  /* ---------------------------------------------------------------- values */
  var MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

  function isDateStr(v) { return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v); }
  function dnum(v) {           // a date as a sortable/comparable number
    if (v instanceof Date) return v.getTime();
    if (isDateStr(v)) return Date.UTC(+v.slice(0, 4), +v.slice(5, 7) - 1, +v.slice(8, 10));
    return NaN;
  }
  function ukDate(v) {
    if (!isDateStr(v)) return v;
    return v.slice(8, 10) + '/' + v.slice(5, 7) + '/' + v.slice(0, 4);
  }
  function parseUk(s) {        // 01/06/2026 or 1/6/2026 or 01-Jun-2026
    var m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/.exec(s);
    if (m) {
      var y = +m[3]; if (y < 100) y += 2000;
      return Date.UTC(y, +m[2] - 1, +m[1]);
    }
    m = /^(\d{1,2})[\/\-]([a-z]{3})[a-z]*[\/\-](\d{2,4})$/i.exec(s);
    if (m) {
      var mi = MONTHS.indexOf(m[2].toLowerCase());
      if (mi >= 0) { var yy = +m[3]; if (yy < 100) yy += 2000; return Date.UTC(yy, mi, +m[1]); }
    }
    return NaN;
  }
  function num(v) {
    if (typeof v === 'number') return v;
    if (typeof v === 'boolean') return v ? -1 : 0;
    if (typeof v === 'string' && v.trim() !== '' && !isNaN(+v)) return +v;
    return NaN;
  }
  function isBlank(v) { return v === null || v === undefined || v === ''; }
  function text(v) { return isBlank(v) ? '' : String(v); }

  /* compare two values the way Access would */
  function cmp(a, b) {
    if (isBlank(a) && isBlank(b)) return 0;
    if (isBlank(a)) return -1;
    if (isBlank(b)) return 1;
    var da = isDateStr(a) ? dnum(a) : NaN, db = isDateStr(b) ? dnum(b) : NaN;
    if (!isNaN(da) && !isNaN(db)) return da - db;
    var na = num(a), nb = num(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    var sa = text(a).toLowerCase(), sb = text(b).toLowerCase();
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  }

  /* ---------------------------------------------------------------- expressions */
  /* tokens: number, string, #date#, [Field], name, operator */
  function lex(src) {
    var t = [], i = 0, s = src;
    while (i < s.length) {
      var c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (c === '[') { var j = s.indexOf(']', i); if (j < 0) throw new Error('A [ is not closed'); t.push({ k: 'field', v: s.slice(i + 1, j) }); i = j + 1; continue; }
      if (c === '"' || c === "'") { var k = s.indexOf(c, i + 1); if (k < 0) throw new Error('A quote is not closed'); t.push({ k: 'str', v: s.slice(i + 1, k) }); i = k + 1; continue; }
      if (c === '#') { var d = s.indexOf('#', i + 1); if (d < 0) throw new Error('A # is not closed'); t.push({ k: 'date', v: parseUk(s.slice(i + 1, d)) }); i = d + 1; continue; }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(s[i + 1] || ''))) {
        var m = /^[0-9]*\.?[0-9]+/.exec(s.slice(i)); t.push({ k: 'num', v: +m[0] }); i += m[0].length; continue;
      }
      if (/[A-Za-z_]/.test(c)) { var w = /^[A-Za-z_][A-Za-z0-9_.]*/.exec(s.slice(i)); t.push({ k: 'name', v: w[0] }); i += w[0].length; continue; }
      var two = s.substr(i, 2);
      if (two === '<=' || two === '>=' || two === '<>') { t.push({ k: 'op', v: two }); i += 2; continue; }
      if ('+-*/()&<>=,'.indexOf(c) >= 0) { t.push({ k: 'op', v: c }); i++; continue; }
      throw new Error('I do not understand "' + c + '"');
    }
    return t;
  }

  function Parser(tokens, row, ctx) { this.t = tokens; this.i = 0; this.row = row; this.ctx = ctx || {}; }
  Parser.prototype.peek = function () { return this.t[this.i]; };
  Parser.prototype.eat = function (k, v) {
    var tk = this.t[this.i];
    if (!tk || tk.k !== k || (v !== undefined && String(tk.v).toLowerCase() !== String(v).toLowerCase())) return null;
    this.i++; return tk;
  };
  Parser.prototype.expr = function () { return this.compare(); };
  Parser.prototype.compare = function () {
    var l = this.concat(), p = this.peek();
    if (p && p.k === 'op' && ['<', '>', '<=', '>=', '=', '<>'].indexOf(p.v) >= 0) {
      this.i++;
      var c = cmp(l, this.concat());
      switch (p.v) {
        case '<': return c < 0; case '>': return c > 0;
        case '<=': return c <= 0; case '>=': return c >= 0;
        case '<>': return c !== 0; default: return c === 0;
      }
    }
    return l;
  };
  Parser.prototype.concat = function () {
    var l = this.add();
    while (this.peek() && this.peek().k === 'op' && this.peek().v === '&') { this.i++; var r = this.add(); l = text(l) + text(r); }
    return l;
  };
  Parser.prototype.add = function () {
    var l = this.mul();
    for (;;) {
      var p = this.peek();
      if (!p || p.k !== 'op' || (p.v !== '+' && p.v !== '-')) return l;
      this.i++;
      var r = this.mul();
      if (p.v === '+' && (typeof l === 'string' || typeof r === 'string') && isNaN(num(l)) ) l = text(l) + text(r);
      else l = p.v === '+' ? num(l) + num(r) : num(l) - num(r);
    }
  };
  Parser.prototype.mul = function () {
    var l = this.unary();
    for (;;) {
      var p = this.peek();
      if (!p || p.k !== 'op' || (p.v !== '*' && p.v !== '/')) return l;
      this.i++;
      var r = this.unary();
      l = p.v === '*' ? num(l) * num(r) : (num(r) === 0 ? null : num(l) / num(r));
    }
  };
  Parser.prototype.unary = function () {
    if (this.eat('op', '-')) return -num(this.unary());
    if (this.eat('op', '+')) return this.unary();
    return this.atom();
  };
  Parser.prototype.args = function () {
    var out = [];
    if (!this.eat('op', '(')) throw new Error('A function needs brackets');
    if (this.eat('op', ')')) return out;
    for (;;) {
      out.push(this.expr());
      if (this.eat('op', ',')) continue;
      if (this.eat('op', ')')) return out;
      throw new Error('A bracket is missing');
    }

    var shownFrame = null;
    function step(i) {

        frameHost.textContent = '';

      next.textContent = at === STEPS.length - 1 ? 'Done' : 'Next ›';
      dots.textContent = '';
      STEPS.forEach(function (_, j) {
        var d = el('span', 'wt-dot' + (j === at ? ' on' : j < at ? ' past' : ''));
        dots.appendChild(d);
      });
      place();
    }
    next.addEventListener('click', function () {
      if (at === STEPS.length - 1) shut(); else step(at + 1);
    });
    prev.addEventListener('click', function () { step(at - 1); });

    function place() {
      var s = STEPS[at];
      bubble.textContent = '';
      bubble.appendChild(el('b', null, s.t));
      bubble.appendChild(el('span', null, s.d));
      bubble.appendChild(el('i', null, (at + 1) + ' of ' + STEPS.length));

      var targets = s.spot
        ? frameHost.querySelectorAll('[data-spot="' + s.spot + '"], [data-colspot="' + s.spot + '"], [data-spot="' + s.spot + '-h"]')
        : [];
      var sr = inner.getBoundingClientRect();
      if (!targets.length) {
        ring.classList.add('off');
        bubble.classList.remove('has-ring');
        bubble.style.left = '50%';
        bubble.style.top = '';
        bubble.style.bottom = '14px';
        bubble.style.transform = 'translateX(-50%)';
        return;
      }
      ring.classList.remove('off');
      bubble.classList.add('has-ring');
      var l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
      Array.prototype.forEach.call(targets, function (n) {
        var q = n.getBoundingClientRect();
        l = Math.min(l, q.left); t = Math.min(t, q.top);
        r = Math.max(r, q.right); b = Math.max(b, q.bottom);

      var pad = 4;
      var x = l - sr.left - pad, y = t - sr.top - pad, w = r - l + pad * 2, h = b - t + pad * 2;
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      ring.style.width = w + 'px';
      ring.style.height = h + 'px';

      /* the bubble goes under the ring, or over it when there is no room */
      var bw = Math.min(330, sr.width - 24);
      bubble.style.width = bw + 'px';
      bubble.style.transform = 'none';
      var bx = Math.max(12, Math.min(x + w / 2 - bw / 2, sr.width - bw - 12));
      bubble.style.left = bx + 'px';
      bubble.style.bottom = '';
      var below = y + h + 12;
      var bh = bubble.offsetHeight || 120;
      if (below + bh > inner.offsetHeight && y - bh - 12 > 0) {
        bubble.style.top = (y - 12) + 'px';
        bubble.classList.add('above');
      } else {
        bubble.style.top = below + 'px';
        bubble.classList.remove('above');
      }
      /* keep the ring and its bubble on screen inside the scrolling stage */
      var topWanted = Math.min(y, bubble.classList.contains('above') ? y - bh - 12 : y);
      var botWanted = bubble.classList.contains('above') ? y + h : below + bh;
      if (topWanted < stage.scrollTop) stage.scrollTop = Math.max(0, topWanted - 12);
      else if (botWanted > stage.scrollTop + stage.clientHeight) {
        stage.scrollTop = botWanted - stage.clientHeight + 12;
      }
    }

    document.body.appendChild(scrim);
    document.body.appendChild(panel);
    step(0);
    close.focus();
    return { step: step, shut: shut, total: STEPS.length };
  }

  root.WALK = { open: open, STEPS: STEPS };
})(window);

  function StepKeys(ctx) {
    var c = ctx.c, g = ctx.g, host;

    function addedOf(t) { return g.added[t.name] || null; }

    function fieldsOf(t) {

              self.draw();
            }));
          });
          top.appendChild(el('span', 'grow'));
          top.appendChild(btn('tbtn sm', '▶ Run', function () {
            st.ran = true;
            self.draw();
          }));
          box.appendChild(top);

          var fields = [];
          st.tables.forEach(function (tn) {
            var t = ctx.tbl[tn];

          var sc = el('div', 'qgrid-scroll');
          var tg = el('table', 'qg');

            var tr = el('tr');
            tr.appendChild(el('th', null, rowdef[0]));
            st.cols.forEach(function (col, ci) {
              var td = el('td');
              if (rowdef[1] === 'pick') {
                td.appendChild(sel([{ v: '', l: '' }].concat(fields.map(function (f) { return { v: f, l: f }; })),
                  col.pick, function (v) { col.pick = v; save(); self.draw(); }));
              } else if (rowdef[1] === 'sort') {
                td.appendChild(sel([{ v: '', l: '' }, { v: 'asc', l: 'Ascending' }, { v: 'desc', l: 'Descending' }],
                  col.sort, function (v) { col.sort = v; save(); }));

              }

            });
            tg.appendChild(tr);
          });
          sc.appendChild(tg);
          box.appendChild(sc);

          if (st.ran) {
            var r = QBE.run(ctx.db, spec(i));
            if (r.error) box.appendChild(el('div', 'qerr', r.error));
            else {

              var hr = el('tr');
              r.columns.forEach(function (cn) { hr.appendChild(el('th', null, cn)); });
              var th2 = el('thead'); th2.appendChild(hr); rt.appendChild(th2);
              var tb2 = el('tbody');
              r.rows.forEach(function (row) {
                var tr2 = el('tr');
                row.forEach(function (v, k) { tr2.appendChild(el('td', null, show(v, typeOfField(c, r.columns[k])))); });
                tb2.appendChild(tr2);

              res.appendChild(el('p', 'why', r.rows.length + ' row' + (r.rows.length === 1 ? '' : 's')));
              box.appendChild(res);
            }
          }
          if (self.marked) {
            var mine = QBE.run(ctx.db, spec(i)), want = QBE.run(ctx.db, modelSpec(i));
            var ok = !mine.error && QBE.sameResult(mine, want, true);
            var v = el('div', 'verdict ' + (ok ? 'ok' : 'no'));
            v.appendChild(icon(ok ? 'tick' : 'cross'));
            v.appendChild(el('span', null, ok ? 'Q' + (i + 1) + ' is right.'
              : mine.error ? 'Q' + (i + 1) + ': ' + mine.error

            v.style.margin = '0 11px 11px';
            box.appendChild(v);
          }
          host.appendChild(box);
        });
      },
      mark: function () {
        this.marked = true;
        var right = 0, fixes = [];
        c.queries.forEach(function (q, i) {
          var mine = QBE.run(ctx.db, spec(i)), want = QBE.run(ctx.db, modelSpec(i));
          if (!mine.error && QBE.sameResult(mine, want, true)) right++;
          else fixes.push('<b>Q' + (i + 1) + '</b>: ' + q.hint);
        });
        this.draw();
        return { right: right, total: c.queries.length, fixes: fixes };
      },
      hint: function () {
        for (var i = 0; i < c.queries.length; i++) {
          var mine = QBE.run(ctx.db, spec(i)), want = QBE.run(ctx.db, modelSpec(i));
          if (mine.error || !QBE.sameResult(mine, want, true)) return 'Q' + (i + 1) + ': ' + c.queries[i].hint;
        }
        return 'Both look right. Press Check.';
      },
      fillOne: function () {
        for (var i = 0; i < c.queries.length; i++) {
          var mine = QBE.run(ctx.db, spec(i)), want = QBE.run(ctx.db, modelSpec(i));
          if (!mine.error && QBE.sameResult(mine, want, true)) continue;
          this.fillQ(i);
          this.draw();
          return 'Q' + (i + 1) + ' has been filled in for you.';
        }
        return null;
      },
      fillQ: function (i) {
        var q = c.queries[i], st = state(i);
        st.tables = q.tables.slice();
        st.cols = q.cols.map(function (col) {
          return { pick: col.table + '.' + col.field, sort: col.sort, show: col.show, criteria: col.criteria };
        });
        while (st.cols.length < 3) st.cols.push(blank());
        st.ran = true;
        save();
      },
      fillAll: function () {
        var self = this;
        c.queries.forEach(function (q, i) { self.fillQ(i); });
        this.draw();
      },
    };
  }

  /* ---------------------------------------------------------------- a case */
  function renderCase(c, finished) {
    var ctx = setup(c);
    var g = ctx.g;
    if (finished) return renderDone(ctx);
    var i = Math.min(g.step, 4);
    var step = current = STEPS[i](ctx);
    current.ctx = ctx;
    current.index = i;

    var a = app();

    a.appendChild(head);

    var pills = el('div', 'pills');
    STEP_NAMES.forEach(function (nm, j) {
      var statev = j === i ? 'now' : g.stars[j] > 0 ? 'done' : j < g.step ? 'done' : 'locked';
      var p = btn('pill', null, function () {
        if (j <= g.step) { g.step = j; save(); route(); }
      });
      p.dataset.state = statev;

  function drawBottom(ctx, step) {
    var g = ctx.g;
    bottom.textContent = '';

    inner.appendChild(btn('big ghost', 'Stuck?', function () { stuckSheet(ctx, step); }));
    inner.appendChild(el('span', 'grow'));
    if (g.stars[step.index] > 0) {
      var nx = btn('big go', step.index === 4 ? 'Finish ✓' : 'Next step →', function () {
        if (step.index === 4) { go('case', ctx.c.id + '/done'); return; }
        g.step = Math.max(g.step, step.index + 1);

        route();
      });
      inner.appendChild(btn('big', 'Check again', function () { doMark(ctx, step); }));

      inner.appendChild(btn('big go', 'Check my answer', function () { doMark(ctx, step); }));
    }

  function doMark(ctx, step) {
    var g = ctx.g;
    var r = step.mark();
    var out = document.getElementById('verdict');
    out.textContent = '';
    var all = r.right === r.total;
    var v = el('div', 'verdict ' + (all ? 'ok' : 'no'));
    v.appendChild(icon(all ? 'tick' : 'cross'));
    v.appendChild(el('span', null, all ? (r.extra || 'All correct. ' + r.right + ' out of ' + r.total + '.')
      : r.right + ' out of ' + r.total + ' right. Fix these:'));
    out.appendChild(v);
    if (!all && r.fixes.length) {
      var ul = el('ul', 'fixlist');
      r.fixes.slice(0, 6).forEach(function (f) {
        var li = el('li');
        li.innerHTML = f;
        ul.appendChild(li);
      });
      if (r.fixes.length > 6) ul.appendChild(Object.assign(el('li'), { textContent: 'and ' + (r.fixes.length - 6) + ' more' }));
      out.appendChild(ul);
    }
    if (all) {
      var helped = g.helped[step.index];
      g.stars[step.index] = helped >= 2 ? 1 : helped === 1 ? 2 : 3;
      save();
      var sr = el('div', 'verdict ok');
      sr.style.marginTop = '8px';
      sr.appendChild(stars(g.stars[step.index]));
      sr.appendChild(el('span', null, g.stars[step.index] === 3 ? 'Three stars. No help used.'
        : g.stars[step.index] === 2 ? 'Two stars. You used a hint.' : 'One star. It was shown to you.'));
      out.appendChild(sr);
    }
    drawBottom(ctx, step);
    out.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function ddRows(ctx) {
    var c = ctx.c, g = ctx.g, out = [];
    c.tables.forEach(function (t) {
      out.push({ sep: t.name });
      var own = c.cols.filter(function (col) { return c.home[col] === t.name; });
      var links = (g.links[t.name] || []);
      var made = g.added[t.name] ? [g.added[t.name]] : [];
      var order = made.concat(t.role === 'join' ? links.concat(own) : own.concat(links));
      order.forEach(function (f) {
        var ty = c.types[f] || { type: '', size: [''] };
        var pr = (c.props.filter(function (p) { return p.field === f; })[0]) || { fmt: '—', valid: '—' };
        var isPk = t.pk.indexOf(f) >= 0;
        var isFk = links.indexOf(f) >= 0;
        var isNew = made.indexOf(f) >= 0;
        out.push({
          field: f, type: ty.type, size: ty.size[0],
          fmt: own.indexOf(f) >= 0 ? pr.fmt : '—',
          valid: own.indexOf(f) >= 0 ? pr.valid : '—',
          key: (isPk && isFk ? 'Primary + foreign' : isPk ? 'Primary key' : isFk ? 'Foreign key' : '')
            + (isNew ? ' (added)' : ''),
        });
      });
    });
    return out;
  }
  function ddTable(ctx) {
    var t = el('table', 'dd');
    var hr = el('tr');
    ['Field', 'Data type', 'Size', 'Format / mask', 'Validation', 'Key'].forEach(function (x) { hr.appendChild(el('th', null, x)); });
    var th = el('thead'); th.appendChild(hr); t.appendChild(th);
    var tb = el('tbody');
    ddRows(ctx).forEach(function (r) {
      var tr = el('tr');
      if (r.sep) {
        tr.className = 'sep';
        var td = el('td', null, r.sep);
        td.colSpan = 6;
        tr.appendChild(td);
      } else {
        [['k', r.field], ['', r.type], ['', r.size], ['k', r.fmt], ['k', r.valid], ['', r.key]]
          .forEach(function (cell) { tr.appendChild(el('td', cell[0], cell[1])); });
      }
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    return t;
  }
  function copyDD(ctx, b) {
    var lines = ddRows(ctx).map(function (r) {
      return r.sep ? '\n' + r.sep : [r.field, r.type, r.size, r.fmt, r.valid, r.key].join('\t');
    });
    var text = ctx.c.name + ' data dictionary\n' + lines.join('\n') + '\n';
    try {
      navigator.clipboard.writeText(text);
      b.lastChild.textContent = 'Copied';
      setTimeout(function () { b.lastChild.textContent = 'Copy'; }, 2000);
    } catch (e) {
      var ta = el('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e2) { }
      ta.remove();
    }
  }

      ]));
      var p = el('p', 'why', 'Short Text size is the most letters allowed. Currency, Date/Time, Yes/No and Long Text have no size at all.');
      p.style.marginTop = '10px';
      w.appendChild(p);
      return w;
    }],
    ['Input masks', function () {
      var w = el('div');
      w.appendChild(refTable(['Symbol', 'Means'], [
        ['0', 'a digit, must be typed'],
        ['9', 'a digit, optional'],
        ['L', 'a letter, must be typed'],
        ['>', 'everything after it becomes CAPITALS'],
        ['\\ ', 'a real space'],
      ]));
      var p = el('p', 'why');
      p.style.marginTop = '10px';
      w.appendChild(p);
      w.appendChild(refTable(['Mask', 'Accepts'], [
        ['>L00', 'C14'],
        ['>L0000', 'P2201'],
        ['>LLLL', 'SPIN'],
        ['>LL00\\ 0LL', 'B17 9QT'],
        ['00000\\ 000000', '07700 900412'],
      ]));
      return w;
    }],
    ['Validation', function () {
      var w = el('div');
      w.appendChild(refTable(['Rule', 'Refuses'], [
        ['>0', 'zero and anything negative'],
        ['>=0', 'anything negative'],
        ['<=Date()', 'any date in the future'],
        ['>=Date()', 'any date in the past'],
        ['Between 1 And 120', 'anything outside 1 to 120'],
        ['Is Not Null', 'an empty box'],
        ['Like "B## #??"', 'anything not shaped like B17 9QT'],
      ]));
      var p = el('p', 'why', 'Always write validation text too, so the user is told what went wrong.');
      p.style.marginTop = '10px';
      w.appendChild(p);
      return w;
    }],
    ['Query criteria', function () {
      return refTable(['Criteria', 'Finds'], [
        ['>20', 'more than 20'],
        ['>=60', '60 or more'],
        ['"Drama"', 'exactly Drama'],
        ['<>"Drama"', 'anything except Drama'],
        ['Like "The*"', 'starts with The'],
        ['Between 10 And 20', '10 to 20, both included'],
        ['#27/06/2026#', 'that exact date'],
        ['Is Null', 'empty boxes'],
      ]);
    }],
  ];
  function refTable(heads, rows) {
    var t = el('table', 'ref');
    var hr = el('tr');
    heads.forEach(function (h) { hr.appendChild(el('th', null, h)); });
    var th = el('thead'); th.appendChild(hr); t.appendChild(th);
    var tb = el('tbody');
    rows.forEach(function (r) {
      var tr = el('tr');
      r.forEach(function (cell, i) {
        var td = el('td');
        if (i === 0) td.appendChild(Object.assign(el('code'), { textContent: cell }));
        else td.textContent = cell;
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    return t;
  }
  function helpSheet(which) {
    openSheet('Help sheets', function (body, sh) {
      var tabs = el('div', 'tabs');
      var pane = el('div');
      var at = which || 0;
      function paint() {
        tabs.textContent = '';
        HELP.forEach(function (h, i) {
          tabs.appendChild(btn('tab' + (i === at ? ' on' : ''), h[0], function () { at = i; paint(); }));
        });
        pane.textContent = '';
        pane.appendChild(HELP[at][1]());
      }
      paint();
      sh.insertBefore(tabs, body);
      body.appendChild(pane);
      var wb = btn('wt-cta', null, function () { closeSheet(); window.WALK.open(); });
      wb.appendChild(Object.assign(el('span', 'play'), { textContent: '▶' }));
      var wt = el('div');
      wt.appendChild(Object.assign(el('b'), { textContent: 'Watch the worked example' }));
      wt.appendChild(Object.assign(el('span'), { textContent: 'One sheet taken to four tables, step by step.' }));
      wb.appendChild(wt);
      wb.style.marginTop = '18px';
      body.appendChild(wb);

      var reset = btn('tbtn', 'Clear all my work', function () {
        if (reset.dataset.sure) {
          try { localStorage.removeItem(KEY); } catch (e) { }
          location.hash = '';
          location.reload();
          return;
        }
        reset.dataset.sure = '1';
        reset.textContent = 'Really? Tap again to wipe everything';
        setTimeout(function () { delete reset.dataset.sure; reset.textContent = 'Clear all my work'; }, 4000);
      });
      reset.style.marginTop = '18px';
      body.appendChild(reset);
    });
  }

  /* ================================================================ boot */
  function boot() {
    load();
    root = document.body;
    var top = el('div', 'top');
    var logo = el('div', 'logo');
    logo.appendChild(icon('db'));
    var lb = btn('logo', null, function () { go('home'); });
    lb.style.cssText = 'background:none;border:0;padding:0;font:inherit;font-weight:800;letter-spacing:-.02em';
    lb.appendChild(icon('db'));
    lb.appendChild(document.createTextNode('Normalise It'));
    top.appendChild(lb);
    top.appendChild(el('span', 'grow'));
    var hb = btn('tbtn', null, function () { helpSheet(); });
    hb.appendChild(icon('help'));
    hb.appendChild(document.createTextNode('Help'));
    top.appendChild(hb);
    var tb = btn('tbtn icon', null, function () {
      var cur = document.documentElement.dataset.theme;
      var next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('nrm-theme', next); } catch (e) { }
    });
    tb.appendChild(icon('sun'));
    tb.setAttribute('aria-label', 'Switch between light and dark');
    top.appendChild(tb);
    document.body.appendChild(top);

    var wrap = el('div', 'wrap');
    wrap.id = 'app';
    document.body.appendChild(wrap);

    bottom = el('div', 'bottom hide');
    document.body.appendChild(bottom);

    window.addEventListener('hashchange', route);
    route();
    window.__nrm = {
      S: function () { return S; }, save: save, route: route, CASES: CASES,
      step: function () { return current; }, setup: setup, STEPS: STEPS, go: go,
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
