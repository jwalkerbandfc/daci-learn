<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access: Basic to Advanced</title>
<meta name="description" content="Interactive learning resource for Microsoft Access, from relational database foundations to advanced database design. Level 4 Higher Education.">
<!--
  ============================================================================
  ACCESS: BASIC TO ADVANCED
  Single-file interactive learning resource (HTML, CSS and vanilla JavaScript).
  Audience: Level 4 Higher Education students with little or no database
  experience.

  File structure
    1. <style>   Design tokens (:root), dark mode, layout, components
    2. <body>    Application shell: title bar, ribbon, navigation pane,
                 tabbed document area, status bar
    3. <script>  a. CONFIG: practice file labels on Canvas (edit these)
                 b. Storage wrapper (localStorage inside try/catch)
                 c. Practice database: schema and data
                 d. Query engine: expression parser, criteria, joins,
                    totals, SQL generation, domain aggregate functions
                 e. Saved queries used by the worked examples
                 f. Course content: Levels 1 to 5
                 g. Quizzes and reference entries
                 h. User interface: navigation, documents, Query Lab,
                    activities, quizzes, reference, progress

  The page works offline. Google Fonts are optional; system fonts are used
  as a fallback when there is no connection.
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   1. DESIGN TOKENS
   ========================================================================== */
:root{
  --burgundy:#7b1e2e;
  --burgundy-dark:#5a1420;
  --burgundy-mid:#93303f;
  --tint:#f7ecee;
  --tint-2:#ecd5da;
  --bg:#e9e9e9;
  --surface:#ffffff;
  --surface-alt:#f6f6f6;
  --surface-sunk:#efefef;
  --border:#bdbdbd;
  --border-soft:#dedede;
  --text:#1d1d1d;
  --text-muted:#555555;
  --accent:#7b1e2e;
  --on-accent:#ffffff;
  --link:#7b1e2e;
  --focus:#0b57d0;
  --ok:#1b6e35;  --ok-bg:#e6f3e9;
  --bad:#a1262d; --bad-bg:#fbe9ea;
  --warn:#6b4f00; --warn-bg:#fff5d6;
  --grid-head:#efefef;
  --grid-sel:#f3e1e5;
  --row-alt:#fafafa;
  --font:'Source Sans 3','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:'Source Code Pro',Consolas,'Cascadia Mono','Courier New',monospace;
  --radius:4px;
  --shadow:0 1px 3px rgba(0,0,0,.14);
  --nav-w:290px;
  color-scheme:light;
}
/* Dark palette: follows the operating system unless the learner picks a theme */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --burgundy:#7f2234; --burgundy-dark:#5e1624; --burgundy-mid:#9a3a4b;
    --tint:#35222a; --tint-2:#47303a;
    --bg:#141414; --surface:#1f1f1f; --surface-alt:#262626; --surface-sunk:#191919;
    --border:#4d4d4d; --border-soft:#343434;
    --text:#ececec; --text-muted:#b9b9b9;
    --accent:#f0a1ae; --on-accent:#1a1a1a; --link:#f3aab6; --focus:#8ab4f8;
    --ok:#86d69a; --ok-bg:#1c3324; --bad:#ff9d9d; --bad-bg:#3d1f21; --warn:#f0cf6c; --warn-bg:#382f13;
    --grid-head:#2a2a2a; --grid-sel:#3a2530; --row-alt:#232323;
    --shadow:0 1px 3px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --burgundy:#7f2234; --burgundy-dark:#5e1624; --burgundy-mid:#9a3a4b;
  --tint:#35222a; --tint-2:#47303a;
  --bg:#141414; --surface:#1f1f1f; --surface-alt:#262626; --surface-sunk:#191919;
  --border:#4d4d4d; --border-soft:#343434;
  --text:#ececec; --text-muted:#b9b9b9;
  --accent:#f0a1ae; --on-accent:#1a1a1a; --link:#f3aab6; --focus:#8ab4f8;
  --ok:#86d69a; --ok-bg:#1c3324; --bad:#ff9d9d; --bad-bg:#3d1f21; --warn:#f0cf6c; --warn-bg:#382f13;
  --grid-head:#2a2a2a; --grid-sel:#3a2530; --row-alt:#232323;
  --shadow:0 1px 3px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:16px; line-height:1.5;
  display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
}
a{color:var(--link)}
code,kbd,pre,.mono{font-family:var(--mono); font-size:.92em}
code{background:var(--surface-sunk); border:1px solid var(--border-soft); border-radius:3px; padding:0 .25em}
pre{margin:0}
h1,h2,h3,h4{line-height:1.25; margin:0 0 .5rem}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.08rem} h4{font-size:1rem}
p{margin:0 0 .75rem}
ul,ol{margin:0 0 .75rem; padding-left:1.4rem}
li{margin-bottom:.25rem}
.sr-only{position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.titlebar :focus-visible,.ribbon-tabs :focus-visible,.access-banner :focus-visible{outline-color:#ffffff}
.skip-link{position:absolute; left:8px; top:-60px; z-index:100; background:var(--surface); color:var(--text); padding:.5rem .8rem; border:2px solid var(--focus); border-radius:var(--radius)}
.skip-link:focus{top:8px}
svg.i{width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle}
svg.i.sm{width:14px; height:14px}
svg.i.lg{width:28px; height:28px}

/* ==========================================================================
   3. TITLE BAR AND RIBBON
   ========================================================================== */
.titlebar{
  background:var(--burgundy); color:#fff; display:flex; align-items:center; gap:.6rem;
  padding:.3rem .6rem; min-height:40px; flex:none;
}
.titlebar .app-icon{display:inline-flex; width:26px; height:26px; border-radius:4px; background:rgba(255,255,255,.16); align-items:center; justify-content:center}
.titlebar h1{font-size:1rem; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.titlebar .file-name{opacity:.92; font-weight:400}
.titlebar .spacer{flex:1}
.tb-btn{background:transparent; color:#fff; border:1px solid transparent; border-radius:var(--radius); padding:.25rem .5rem; font:inherit; font-size:.88rem; cursor:pointer; display:inline-flex; align-items:center; gap:.35rem; min-height:32px}
.tb-btn:hover{background:rgba(255,255,255,.14)}
.ribbon{flex:none; background:var(--surface); border-bottom:1px solid var(--border)}
.ribbon-tabs{background:var(--burgundy); display:flex; flex-wrap:wrap; padding:0 .4rem; gap:2px}
.ribbon-tab{
  background:transparent; color:#fff; border:0; font:inherit; font-size:.9rem; padding:.35rem .9rem;
  cursor:pointer; border-radius:var(--radius) var(--radius) 0 0; min-height:34px;
}
.ribbon-tab:hover{background:rgba(255,255,255,.14)}
.ribbon-tab[aria-selected="true"]{background:var(--surface); color:var(--accent); font-weight:600}
.ribbon-panel{display:flex; flex-wrap:wrap; align-items:stretch; gap:0; padding:.35rem .4rem; min-height:72px}
.r-group{display:flex; flex-direction:column; padding:0 .6rem; border-right:1px solid var(--border-soft)}
.r-group:last-child{border-right:0}
.r-group .r-items{display:flex; flex-wrap:wrap; gap:.25rem; align-items:center; flex:1}
.r-group .r-label{font-size:.72rem; color:var(--text-muted); text-align:center; margin-top:.15rem}
.r-btn{
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:.1rem;
  min-width:62px; min-height:44px; padding:.2rem .45rem; background:transparent; color:var(--text);
  border:1px solid transparent; border-radius:var(--radius); font:inherit; font-size:.8rem; cursor:pointer; line-height:1.15
}
.r-btn:hover{background:var(--tint); border-color:var(--tint-2)}
.r-btn[aria-pressed="true"]{background:var(--tint-2); border-color:var(--accent)}
.r-btn svg{color:var(--accent)}
.r-select,.r-input{font:inherit; font-size:.85rem; padding:.25rem .4rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); min-height:32px; max-width:220px}

/* ==========================================================================
   4. WORKSPACE: NAVIGATION PANE AND DOCUMENT AREA
   ========================================================================== */
.workspace{flex:1; display:flex; min-height:0; position:relative}
#navpane{
  width:var(--nav-w); flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0; transition:width .15s ease;
}
.nav-head{display:flex; align-items:center; gap:.3rem; padding:.4rem .5rem; border-bottom:1px solid var(--border-soft); background:var(--surface-alt)}
.nav-head h2{font-size:.9rem; margin:0; flex:1; font-weight:600}
.icon-btn{background:transparent; border:1px solid transparent; color:var(--text); border-radius:var(--radius); min-width:32px; min-height:32px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font:inherit}
.icon-btn:hover{background:var(--tint)}
.nav-search{padding:.4rem .5rem; border-bottom:1px solid var(--border-soft)}
.nav-search input{width:100%; font:inherit; font-size:.88rem; padding:.3rem .5rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text)}
#nav-tree{overflow:auto; flex:1; padding:.2rem 0 1rem}
.nav-group{border-bottom:1px solid var(--border-soft)}
.nav-group-h{
  width:100%; display:flex; align-items:center; gap:.4rem; background:var(--surface-alt); color:var(--text);
  border:0; font:inherit; font-size:.86rem; font-weight:600; padding:.4rem .5rem; cursor:pointer; text-align:left
}
.nav-group-h:hover{background:var(--tint)}
.nav-group-h .chev{transition:transform .15s}
.nav-group-h[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.nav-group-h .grp-title{flex:1}
.mini-bar{width:46px; height:6px; background:var(--border-soft); border-radius:3px; overflow:hidden; flex:none}
.mini-bar span{display:block; height:100%; background:var(--accent)}
.nav-items{list-style:none; margin:0; padding:.15rem 0}
.nav-items[hidden]{display:none}
.nav-item{
  width:100%; display:flex; align-items:center; gap:.4rem; background:transparent; color:var(--text);
  border:0; border-left:3px solid transparent; font:inherit; font-size:.86rem; padding:.28rem .5rem .28rem .9rem; cursor:pointer; text-align:left; line-height:1.3
}
.nav-item:hover{background:var(--tint)}
.nav-item[aria-current="page"]{background:var(--grid-sel); border-left-color:var(--accent); font-weight:600}
.nav-item .lbl{flex:1; min-width:0}
.nav-item .done{color:var(--ok)}
.nav-item svg{color:var(--accent)}
#navpane.collapsed{width:36px}
#navpane.collapsed .nav-search,#navpane.collapsed #nav-tree,#navpane.collapsed .nav-head h2{display:none}
#navpane.collapsed .nav-head{flex-direction:column; border-bottom:0; background:transparent}
.shutter-label{display:none; writing-mode:vertical-rl; font-size:.85rem; color:var(--text-muted); padding:.6rem 0}
#navpane.collapsed .shutter-label{display:block}

#doc-area{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg)}
.doc-tabs{display:flex; align-items:flex-end; gap:2px; padding:.35rem .4rem 0; overflow-x:auto; flex:none; border-bottom:1px solid var(--border); background:var(--surface-sunk)}
.doc-tab-wrap{display:flex; align-items:center; background:var(--surface-alt); border:1px solid var(--border); border-bottom:0; border-radius:var(--radius) var(--radius) 0 0; flex:none; max-width:240px}
.doc-tab-wrap.active{background:var(--surface); border-top:3px solid var(--accent)}
.doc-tab{background:transparent; border:0; color:var(--text); font:inherit; font-size:.84rem; padding:.3rem .4rem .3rem .6rem; cursor:pointer; display:flex; align-items:center; gap:.35rem; min-height:32px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px}
.doc-tab svg{color:var(--accent)}
.doc-tab-close{background:transparent; border:0; color:var(--text-muted); cursor:pointer; min-width:28px; min-height:28px; border-radius:3px; font-size:1rem; line-height:1}
.doc-tab-close:hover{background:var(--tint); color:var(--text)}
#doc-content{flex:1; overflow:auto; min-height:0; background:var(--surface)}
.doc-panel{padding:1.1rem 1.4rem 3rem}
.doc-panel[hidden]{display:none}
.doc{max-width:1000px; margin:0 auto}
.doc.wide{max-width:1400px}
.statusbar{flex:none; display:flex; gap:1rem; align-items:center; justify-content:space-between; background:var(--surface-alt); border-top:1px solid var(--border); padding:.15rem .7rem; font-size:.8rem; color:var(--text-muted); min-height:26px}
.statusbar .sb-right{display:flex; gap:.8rem; align-items:center}

/* ==========================================================================
   5. DOCUMENT COMPONENTS
   ========================================================================== */
.crumb{font-size:.85rem; color:var(--text-muted); margin-bottom:.25rem}
.doc-title{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:1rem}
.doc-title h2{font-size:1.5rem; margin:0}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin:0 0 1.1rem; box-shadow:var(--shadow)}
.panel > .panel-h{display:flex; align-items:center; gap:.5rem; padding:.5rem .8rem; background:var(--surface-alt); border-bottom:1px solid var(--border-soft); border-radius:var(--radius) var(--radius) 0 0}
.panel > .panel-h h3{margin:0; font-size:1rem}
.panel > .panel-h svg{color:var(--accent)}
.panel > .panel-b{padding:.8rem 1rem}
.panel.objectives > .panel-h{background:var(--tint)}
.panel.errors > .panel-h{background:var(--warn-bg)}
.panel.errors > .panel-h svg{color:var(--warn)}
.panel.predict{border-left:4px solid var(--accent)}
.lede{font-size:1.05rem}
.callout{border-left:4px solid var(--accent); background:var(--tint); padding:.6rem .8rem; border-radius:0 var(--radius) var(--radius) 0; margin:.6rem 0 .9rem}
.callout.note{border-left-color:var(--text-muted); background:var(--surface-alt)}
.example{border:1px dashed var(--border); border-radius:var(--radius); padding:.7rem .9rem; margin:.6rem 0 1rem; background:var(--surface-alt)}
.example > h4{display:flex; align-items:center; gap:.4rem}
.codeblock{font-family:var(--mono); font-size:.88rem; background:var(--surface-sunk); border:1px solid var(--border-soft); border-radius:var(--radius); padding:.55rem .75rem; white-space:pre-wrap; overflow-x:auto; margin:.4rem 0 .8rem}
.kv{display:grid; grid-template-columns:max-content 1fr; gap:.2rem .9rem; font-size:.92rem}
.kv dt{font-weight:600}
.kv dd{margin:0}
.btn{
  display:inline-flex; align-items:center; gap:.4rem; font:inherit; font-size:.9rem; padding:.4rem .85rem; min-height:36px;
  border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; text-decoration:none; line-height:1.2
}
.btn:hover{background:var(--tint); border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--burgundy-mid); color:#fff}
.btn.small{font-size:.82rem; padding:.2rem .55rem; min-height:30px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55; cursor:not-allowed}
.btn-row{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:.5rem 0}
.tag-access{
  display:inline-flex; align-items:center; gap:.25rem; font-size:.7rem; font-weight:700; letter-spacing:.02em;
  color:var(--accent); background:var(--tint); border:1px solid var(--accent); border-radius:999px; padding:0 .45rem; line-height:1.55; white-space:nowrap; flex:none
}
.tag{display:inline-block; font-size:.72rem; border:1px solid var(--border); border-radius:999px; padding:0 .45rem; color:var(--text-muted); white-space:nowrap}

/* Access task banner: deliberately solid and consistent so it is recognisable at a glance */
.access-banner{
  display:flex; gap:.9rem; align-items:flex-start; background:var(--burgundy); color:#fff; border-radius:var(--radius);
  padding:.9rem 1rem; margin:0 0 1.1rem; border:2px solid var(--burgundy-dark); box-shadow:var(--shadow)
}
.access-banner .ab-icon{flex:none; width:46px; height:46px; border-radius:6px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center}
.access-banner .ab-icon svg{width:30px; height:30px; color:#fff}
.access-banner h3{margin:0 0 .2rem; font-size:1.15rem; color:#fff}
.access-banner p{margin:0 0 .5rem}
.access-banner .ab-body{flex:1; min-width:0}
/* "Desktop Access required" strip inside the banner and on overview pages */
.ab-req{display:flex; gap:.55rem; align-items:flex-start; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.75); border-radius:var(--radius); padding:.5rem .7rem; margin:.3rem 0 .7rem}
.ab-req svg{width:22px; height:22px; flex:none; margin-top:.1rem}
.ab-req b{display:block; font-size:1.02rem; letter-spacing:.01em}
.ab-req span{font-size:.9rem}
.desk-callout{display:flex; gap:.6rem; align-items:flex-start; border:2px solid var(--accent); background:var(--tint); border-radius:var(--radius); padding:.6rem .8rem; margin:.4rem 0 1rem}
.desk-callout svg{color:var(--accent); width:24px; height:24px; flex:none}
.dl-btn{
  display:inline-flex; align-items:center; gap:.45rem; background:#fff; color:#5a1420; border:2px solid #fff; border-radius:var(--radius);
  padding:.4rem .85rem; font:inherit; font-weight:600; text-decoration:none; min-height:38px; cursor:pointer
}
.dl-btn:hover{background:#f7ecee}
.dl-btn.pending{background:transparent; color:#fff; border-style:dashed; cursor:not-allowed}
.dl-note{font-size:.85rem; opacity:.95; margin-top:.4rem}
.dl-block{margin:.4rem 0 .2rem}
.panel .dl-btn{border-color:var(--accent); color:var(--accent); background:var(--surface)}
.panel .dl-btn.pending{color:var(--text-muted); border-color:var(--border)}
.panel .dl-note{color:var(--text-muted)}
/* Canvas instructions: where students get the practice files */
.canvas-source{border:2px solid #fff; border-radius:var(--radius); padding:.55rem .75rem; background:rgba(255,255,255,.1)}
.canvas-source .cs-h{display:flex; align-items:center; gap:.45rem; font-weight:700; font-size:1rem}
.canvas-source .cs-h svg{width:22px; height:22px}
.canvas-source .cs-steps{margin:.35rem 0 0; padding-left:1.3rem; font-size:.92rem}
.canvas-source .cs-steps li{margin-bottom:.15rem}
.panel .canvas-source{border-color:var(--accent); background:var(--tint); color:var(--text)}
.panel .canvas-source .cs-h{color:var(--accent)}
ol.steps{counter-reset:s; list-style:none; padding-left:0}
ol.steps > li{counter-increment:s; position:relative; padding:.35rem 0 .35rem 2.4rem; border-bottom:1px solid var(--border-soft)}
ol.steps > li::before{content:counter(s); position:absolute; left:0; top:.35rem; width:1.7rem; height:1.7rem; border-radius:50%; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem}
.cmd{font-weight:600; background:var(--tint); border:1px solid var(--tint-2); border-radius:3px; padding:0 .3rem; white-space:nowrap}
.checklist{list-style:none; padding:0}
.checklist label{display:flex; gap:.55rem; align-items:flex-start; cursor:pointer; padding:.25rem 0}
.checklist input{width:20px; height:20px; margin-top:.15rem; accent-color:var(--accent); flex:none}

/* Questions and feedback */
fieldset.q{border:1px solid var(--border-soft); border-radius:var(--radius); padding:.6rem .8rem .7rem; margin:0 0 .9rem}
fieldset.q legend{font-weight:600; padding:0 .3rem}
.opt{display:flex; gap:.5rem; align-items:flex-start; padding:.3rem .4rem; border-radius:var(--radius); cursor:pointer}
.opt:hover{background:var(--surface-alt)}
.opt input{margin-top:.3rem; width:18px; height:18px; accent-color:var(--accent); flex:none}
.opt.correct{background:var(--ok-bg)}
.opt.incorrect{background:var(--bad-bg)}
.feedback{border-radius:var(--radius); padding:.55rem .75rem; margin-top:.5rem; border:1px solid var(--border-soft)}
.feedback.ok{background:var(--ok-bg); border-color:var(--ok); color:var(--text)}
.feedback.bad{background:var(--bad-bg); border-color:var(--bad); color:var(--text)}
.feedback.info{background:var(--surface-alt)}
.feedback .fb-h{font-weight:700; display:flex; align-items:center; gap:.35rem}
.feedback.ok .fb-h{color:var(--ok)}
.feedback.bad .fb-h{color:var(--bad)}
.text-answer{display:flex; gap:.5rem; flex-wrap:wrap; align-items:center}
.text-answer input,.field-input{font:inherit; padding:.35rem .55rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); min-height:36px}
.text-answer input{flex:1; min-width:180px; max-width:420px}
.mono-input{font-family:var(--mono)!important}
.errlist details{border:1px solid var(--border-soft); border-radius:var(--radius); margin-bottom:.5rem; background:var(--surface)}
.errlist summary{cursor:pointer; padding:.45rem .7rem; font-weight:600; list-style-position:inside}
.errlist summary code{font-weight:400}
.errlist .eb{padding:.1rem .8rem .6rem}
.complete-row{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6rem; border-top:1px solid var(--border-soft); padding-top:1rem; margin-top:1.4rem}
.badge-done{color:var(--ok); font-weight:600; display:inline-flex; gap:.3rem; align-items:center}

/* Datasheet */
.ds-wrap{overflow:auto; max-width:100%; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); max-height:460px}
table.datasheet{border-collapse:collapse; font-size:.86rem; min-width:100%}
table.datasheet th,table.datasheet td{border:1px solid var(--border-soft); padding:.22rem .5rem; text-align:left; white-space:nowrap}
table.datasheet thead th{background:var(--grid-head); position:sticky; top:0; z-index:1; font-weight:600; border-color:var(--border)}
table.datasheet tbody tr:nth-child(even) td{background:var(--row-alt)}
table.datasheet td.num{text-align:right; font-variant-numeric:tabular-nums}
table.datasheet td.sel,table.datasheet th.sel{width:20px; padding:0; background:var(--grid-head)}
table.datasheet td.nullv{color:var(--text-muted)}
table.datasheet input[type=checkbox]{width:15px; height:15px; margin:0; accent-color:var(--accent)}
.th-sort{display:flex; align-items:center; gap:.25rem}
.th-sort button{background:transparent; border:1px solid transparent; color:var(--text); border-radius:3px; cursor:pointer; padding:0 .2rem; min-width:22px; min-height:22px; font-size:.75rem}
.th-sort button:hover,.th-sort button[aria-pressed="true"]{background:var(--tint-2); border-color:var(--accent)}
.recnav{display:flex; gap:.6rem; align-items:center; font-size:.8rem; color:var(--text-muted); padding:.25rem .3rem; flex-wrap:wrap}
.view-switch{display:inline-flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden}
.view-switch button{background:var(--surface); color:var(--text); border:0; border-right:1px solid var(--border); font:inherit; font-size:.85rem; padding:.3rem .7rem; cursor:pointer; min-height:34px}
.view-switch button:last-child{border-right:0}
.view-switch button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); font-weight:600}
.filterbar{display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; margin:.5rem 0}
.filterbar select,.filterbar input{font:inherit; font-size:.88rem; padding:.25rem .45rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); min-height:34px}

/* Design View */
.design-grid{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:.9rem}
table.fieldlist{border-collapse:collapse; width:100%; font-size:.86rem}
table.fieldlist th,table.fieldlist td{border:1px solid var(--border-soft); padding:.25rem .45rem; text-align:left}
table.fieldlist thead th{background:var(--grid-head)}
table.fieldlist tbody tr{cursor:pointer}
table.fieldlist tbody tr[aria-selected="true"] td{background:var(--grid-sel)}
table.fieldlist button.fl-btn{background:transparent; border:0; font:inherit; color:var(--text); cursor:pointer; padding:0; text-align:left; display:flex; align-items:center; gap:.3rem; width:100%}
.props{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-alt)}
.props h4{padding:.4rem .6rem; margin:0; border-bottom:1px solid var(--border-soft); font-size:.9rem}
.props table{width:100%; border-collapse:collapse; font-size:.84rem}
.props td{border-bottom:1px solid var(--border-soft); padding:.25rem .55rem; vertical-align:top}
.props td:first-child{width:42%; color:var(--text-muted)}
.props td:last-child{font-family:var(--mono); font-size:.82rem; word-break:break-word}

/* Query Lab */
.lab-toolbar{display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; margin-bottom:.7rem}
.lab-section{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-alt); margin-bottom:.8rem}
.lab-section > .ls-h{display:flex; align-items:center; gap:.5rem; justify-content:space-between; flex-wrap:wrap; padding:.35rem .7rem; border-bottom:1px solid var(--border-soft); font-weight:600; font-size:.9rem}
.lab-section > .ls-b{padding:.6rem .7rem}
.table-pane{display:flex; flex-wrap:wrap; gap:.7rem; align-items:flex-start}
.tbox{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); min-width:150px; box-shadow:var(--shadow)}
.tbox h4{margin:0; font-size:.85rem; padding:.25rem .5rem; background:var(--tint); border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:center; gap:.4rem}
.tbox ul{list-style:none; margin:0; padding:.2rem 0; max-height:170px; overflow:auto}
.tbox li{margin:0}
.tbox li button{width:100%; text-align:left; background:transparent; border:0; color:var(--text); font:inherit; font-size:.82rem; padding:.12rem .5rem; cursor:pointer; display:flex; gap:.3rem; align-items:center}
.tbox li button:hover{background:var(--tint)}
.show-table{display:flex; flex-wrap:wrap; gap:.3rem .9rem; margin-bottom:.6rem; font-size:.88rem}
.show-table label{display:inline-flex; gap:.35rem; align-items:center; cursor:pointer}
.show-table input{width:17px; height:17px; accent-color:var(--accent)}
.joins{margin-top:.6rem; display:grid; gap:.4rem}
.join-row{display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; font-size:.85rem; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:.3rem .5rem}
.join-row select{font:inherit; font-size:.82rem; max-width:100%; padding:.2rem .3rem; border:1px solid var(--border); border-radius:3px; background:var(--surface); color:var(--text); min-height:32px}
.qgrid-wrap{overflow-x:auto; max-width:100%; border:1px solid var(--border); background:var(--surface)}
table.qgrid{border-collapse:collapse; font-size:.85rem}
table.qgrid th[scope=row]{background:var(--grid-head); text-align:left; padding:.2rem .5rem; position:sticky; left:0; z-index:1; border:1px solid var(--border); white-space:nowrap; font-weight:600; min-width:78px}
table.qgrid td{border:1px solid var(--border-soft); padding:0; min-width:150px}
table.qgrid td input[type=text],table.qgrid td select{width:100%; border:0; background:transparent; color:var(--text); font-family:var(--mono); font-size:.82rem; padding:.3rem .4rem; min-height:32px}
table.qgrid td select{font-family:var(--font)}
table.qgrid td input[type=text]:focus,table.qgrid td select:focus{background:var(--tint); outline:2px solid var(--focus); outline-offset:-2px}
table.qgrid td.chk{text-align:center}
table.qgrid td.chk input{width:18px; height:18px; accent-color:var(--accent); margin:.35rem}
table.qgrid thead th{background:var(--surface-alt); border:1px solid var(--border-soft); font-size:.75rem; color:var(--text-muted); font-weight:400; padding:.1rem}
table.qgrid.readonly td{padding:.25rem .45rem; font-family:var(--mono); font-size:.8rem; white-space:nowrap}
.results-grid{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:.8rem}
.sqlview{font-family:var(--mono); font-size:.86rem; white-space:pre-wrap; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.6rem .7rem; min-height:120px; margin:0; overflow-x:auto}
.msgbox{border:1px solid var(--bad); background:var(--bad-bg); border-radius:var(--radius); padding:.6rem .8rem; margin:.5rem 0; display:flex; gap:.6rem; align-items:flex-start}
.msgbox svg{color:var(--bad); flex:none; margin-top:.1rem}
.msgbox.warn{border-color:var(--warn); background:var(--warn-bg)}
.msgbox.warn svg{color:var(--warn)}
.msgbox .mb-title{font-weight:700}
.task-banner{border:2px solid var(--accent); background:var(--tint); border-radius:var(--radius); padding:.6rem .8rem; margin-bottom:.8rem}
.embed-q{margin:.5rem 0 1rem}
.embed-q .eq-cols{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:.7rem; margin-top:.5rem}
.embed-q h5{font-size:.82rem; margin:.2rem 0 .3rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em}

/* Modal dialog (Enter Parameter Value, confirmations) */
.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:1rem}
.modal{background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:6px; width:min(420px,100%); box-shadow:0 8px 30px rgba(0,0,0,.35)}
.modal h2{font-size:.95rem; margin:0; padding:.45rem .8rem; background:var(--burgundy); color:#fff; border-radius:6px 6px 0 0}
.modal .m-b{padding:.9rem 1rem}
.modal label{display:block; margin-bottom:.35rem}
.modal input{width:100%; font:inherit; padding:.35rem .5rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text)}
.modal .m-f{display:flex; justify-content:flex-end; gap:.5rem; padding:0 1rem 1rem}

/* Activities */
.rel-board{position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2.2rem 2.6rem; padding:1rem; background:var(--surface-sunk); border:1px solid var(--border); border-radius:var(--radius)}
.rel-board svg.rel-lines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
.rel-board .tbox{position:relative; z-index:1}
.rel-field{width:100%; text-align:left; background:transparent; border:1px solid transparent; color:var(--text); font:inherit; font-size:.85rem; padding:.2rem .5rem; cursor:grab; display:flex; gap:.3rem; align-items:center; border-radius:3px}
.rel-field:hover{background:var(--tint)}
.rel-field[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.rel-field.drop-target{outline:2px dashed var(--accent)}
.rel-dialog{border:2px solid var(--accent); border-radius:var(--radius); background:var(--surface); padding:.8rem 1rem; margin:.8rem 0}
.rel-dialog select{font:inherit; padding:.3rem .4rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); min-height:36px}
.rel-list{list-style:none; padding:0}
.rel-list li{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; border:1px solid var(--border-soft); border-radius:var(--radius); padding:.35rem .6rem; margin-bottom:.35rem; background:var(--surface)}
.norm-matrix{border-collapse:collapse; font-size:.88rem}
.norm-matrix th,.norm-matrix td{border:1px solid var(--border-soft); padding:.3rem .55rem; text-align:center}
.norm-matrix th[scope=row]{text-align:left; font-family:var(--mono); font-weight:400}
.norm-matrix thead th{background:var(--grid-head)}
.norm-matrix input{width:20px; height:20px; accent-color:var(--accent)}
.norm-matrix td.good{background:var(--ok-bg)}
.norm-matrix td.wrong{background:var(--bad-bg)}
.norm-preview{display:flex; flex-wrap:wrap; gap:.7rem; margin:.7rem 0}
.stage-tabs{display:flex; flex-wrap:wrap; gap:.3rem; margin-bottom:.7rem}
.stage-tabs .btn[aria-current="step"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
table.match{border-collapse:collapse; width:100%; font-size:.9rem}
table.match th,table.match td{border:1px solid var(--border-soft); padding:.35rem .5rem; text-align:left; vertical-align:top}
table.match thead th{background:var(--grid-head)}
table.match select{font:inherit; font-size:.88rem; padding:.25rem .35rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); min-height:34px; width:100%}
table.match td.good{background:var(--ok-bg)}
table.match td.wrong{background:var(--bad-bg)}
.tester{border:1px solid var(--border); border-radius:var(--radius); padding:.7rem .8rem; background:var(--surface-alt); margin:.5rem 0 1rem}
.tester .row{display:flex; flex-wrap:wrap; gap:.5rem; align-items:flex-end; margin-bottom:.5rem}
.tester label{display:flex; flex-direction:column; font-size:.85rem; gap:.2rem; flex:1; min-width:160px}
.tester output{display:block; font-family:var(--mono); font-size:.9rem; padding:.4rem .6rem; border-radius:var(--radius); background:var(--surface); border:1px solid var(--border-soft); min-height:2.2rem}

/* Reference and progress */
.ref-tools{display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-bottom:.8rem}
.ref-tools input[type=search]{flex:1; min-width:200px; font:inherit; padding:.4rem .6rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); min-height:38px}
.chip{background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:999px; padding:.15rem .7rem; font:inherit; font-size:.82rem; cursor:pointer; min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.ref-list{display:grid; gap:.6rem}
.ref-item{border:1px solid var(--border); border-radius:var(--radius); padding:.6rem .8rem; background:var(--surface)}
.ref-item h3{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; font-size:1rem; margin:0 0 .3rem; font-family:var(--mono)}
.ref-item .syn,.ref-item .ex{font-family:var(--mono); font-size:.85rem; background:var(--surface-sunk); border-radius:3px; padding:.15rem .4rem; display:block; margin:.25rem 0; white-space:pre-wrap; word-break:break-word}
.ref-item p{margin:.2rem 0}
.prog-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:.8rem}
.prog-card{border:1px solid var(--border); border-radius:var(--radius); padding:.7rem .9rem; background:var(--surface)}
.bar{height:10px; background:var(--border-soft); border-radius:5px; overflow:hidden; margin:.35rem 0 .5rem}
.bar span{display:block; height:100%; background:var(--accent)}
.prog-card dl{display:grid; grid-template-columns:1fr auto; gap:.15rem .6rem; font-size:.88rem; margin:0}
.prog-card dd{margin:0; font-weight:600}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.7rem; margin:.6rem 0 1rem}
.card-btn{text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.7rem .8rem; cursor:pointer; color:var(--text); font:inherit; display:flex; flex-direction:column; gap:.3rem; min-height:90px}
.card-btn:hover{border-color:var(--accent); background:var(--tint)}
.card-btn .ct{font-weight:700; display:flex; gap:.4rem; align-items:center}
.card-btn .cd{font-size:.86rem; color:var(--text-muted)}
.schema-fig{max-width:100%; height:auto; display:block; margin:.5rem 0}
.schema-wrap{overflow-x:auto; max-width:100%}
.schema-wrap svg{min-width:640px}

/* Static mock-ups of forms and reports (illustrations only) */
.form-mock,.report-mock{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); max-width:560px; padding:.7rem .9rem; font-size:.88rem; box-shadow:var(--shadow); margin:.5rem 0}
.fm-title,.rm-title{font-weight:700; font-size:1.05rem; color:var(--accent); border-bottom:2px solid var(--accent); padding-bottom:.25rem; margin-bottom:.5rem}
.fm-row{display:grid; grid-template-columns:110px minmax(0,1fr) minmax(0,1fr); gap:.5rem; align-items:center; margin:.25rem 0}
.fm-box{border:1px solid var(--border); background:var(--surface-alt); padding:.1rem .4rem; border-radius:2px; min-height:1.6em}
.fm-box.calc{background:var(--tint)}
.fm-note{font-size:.75rem; color:var(--text-muted)}
.fm-nav{margin-top:.5rem; font-size:.78rem; color:var(--text-muted); border-top:1px solid var(--border-soft); padding-top:.3rem}
.fm-sub{border:1px solid var(--border); margin:.5rem 0; font-size:.82rem}
.fm-sub > div{display:grid; grid-template-columns:minmax(0,1fr) 80px; border-bottom:1px solid var(--border-soft); padding:.1rem .4rem}
.fm-subh{background:var(--grid-head); font-weight:600}
.fm-btns{display:flex; gap:.4rem; flex-wrap:wrap}
.fm-btn{border:1px solid var(--border); background:var(--surface-alt); border-radius:3px; padding:.1rem .6rem; font-size:.8rem}
.fm-tabs{display:flex; flex-wrap:wrap; gap:2px; margin-bottom:.5rem}
.fm-tabs span{border:1px solid var(--border); padding:.1rem .5rem; font-size:.8rem; background:var(--surface-alt)}
.fm-tabs span.on{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.rm-grp{font-weight:700; margin-top:.5rem; background:var(--tint); padding:.1rem .4rem}
.rm-row{display:flex; justify-content:space-between; padding:.05rem .4rem .05rem 1.4rem; border-bottom:1px dotted var(--border-soft)}
.rm-more{color:var(--text-muted); font-style:italic; margin-top:.4rem}

/* ==========================================================================
   6. RESPONSIVE
   ========================================================================== */
@media (max-width:1100px){
  .results-grid,.embed-q .eq-cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  :root{--nav-w:280px}
  #navpane{position:absolute; top:0; bottom:0; left:0; z-index:40; transform:translateX(-102%); visibility:hidden; transition:transform .18s ease, visibility .18s; box-shadow:4px 0 16px rgba(0,0,0,.25)}
  #navpane.open{transform:none; visibility:visible}
  #navpane.collapsed{width:var(--nav-w)}
  #navpane.collapsed .nav-search,#navpane.collapsed #nav-tree,#navpane.collapsed .nav-head h2{display:revert}
  #navpane.collapsed #nav-tree{display:block}
  #navpane.collapsed .nav-head{flex-direction:row}
  #navpane.collapsed .shutter-label{display:none}
  .design-grid{grid-template-columns:minmax(0,1fr)}
  .rel-board{grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.6rem}
  .doc-panel{padding:.9rem .9rem 3rem}
  .titlebar .file-name{display:none}
}
@media (min-width:901px){ #nav-open-btn{display:none} }
@media (max-width:560px){
  .rel-board{grid-template-columns:minmax(0,1fr)}
  .r-btn{min-width:54px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
@media print{
  .titlebar,.ribbon,#navpane,.doc-tabs,.statusbar{display:none}
  body{height:auto; overflow:visible}
  #doc-content{overflow:visible}
}
</style>

  function makeDate(y, m, d) {

      }

    const s = (c, min) => { const t = exprSql(c, fieldSql); return precOf(c) < min ? '(' + t + ')' : t; };
    switch (n.k) {
      case 'num': return String(n.v);
      case 'str': return '"' + n.v.replace(/"/g, '""') + '"';
      case 'date': return '#' + fmtUS(n.v) + '#';
      case 'bool': return n.v ? 'True' : 'False';
      case 'null': return 'Null';
      case 'implicit': return fieldSql || '';
      case 'ref': return n.table ? sqlName(n.table) + '.' + sqlName(n.name) : '[' + n.name + ']';
      case 'call': return canonicalFn(n.name) + '(' + n.args.map(a => exprSql(a, fieldSql)).join(',') + ')';

      case 'bin': { const p = PREC[n.op]; const op = n.op === 'Mod' ? ' Mod ' : n.op; return s(n.l, p) + op + s(n.r, p + 1); }

      case 'between': return s(n.l, 5) + (n.neg ? ' Not' : '') + ' Between ' + s(n.lo, 5) + ' And ' + s(n.hi, 5);
      case 'in': return s(n.l, 5) + (n.neg ? ' Not' : '') + ' In (' + n.list.map(x => exprSql(x, fieldSql)).join(',') + ')';
      case 'isnull': return s(n.l, 5) + ' Is ' + (n.neg ? 'Not ' : '') + 'Null';

      case 'and': return s(n.l, 2) + ' And ' + s(n.r, 3);

  }

  /* ---------- Compile a design grid definition ----------
     def = { tables:[...], joins:{ 'Customers-Orders':'inner'|'parent'|'child' },
             totals:bool, cols:[{ field, table, total, sort, show, crit:[c,or,or2] }] } */
  const TOTALS = ['Group By', 'Sum', 'Avg', 'Min', 'Max', 'Count', 'First', 'Last', 'Where'];
  function compile(def) {

    const totals = !!def.totals;
    const cols = []; let exprN = 0;
    (def.cols || []).forEach((c, idx) => {
      const raw = String(c.field || '').trim();

      const col = {
        idx, raw, sort: c.sort || '', show: c.show !== false,
        total: totals ? (c.total || 'Group By') : null,
        critText: [0, 1, 2].map(r => String((c.crit || [])[r] || '').trim())

      if (totals && !TOTALS.includes(col.total)) throw new QueryError('Choose a valid option in the Total row of column ' + (idx + 1) + '.', 'syntax');
      let m;
      if (raw === '*' || /\.\*$/.test(raw)) {

        const t = findTable(tn);
        if (!t || !tables.includes(t)) throw new QueryError('Choose the table for the * field in column ' + (idx + 1) + '.', 'syntax');
        if (totals) throw new QueryError('Cannot group on fields selected with \'*\'.', 'totals');

      } else if ((m = raw.match(/^([^:[\]"'#()]+?)\s*:\s*(.+)$/))) {

      } else {
        let name = raw; let scope;
        const dot = raw.match(/^\[?([A-Za-z_][\w ]*)\]?\.\[?([^\]]+)\]?$/);
        const tn = String(c.table || '').trim();

        else if (tn && findTable(tn)) { scope = [findTable(tn)]; name = raw.replace(/^\[|\]$/g, ''); }
        else { scope = tables; name = raw.replace(/^\[|\]$/g, ''); }
        const hits = scope.filter(t => tables.includes(t) && findField(t, name));
        if (hits.length === 1) {
          col.kind = 'field'; col.table = hits[0]; col.fieldDef = findField(hits[0], name);
          col.ast = { k: 'ref', table: hits[0].name, name: col.fieldDef.name };
        } else if (hits.length > 1) {
          col.kind = 'expr'; col.ambiguous = true; col.alias = null; col.ast = { k: 'ref', table: null, name };
        } else {
          col.kind = 'expr'; col.alias = null; col.exprText = raw; col.ast = parse(raw, 'expr');
        }
      }
      if (col.kind === 'expr' && !col.alias && !col.ambiguous) { exprN++; col.alias = 'Expr' + exprN; col.autoAlias = true; }
      if (totals && col.total === 'Where') col.show = false;
      col.crit = col.critText.map(t => (t ? parse(t, 'criteria') : null));
      if (col.kind === 'star' && col.crit.some(Boolean)) throw new QueryError('Criteria cannot be applied to a * field. Add the field to its own column instead.', 'syntax');
      if (col.kind === 'star' && col.sort) throw new QueryError('Cannot sort on fields selected with \'*\'. Add the field to its own column to sort by it.', 'syntax');
      if (col.kind === 'field' && (!totals || col.total === 'Group By' || col.total === 'Where' || ['Min', 'Max', 'First', 'Last'].includes(col.total))) {
        col.crit.forEach(a => { if (a) checkMismatch(a, col.fieldDef.type); });
      }
      cols.push(col);
    });
    /* Aliases that other columns can refer to */
    const aliasMap = new Map();
    cols.forEach(c => { if (c.kind === 'expr' && c.alias) aliasMap.set(c.alias.toLowerCase(), c); });
    /* Circular reference check (for example UnitPrice: [UnitPrice]*1.2) */
    const visiting = new Set(); const done = new Set();
    function visit(c) {
      if (done.has(c)) return;
      if (visiting.has(c)) throw new QueryError('Circular reference caused by alias \'' + c.alias + '\' in query definition\'s SELECT list.', 'circular');
      visiting.add(c);
      walk(c.ast, n => { if (n.k === 'ref' && !n.table) { const d = aliasMap.get(n.name.toLowerCase()); if (d) visit(d); } });
      visiting.delete(c); done.add(c);
    }
    cols.forEach(c => { if (c.kind === 'expr') visit(c); });
    /* Parameters: any name that is not a field or alias prompts for a value */
    const params = []; const seen = new Set();
    const addParam = p => { const k = p.toLowerCase(); if (!seen.has(k)) { seen.add(k); params.push(p); } };
    const checkRef = n => {
      if (n.k !== 'ref') return;
      if (n.table) {
        const t = tables.find(x => x.name.toLowerCase() === n.table.toLowerCase());
        if (!t || !findField(t, n.name)) addParam(n.table + '.' + n.name);
        return;
      }
      if (aliasMap.has(n.name.toLowerCase())) return;
      if (tables.some(t => findField(t, n.name))) return;
      addParam(n.name);
    };
    cols.forEach(c => { if (c.ast) walk(c.ast, checkRef); c.crit.forEach(a => walk(a, checkRef)); });
    return { def, tables, cols, totals, aliasMap, params };
  }

  /* ---------- Joins ---------- */
  function prefixRow(t, r) { const o = {}; t.fields.forEach(f => { o[t.name + '.' + f.name] = r[f.name]; }); return o; }
  function nullRow(ts) { const o = {}; ts.forEach(t => t.fields.forEach(f => { o[t.name + '.' + f.name] = null; })); return o; }
  function joinKey(r) { return r.a + '-' + r.b; }
  function buildFrom(tables, joins) {
    joins = joins || {};
    const remaining = tables.slice(); const first = remaining.shift();
    let rows = first.rows.map(r => prefixRow(first, r));
    let sql = first.name; const joined = [first]; let nJoins = 0; let hasComma = false;
    const optional = new Set(); const warnings = []; const used = [];
    while (remaining.length) {
      let idx = -1, rel = null;
      for (let k = 0; k < remaining.length && idx < 0; k++) {
        const t = remaining[k];
        const r = rels.find(x => (x.a === t.name && joined.some(j => j.name === x.b)) || (x.b === t.name && joined.some(j => j.name === x.a)));
        if (r) { idx = k; rel = r; }
      }
      if (idx < 0) {
        const t = remaining.shift(); const out = [];
        rows.forEach(l => t.rows.forEach(r => out.push(Object.assign({}, l, prefixRow(t, r)))));
        rows = out; sql = sql + ', ' + t.name; hasComma = true; joined.push(t);
        warnings.push('No relationship joins ' + t.name + ' to the other tables in this query, so every record is combined with every other record (a Cartesian product). Add the linking table or check the relationships.');
        continue;
      }
      const t = remaining.splice(idx, 1)[0];
      const type = joins[joinKey(rel)] || 'inner';
      const tIsChild = rel.b === t.name;
      const otherName = tIsChild ? rel.a : rel.b;
      const otherField = tIsChild ? rel.af : rel.bf;
      const tField = tIsChild ? rel.bf : rel.af;
      let keepLeft = false, keepRight = false;
      if (type === 'parent') { if (tIsChild) keepLeft = true; else keepRight = true; }
      if (type === 'child') { if (tIsChild) keepRight = true; else keepLeft = true; }
      if (!keepLeft && !keepRight && (optional.has(t.name) || optional.has(otherName))) throw new QueryError(AMBIGUOUS_OUTER, 'ambiguous');
      if ((keepLeft || keepRight) && optional.has(otherName) && keepRight) throw new QueryError(AMBIGUOUS_OUTER, 'ambiguous');
      const out = []; const matchedRight = new Set();
      rows.forEach(l => {
        const lv = l[otherName + '.' + otherField]; let any = false;
        t.rows.forEach((r, ri) => {
          if (lv != null && r[tField] != null && compare(lv, r[tField]) === 0) { out.push(Object.assign({}, l, prefixRow(t, r))); any = true; matchedRight.add(ri); }
        });
        if (!any && keepLeft) out.push(Object.assign({}, l, nullRow([t])));
      });
      if (keepRight) t.rows.forEach((r, ri) => { if (!matchedRight.has(ri)) out.push(Object.assign(nullRow(joined), prefixRow(t, r))); });
      rows = out;
      const kw = keepLeft ? 'LEFT JOIN' : keepRight ? 'RIGHT JOIN' : 'INNER JOIN';
      const left = (nJoins > 0 || hasComma) ? '(' + sql + ')' : sql;
      const on = tIsChild ? rel.a + '.' + rel.af + ' = ' + rel.b + '.' + rel.bf : rel.b + '.' + rel.bf + ' = ' + rel.a + '.' + rel.af;
      sql = left + ' ' + kw + ' ' + t.name + ' ON ' + on;
      if (keepLeft) optional.add(t.name);
      if (keepRight) joined.forEach(j => optional.add(j.name));
      used.push({ rel, type });
      joined.push(t); nJoins++;
    }
    return { rows, sql, warnings, used };
  }

  /* ---------- Row context for queries ---------- */
  function paramValue(env, name) {
    const key = Object.keys(env.params || {}).find(k => k.toLowerCase() === name.toLowerCase());
    if (key === undefined) throw new QueryError('No value given for the parameter \'' + name + '\'.', 'param');
    const v = env.params[key];
    return v === '' || v == null ? null : v;
  }
  function rowCtx(q, row, env) {
    return {
      implicit: null,
      ref(table, name) {
        if (table) {
          const t = q.tables.find(x => x.name.toLowerCase() === table.toLowerCase());
          const f = t && findField(t, name);
          if (f) return row[t.name + '.' + f.name];
          return paramValue(env, table + '.' + name);
        }
        const ac = q.aliasMap.get(name.toLowerCase());
        if (ac) return evalCol(q, ac, row, env);
        const hits = q.tables.filter(t => findField(t, name));
        if (hits.length > 1) throw new QueryError('The specified field \'[' + name + ']\' could refer to more than one table listed in the FROM clause of your SQL statement.', 'ambiguous');
        if (hits.length === 1) { const f = findField(hits[0], name); return row[hits[0].name + '.' + f.name]; }
        return paramValue(env, name);
      }
    };
  }
  function evalCol(q, col, row, env) {
    if (env.cache.has(col)) return env.cache.get(col);
    if (env.stack.has(col)) throw new QueryError('Circular reference caused by alias \'' + col.alias + '\' in query definition\'s SELECT list.', 'circular');
    env.stack.add(col);
    const v = evaluate(col.ast, rowCtx(q, row, env));
    env.stack.delete(col); env.cache.set(col, v);
    return v;
  }
  function condRows(q, filter) {
    const out = [];
    for (let r = 0; r < 3; r++) {
      const cells = q.cols.filter(c => filter(c) && c.crit[r]).map(c => ({ col: c, ast: c.crit[r] }));
      if (cells.length) out.push(cells);
    }
    return out;
  }
  function passes(q, rowsOfCells, row, env, valueOf) {
    if (!rowsOfCells.length) return true;
    return rowsOfCells.some(cells => cells.every(({ col, ast }) => {
      const ctx = rowCtx(q, row, env); ctx.implicit = () => valueOf(col);
      return tri(evaluate(ast, ctx)) === true;
    }));
  }
  function sortCompare(a, b) {
    if (a == null && b == null) return 0;
    if (a == null) return -1;
    if (b == null) return 1;
    return compare(a, b);
  }
  function groupKey(v) {
    if (v == null) return 'null';
    if (v instanceof Date) return 'd' + v.getTime();
    if (typeof v === 'number') return 'n' + cleanNum(v);
    if (typeof v === 'boolean') return 'b' + v;
    return 's' + String(v).toLowerCase();
  }
  function aggregate(fn, vals) {
    const nn = vals.filter(v => v != null);
    switch (fn) {
      case 'Count': return nn.length;
      case 'Sum': return nn.length ? cleanNum(nn.reduce((s, v) => s + toNum(v), 0)) : null;
      case 'Avg': return nn.length ? cleanNum(nn.reduce((s, v) => s + toNum(v), 0) / nn.length) : null;
      case 'Min': return nn.length ? nn.reduce((m, v) => (compare(v, m) < 0 ? v : m)) : null;
      case 'Max': return nn.length ? nn.reduce((m, v) => (compare(v, m) > 0 ? v : m)) : null;
      case 'First': return vals.length ? vals[0] : null;
      case 'Last': return vals.length ? vals[vals.length - 1] : null;
    }
    return null;
  }
  function exprType(q, ast) {
    let hasCat = false, cur = false, num = false, date = false;
    walk(ast, n => {
      if (n.k === 'cat') hasCat = true;
      if (n.k === 'ref') {
        let f = null;
        if (n.table) { const t = findTable(n.table); f = t && findField(t, n.name); }
        else { const t = q.tables.find(x => findField(x, n.name)); f = t && findField(t, n.name); if (!f) { const a = q.aliasMap.get(n.name.toLowerCase()); if (a && a.ast !== ast) { const ty = exprType(q, a.ast); if (ty === 'Currency') cur = true; } } }
        if (f) { if (f.type === 'Currency') cur = true; else if (f.type === 'Number') num = true; else if (f.type === 'Date/Time') date = true; }
      }

    if (cur) return 'Currency';
    if (num) return 'Number';
    if (date) return 'Calculated';
    return 'Calculated';
  }
  function colLabel(col) {
    if (col.kind === 'field') return col.fieldDef.name;
    if (col.ambiguous) return col.ast.name;
    return col.alias;
  }

  /* ---------- Run ---------- */
  function run(def, params) {
    const q = compile(def);
    const missing = q.params.filter(p => !Object.keys(params || {}).some(k => k.toLowerCase() === p.toLowerCase()));
    if (missing.length) throw new QueryError('No value given for the parameter \'' + missing[0] + '\'.', 'param');
    const from = buildFrom(q.tables, def.joins);
    const newEnv = () => ({ params: params || {}, cache: new Map(), stack: new Set() });
    const shown = q.cols.filter(c => c.show);
    if (!shown.length) throw new QueryError('Query must have at least one destination field.', 'empty');
    const sortCols = q.cols.filter(c => c.sort === 'Ascending' || c.sort === 'Descending');
    let outCols = []; let outRows = [];

    if (!q.totals) {
      const conds = condRows(q, () => true);
      let recs = from.rows.map(row => ({ row, env: newEnv() }));
      recs = recs.filter(r => passes(q, conds, r.row, r.env, c => evalCol(q, c, r.row, r.env)));
      recs.forEach(r => { r.sv = sortCols.map(c => evalCol(q, c, r.row, r.env)); });
      recs.sort((a, b) => { for (let k = 0; k < sortCols.length; k++) { const d = sortCompare(a.sv[k], b.sv[k]); if (d) return sortCols[k].sort === 'Descending' ? -d : d; } return 0; });
      shown.forEach(c => {
        if (c.kind === 'star') c.table.fields.forEach(f => outCols.push({ name: f.name, table: c.table.name, type: f.type, get: r => r.row[c.table.name + '.' + f.name] }));
        else if (c.kind === 'field') outCols.push({ name: c.fieldDef.name, table: c.table.name, type: c.fieldDef.type, get: r => evalCol(q, c, r.row, r.env) });
        else outCols.push({ name: colLabel(c), table: null, type: exprType(q, c.ast), get: r => evalCol(q, c, r.row, r.env) });
      });
      outRows = recs.map(r => outCols.map(oc => oc.get(r)));
    } else {
      const whereConds = condRows(q, c => c.total === 'Where');
      const havingConds = condRows(q, c => c.total !== 'Where');
      const rows = from.rows.filter(row => { const env = newEnv(); return passes(q, whereConds, row, env, c => evalCol(q, c, row, env)); });
      const groupCols = q.cols.filter(c => c.total === 'Group By');
      const groups = new Map();
      rows.forEach(row => {
        const env = newEnv();
        const gv = groupCols.map(c => evalCol(q, c, row, env));
        const key = JSON.stringify(gv.map(groupKey));
        if (!groups.has(key)) groups.set(key, { gv, rows: [] });
        groups.get(key).rows.push(row);
      });
      if (!groupCols.length && !groups.size) groups.set('all', { gv: [], rows: [] });
      let gs = [...groups.values()].map(g => {
        const vals = new Map();
        q.cols.forEach(c => {
          if (c.total === 'Where') return;
          if (c.total === 'Group By') vals.set(c, g.gv[groupCols.indexOf(c)]);
          else vals.set(c, aggregate(c.total, g.rows.map(row => evalCol(q, c, row, newEnv()))));
        });
        return { vals };
      });
      gs = gs.filter(g => passes(q, havingConds, null, newEnv(), c => g.vals.get(c)));
      const sc = sortCols.filter(c => c.total !== 'Where');
      gs.sort((a, b) => { for (const c of sc) { const d = sortCompare(a.vals.get(c), b.vals.get(c)); if (d) return c.sort === 'Descending' ? -d : d; } return 0; });
      shown.forEach(c => {
        let name, type;
        const base = c.kind === 'field' ? c.fieldDef.type : exprType(q, c.ast);
        if (c.total === 'Group By') { name = colLabel(c); type = base; }
        else {
          name = (c.kind === 'field') ? c.total + 'Of' + c.fieldDef.name : colLabel(c);
          type = c.total === 'Count' ? 'Number' : (c.total === 'Avg' && base !== 'Currency' ? 'Number' : base);
        }
        outCols.push({ name, table: c.kind === 'field' ? c.table.name : null, type, get: g => g.vals.get(c) });
      });
      outRows = gs.map(g => outCols.map(oc => oc.get(g)));
    }
    /* Duplicate column names are qualified with the table name, as in Access */
    const counts = {}; outCols.forEach(c => { counts[c.name] = (counts[c.name] || 0) + 1; });
    const columns = outCols.map(c => ({ name: counts[c.name] > 1 && c.table ? c.table + '.' + c.name : c.name, type: c.type }));
    return { columns, rows: outRows, sql: toSQL(def, q), warnings: from.warnings, params: q.params };
  }

  /* ---------- SQL generation ---------- */
  function fieldRef(c) { return sqlName(c.table.name) + '.' + sqlName(c.fieldDef.name); }
  function baseSql(c) { return c.kind === 'field' ? fieldRef(c) : exprSql(c.ast, ''); }
  function selectSql(c, totals) {
    if (c.kind === 'star') return c.table.name + '.*';
    if (totals && c.total !== 'Group By' && c.total !== 'Where') {
      const name = c.kind === 'field' ? c.total + 'Of' + c.fieldDef.name : c.alias;
      return c.total + '(' + baseSql(c) + ') AS ' + sqlName(name);
    }
    if (c.kind === 'field') return fieldRef(c);
    if (c.ambiguous) return '[' + c.ast.name + ']';
    return exprSql(c.ast, '') + ' AS ' + sqlName(c.alias);
  }
  function condSql(c, totals) {
    if (totals && c.total !== 'Group By' && c.total !== 'Where') return c.total + '(' + baseSql(c) + ')';
    if (c.kind === 'field') return fieldRef(c);
    const e = exprSql(c.ast, '');
    return c.ast.k === 'ref' ? e : '(' + e + ')';
  }
  function rowsSql(rowsOfCells, totals) {
    const parts = rowsOfCells.map(cells => {
      const items = cells.map(({ col, ast }) => {
        const t = exprSql(ast, condSql(col, totals));
        return (cells.length > 1 && (ast.k === 'or')) ? '(' + t + ')' : t;
      });
      return items.join(' AND ');
    });
    if (parts.length === 1) return parts[0];
    return parts.map(p => '(' + p + ')').join(' OR ');
  }
  function toSQL(def, compiled) {
    const q = compiled || compile(def);
    const from = buildFrom(q.tables, def.joins);
    const shown = q.cols.filter(c => c.show);
    const lines = [];
    lines.push('SELECT ' + (shown.length ? shown.map(c => selectSql(c, q.totals)).join(', ') : ''));
    lines.push('FROM ' + from.sql);
    if (!q.totals) {
      const w = condRows(q, () => true);
      if (w.length) lines.push('WHERE ' + rowsSql(w, false));
    } else {
      const w = condRows(q, c => c.total === 'Where');
      if (w.length) lines.push('WHERE ' + rowsSql(w, false));
      const g = q.cols.filter(c => c.total === 'Group By');
      if (g.length) lines.push('GROUP BY ' + g.map(c => baseSql(c)).join(', '));
      const h = condRows(q, c => c.total !== 'Where');
      if (h.length) lines.push('HAVING ' + rowsSql(h, true));
    }
    const sc = q.cols.filter(c => (c.sort === 'Ascending' || c.sort === 'Descending') && !(q.totals && c.total === 'Where'));
    if (sc.length) lines.push('ORDER BY ' + sc.map(c => condSql(c, q.totals).replace(/^\((.*)\)$/, '$1') + (c.sort === 'Descending' ? ' DESC' : '')).join(', '));
    return lines.join('\n') + ';';
  }

  /* ---------- Testers used by the learning activities ---------- */
  /* Validation rule tester: returns pass/fail as Access would apply it */
  function testRule(rule, valueText, type) {
    const ast = parse(rule, 'criteria');

<p class="lede">A <b>database</b> is an organised collection of data. A <b>relational database</b> stores that data in several related tables, so that each fact is recorded once and linked to other facts through matching key values.</p>
<p>Storing everything in one large spreadsheet causes repetition. If a customer places ten orders, a spreadsheet often repeats the customer's name, address and email ten times. A relational database stores the customer once in a <code>Customers</code> table and records each order in an <code>Orders</code> table that refers back to the customer by number. This reduces storage, avoids conflicting copies of the same data and makes updates simpler.</p>
<h3>Access database objects</h3>
<div class="kv" role="list">
  <dt>Tables</dt><dd>Store the data. Every other object depends on tables.</dd>
  <dt>Queries</dt><dd>Ask questions of the data: select, filter, sort, calculate, join tables and change records in bulk.</dd>
  <dt>Forms</dt><dd>Provide a screen for entering, editing and viewing data one record at a time.</dd>
  <dt>Reports</dt><dd>Present data for printing or sharing, often grouped and summarised.</dd>
  <dt>Macros</dt><dd>Automate tasks with a list of actions, such as opening a form when a button is clicked.</dd>
  <dt>Modules</dt><dd>Contain VBA (Visual Basic for Applications) code for more complex automation.</dd>
</div>
<div class="example"><h4><svg class="i"><use href="#ic-db"/></svg>Worked example: the RetailPractice database</h4>

  <li><code>Customers</code> (10 records): who buys from the business.</li>

<p class="lede">A <b>primary key</b> is a field, or combination of fields, that identifies every record in a table uniquely. In Design View it is marked with a key symbol.</p>
<p>A primary key must be:</p>
<ul>
  <li><b>Unique</b>: no two records can have the same value.</li>
  <li><b>Never empty</b>: every record must have a value (it cannot be Null).</li>
  <li><b>Stable</b>: the value should not need to change over time.</li>
</ul>
<p>Names, dates of birth and email addresses are poor keys: two people can share a name, and emails change. Many designers therefore use a <b>surrogate key</b>, an AutoNumber with no meaning outside the database, such as <code>CustomerID</code>. A <b>natural key</b> uses real-world data that is genuinely unique, such as an ISBN for books. A <b>composite key</b> combines two or more fields, for example <code>OrderID</code> plus <code>ProductID</code> in an order lines table.</p>

<p class="lede"><b>Sorting</b> changes the order in which records are displayed. <b>Filtering</b> hides records that do not meet a condition. Neither changes or deletes the stored data.</p>
<ul>
  <li><b>Ascending</b> sorts A to Z, smallest to largest and earliest to latest. <b>Descending</b> reverses this.</li>
  <li>Blank (Null) values appear first in an ascending sort.</li>
  <li>A filter is temporary. To reuse a condition, save it as a query (Level 3).</li>

  body: `
<p class="lede">A <b>validation rule</b> is a condition that every value in a field must satisfy. <b>Validation text</b> is the message Access displays when a value breaks the rule.</p>
<p>Field validation rules are written without the field name, exactly like query criteria. Access compares each new value against the rule.</p>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Rule</th><th scope="col">Meaning</th></tr></thead><tbody>
<tr><td><code>&gt;0</code></td><td>Greater than zero</td></tr>
<tr><td><code>&gt;=1 And &lt;=100</code></td><td>Between 1 and 100 inclusive (same as <code>Between 1 And 100</code>)</td></tr>
<tr><td><code>In ("Card","PayPal","Bank Transfer")</code></td><td>One of a list of values</td></tr>
<tr><td><code>&lt;=Date()</code></td><td>Today or earlier (no future dates)</td></tr>
<tr><td><code>Like "??###"</code></td><td>Two characters followed by three digits</td></tr>
<tr><td><code>Is Null Or Like "*?@?*.?*"</code></td><td>Blank, or a simple email pattern</td></tr>
</tbody></table></div>
<div class="callout"><b>Blank values pass most rules.</b> A rule such as <code>&gt;0</code> evaluates to Null (unknown) for a blank value, and Access accepts it. If the field must have a value, also set <b>Required</b> to Yes.</div>
<p>A <b>table validation rule</b> (set in the table's Property Sheet) can compare fields in the same record. The <code>Orders</code> table uses <code>[ShippedDate]&gt;=[OrderDate] Or [ShippedDate] Is Null</code>.</p>
<div class="example"><h4><svg class="i"><use href="#ic-check"/></svg>Worked example: testing the Quantity rule</h4>

</div>`,

  body: `
<p class="lede">An <b>input mask</b> controls how data is typed into a field by providing a template of placeholder characters. It helps users enter consistently formatted values.</p>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Character</th><th scope="col">Meaning</th></tr></thead><tbody>
<tr><td><code>0</code></td><td>Digit, required</td></tr>
<tr><td><code>9</code></td><td>Digit or space, optional</td></tr>
<tr><td><code>L</code></td><td>Letter, required</td></tr>
<tr><td><code>?</code></td><td>Letter, optional</td></tr>
<tr><td><code>A</code> / <code>a</code></td><td>Letter or digit, required / optional</td></tr>
<tr><td><code>&amp;</code> / <code>C</code></td><td>Any character, required / optional</td></tr>
<tr><td><code>&gt;</code> / <code>&lt;</code></td><td>Convert the following characters to upper / lower case</td></tr>
<tr><td><code>\\</code></td><td>Display the next character literally (for example <code>\\ </code> for a space)</td></tr>
</tbody></table></div>
<p>A mask can have three sections separated by semicolons: the mask itself; <code>0</code> to store the literal characters (such as spaces) or <code>1</code>/blank to store only typed characters; and the placeholder character shown while typing, such as <code>_</code>.</p>
<div class="example"><h4><svg class="i"><use href="#ic-pencil"/></svg>Worked example: a student ID mask</h4>
<p>Student IDs at a college have two letters followed by four digits, always shown in capitals, for example <code>ST1234</code>. The mask <code>&gt;LL0000</code> requires two letters (converted to capitals) and four digits. Try it in the tester, including entries that should fail.</p>
<div data-embed="mask" data-mask="&gt;LL0000" data-value="st1234"></div>
<div class="callout note">UK postcodes vary in length (M1 1AE, SW1A 2AA), so a single positional mask does not fit them well. A validation rule using <code>Like</code>, or Short Text with Field Size 8, is usually a better choice.</div>
</div>`,

  body: `
<p class="lede">A <b>foreign key</b> is a field in one table that stores the primary key value of a record in another table. It is how tables are linked.</p>
<ul>
  <li><code>Orders.CustomerID</code> is a foreign key referring to <code>Customers.CustomerID</code>.</li>
  <li><code>OrderDetails.OrderID</code> refers to <code>Orders.OrderID</code>, and <code>OrderDetails.ProductID</code> refers to <code>Products.ProductID</code>.</li>
</ul>
<p>The foreign key must have the same data type as the primary key it matches. Because AutoNumber is a Long Integer, a foreign key matching an AutoNumber key must be <b>Number</b> with Field Size <b>Long Integer</b>.</p>
<h3>Lookup fields</h3>
<p>A <b>lookup field</b> shows a drop-down list (combo box) when entering data. There are two kinds:</p>
<ul>
  <li><b>Value list</b>: a fixed list typed into the Row Source, such as <code>"Card";"PayPal";"Bank Transfer"</code> for PaymentMethod.</li>
  <li><b>Table or query</b>: values taken from another table. <code>Orders.CustomerID</code> uses <code>SELECT CustomerID, LastName FROM Customers</code>, so users pick a surname, but the <b>bound column</b> (CustomerID) is what is stored.</li>
</ul>
<p>Lookups are created with the <b>Lookup Wizard</b> option in the Data Type list in Design View.</p>
<div class="example"><h4><svg class="i"><use href="#ic-link"/></svg>Worked example: the Orders table structure</h4>
<p>Open Design View and select <code>CustomerID</code> to see its lookup properties (Display Control, Row Source and Bound Column).</p>
<div data-embed="table" data-id="Orders" data-view="design" data-field="CustomerID"></div>
</div>`,

{
  id: 'l2t5', level: 2, obj: 'table', title: 'Relationship types and junction tables',

    'Distinguish between one-to-one, one-to-many and many-to-many relationships.',
    'Design a junction table to resolve a many-to-many relationship.',

  body: `
<p class="lede">A <b>relationship</b> links two tables through a primary key and a matching foreign key.</p>
<ul>
  <li><b>One-to-many (1:&infin;)</b>: one record in the first table relates to many in the second. One customer places many orders. This is the most common type.</li>
  <li><b>One-to-one (1:1)</b>: each record relates to at most one record in the other table. Used to separate optional or confidential data, such as a student's support plan.</li>
  <li><b>Many-to-many (&infin;:&infin;)</b>: many records on each side relate to many on the other. A student books many courses and a course has many students. Access cannot store this directly.</li>
</ul>
<h3>Junction tables</h3>
<p>A many-to-many relationship is resolved with a <b>junction table</b> containing the primary keys of both tables as foreign keys. The junction table forms a one-to-many relationship with each side. In RetailPractice, <code>OrderDetails</code> is the junction table between <code>Orders</code> and <code>Products</code>: an order contains many products, and a product appears on many orders.</p>
<div class="example"><h4><svg class="i"><use href="#ic-link"/></svg>Worked example: a college course booking system</h4>
<p>The college stores <code>Students</code>, <code>Courses</code>, <code>Tutors</code>, <code>Bookings</code> and <code>StudentSupport</code>. In the activity below, drag a field onto its matching field in another table (or select one field, then select the other) and choose the relationship type.</p>
<div data-embed="activity" data-id="rel"></div>
</div>`,

  body: `
<p class="lede"><b>Referential integrity</b> is a set of rules that keeps relationships valid. When it is enforced, Access will not allow a foreign key value that has no matching primary key, and will not delete a record that other records depend on.</p>
<ul>
  <li>Without it, an order could refer to customer 99, who does not exist. Such an order is an <b>orphan record</b>.</li>
  <li>With it, Access blocks the change and displays an error.</li>
</ul>
<h3>Cascade options</h3>
<p><b>Cascade Update Related Fields</b>: if a primary key value changes, Access changes the matching foreign keys automatically. This is rarely needed with AutoNumber keys, which cannot be edited.</p>
<p><b>Cascade Delete Related Records</b>: deleting a record also deletes all its related records. This is powerful and dangerous: deleting one customer could remove years of order history.</p>
<div class="example"><h4><svg class="i"><use href="#ic-link"/></svg>Worked example: deleting customer 1</h4>
<p>Amira Khan (CustomerID 1) has orders 1001, 1003 and 1012. These orders have 2, 1 and 2 order lines respectively.</p>
<ul>
  <li>Referential integrity enforced, no cascade delete: Access refuses with "The record cannot be deleted or changed because table 'Orders' includes related records."</li>
  <li>Cascade delete enabled on both relationships: Access warns that related records will also be deleted, then removes 1 customer, 3 orders and 5 order lines.</li>
</ul>
</div>`,

  id: 'l2t7', level: 2, obj: 'table', title: 'Normalisation to Third Normal Form',

    'Evaluate a table design against the rules of each normal form.'
  ],
  body: `
<p class="lede"><b>Normalisation</b> is a step-by-step process for organising data into tables so that each fact is stored once. It reduces redundancy and prevents <b>anomalies</b>: problems when inserting, updating or deleting data.</p>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Form</th><th scope="col">Rule</th><th scope="col">Action</th></tr></thead><tbody>
<tr><td>UNF</td><td>Unnormalised: data as collected, often with repeating groups</td><td>List all the fields</td></tr>
<tr><td>1NF</td><td>No repeating groups; every field holds a single (atomic) value; each table has a primary key</td><td>Move repeating groups to a new table, keeping the original key as part of the new key</td></tr>
<tr><td>2NF</td><td>In 1NF and no <b>partial dependencies</b>: every non-key field depends on the whole of a composite key</td><td>Move fields that depend on only part of the key to a new table</td></tr>
<tr><td>3NF</td><td>In 2NF and no <b>transitive dependencies</b>: non-key fields depend only on the key, not on other non-key fields</td><td>Move fields that depend on another non-key field to a new table</td></tr>
</tbody></table></div>
<p>A common summary is that every non-key field must depend on "the key, the whole key and nothing but the key".</p>
<h3>Anomalies in an unnormalised design</h3>
<ul>
  <li><b>Update anomaly</b>: a customer's email is stored on every order, so changing it means editing many rows; missing one leaves conflicting data.</li>
  <li><b>Insertion anomaly</b>: a new product cannot be recorded until someone orders it.</li>
  <li><b>Deletion anomaly</b>: deleting the only order for a product also deletes the only record of that product's price.</li>
</ul>
<div class="example"><h4><svg class="i"><use href="#ic-layers"/></svg>Worked example: normalising an order form</h4>
<p>The activity below starts with an unnormalised order form and takes it through each normal form. The final design matches the RetailPractice tables.</p>
<div data-embed="activity" data-id="norm"></div>
</div>`,

<p class="lede">The <b>Like</b> operator matches text against a pattern. <b>Between...And</b> matches a range of values, including both end points.</p>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Pattern</th><th scope="col">Matches</th><th scope="col">Example matches</th></tr></thead><tbody>
<tr><td><code>Like "L*"</code></td><td>Begins with L (<code>*</code> = any number of characters)</td><td>Leeds, Leicester, London</td></tr>
<tr><td><code>Like "*son"</code></td><td>Ends with "son"</td><td>Wilson</td></tr>
<tr><td><code>Like "*Hub*"</code></td><td>Contains "Hub" anywhere</td><td>USB-C Hub</td></tr>
<tr><td><code>Like "?a*"</code></td><td><code>?</code> = exactly one character, so "a" is the second letter</td><td>Daniel, Jack</td></tr>
<tr><td><code>Like "[A-H]*"</code></td><td>Begins with a letter from A to H</td><td>Bennett, Evans, Hughes</td></tr>
<tr><td><code>Like "##*"</code></td><td><code>#</code> = one digit</td><td>27-inch Monitor</td></tr>
<tr><td><code>Between 10 And 50</code></td><td>10 to 50 inclusive</td><td>18.99, 27.50, 45.00</td></tr>
</tbody></table></div>
<p>Use <code>Not Like</code> to exclude a pattern. Without Like, the * is treated as an ordinary character, so <code>"L*"</code> on its own looks for the text L* exactly. (Access usually adds Like for you when you type a wildcard.)</p>

  body: `
<p class="lede">The layout of the criteria rows controls the logic:</p>
<ul>
  <li><b>Same row</b> = <b>And</b>: a record must meet every criterion on that row.</li>
  <li><b>Different rows</b> (Criteria, then Or) = <b>Or</b>: a record is returned if it meets all the criteria on <i>any one</i> row.</li>
  <li>Within one cell: <code>"Audio" Or "Video"</code>, or <code>&gt;10 And &lt;50</code>.</li>
</ul>
<p>A common mistake is to forget that each Or row is checked separately. If a condition must apply to both alternatives, repeat it on each row.</p>
<h3>Null values</h3>
<p><b>Null</b> means no value has been entered. Use <code>Is Null</code> to find blanks and <code>Is Not Null</code> to find values. You cannot use <code>=Null</code>, because nothing is ever equal to an unknown value.</p>
<div class="example"><h4><svg class="i"><use href="#ic-query"/></svg>Worked example 1: London members, or anyone in Leeds</h4>

  objectives: [

    'Diagnose unexpected "Enter Parameter Value" prompts and circular references.'
  ],
  body: `
<p class="lede">A <b>calculated field</b> creates a new column from an expression. Type a name, a colon, then the expression in the Field row: <code>LineTotal: [Quantity]*[UnitPrice]</code>.</p>
<ul>
  <li>Field names in expressions go in square brackets.</li>
  <li>Operators: <code>+ - * /</code>, and <code>&amp;</code> to join text: <code>FullName: [FirstName] &amp; " " &amp; [LastName]</code>.</li>
  <li>The calculated value is not stored; it is recalculated each time the query runs. This keeps it accurate and follows normalisation rules.</li>
  <li>You can sort and set criteria on a calculated field like any other column.</li>
</ul>
<h3>Parameter queries</h3>
<p>A <b>parameter</b> is a prompt in square brackets used in place of a fixed value, for example <code>[Enter city name:]</code> under City. When the query runs, Access shows an <b>Enter Parameter Value</b> box, so one query can answer many similar questions. Combine with Like for partial matches: <code>Like "*" &amp; [Enter part of the name:] &amp; "*"</code>.</p>
<p>Access treats <i>any</i> name in square brackets that is not a field as a parameter. A misspelt field name therefore produces an unexpected prompt.</p>
<div class="example"><h4><svg class="i"><use href="#ic-query"/></svg>Worked example 1: order line totals over £100</h4>
<div data-embed="query" data-id="qryLineTotals"></div>
<h4><svg class="i"><use href="#ic-query"/></svg>Worked example 2: customers in a chosen city</h4>
<p>The results below show what happens when <b>Leeds</b> is entered. Open it in the Query Lab and try other cities.</p>
<div data-embed="query" data-id="qryCustomersByCity"></div>
</div>`,

{

    'Apply an outer join with Is Null to find unmatched records.'
  ],
  body: `
<p class="lede">When you add related tables to a query, Access joins them using the relationship line. The <b>join type</b> decides which records appear.</p>
<ul>
  <li><b>Inner join</b> (join type 1, the default): only records with a match in both tables. Customers without orders are not shown.</li>
  <li><b>Left outer join</b> (type 2): all records from the first table, plus matching records from the second. Unmatched fields are Null.</li>
  <li><b>Right outer join</b> (type 3): all records from the second table, plus matches from the first.</li>
</ul>
<p>In Access, double-click the join line in Query Design to open <b>Join Properties</b> and choose the option. In the Query Lab, use the join selector under the table pane.</p>
<p>Combining an outer join with <code>Is Null</code> on the second table's key finds records with no match, such as customers who have never ordered. This is what the <b>Find Unmatched Query Wizard</b> builds.</p>
<div class="example"><h4><svg class="i"><use href="#ic-query"/></svg>Worked example 1: orders placed by Amira Khan (inner join)</h4>
<div data-embed="query" data-id="qryKhanOrders"></div>
<h4><svg class="i"><use href="#ic-query"/></svg>Worked example 2: customers who have never ordered (left join)</h4>
<div data-embed="query" data-id="qryCustomersWithoutOrders"></div>
</div>`,
