  body: `
<p class="lede">A <b>totals query</b> groups records and calculates a summary for each group. Select <span class="cmd">Query Design &gt; Totals</span> (&Sigma;) to add the <b>Total</b> row to the grid.</p>
<div class="kv">
  <dt>Group By</dt><dd>Creates one row per distinct value.</dd>
  <dt>Sum, Avg, Min, Max</dt><dd>Total, average, smallest and largest value in each group.</dd>
  <dt>Count</dt><dd>Number of non-blank values in each group.</dd>
  <dt>Where</dt><dd>Filters records <i>before</i> grouping; the field is not shown.</dd>
</div>
<p>Only include the fields you want to group by. Adding an extra Group By field such as OrderID creates one row per order instead of one per city.</p>
<p>Access names aggregate columns automatically, for example <code>CountOfOrderID</code>. Give a calculated column its own name: <code>Sales: [Quantity]*[UnitPrice]</code> with Total set to Sum.</p>
<div class="example"><h4><svg class="i"><use href="#ic-sigma"/></svg>Worked example 1: number of orders per city</h4>
<div data-embed="query" data-id="qryOrdersPerCity"></div>
<h4><svg class="i"><use href="#ic-sigma"/></svg>Worked example 2: sales value by category</h4>
<div data-embed="query" data-id="qrySalesByCategory"></div>
</div>
<h3>Crosstab queries</h3>
<p>A <b>crosstab query</b> summarises data in a grid, like a spreadsheet pivot table: one field supplies the row headings, another the column headings, and a third is summarised in the cells. Create one with <span class="cmd">Create &gt; Query Wizard &gt; Crosstab Query Wizard</span> or <span class="cmd">Query Design &gt; Crosstab</span>.</p>
<div class="example"><h4><svg class="i"><use href="#ic-chart"/></svg>Worked example 3: orders by payment method and month</h4>
<p>Row heading: PaymentMethod. Column heading: <code>Format([OrderDate],"mmm")</code>. Value: Count of OrderID.</p>
<div data-embed="crosstab"></div>
<p>By default Access sorts text column headings alphabetically (Apr, Feb, Jan...). Set the query's <b>Column Headings</b> property to <code>"Jan","Feb","Mar","Apr","May"</code> to fix the order, as above.</p>
</div>`,

  body: `
<p class="lede"><b>Action queries</b> change data: they add, update or delete records, or create a new table. They cannot be undone, so always back up the database first and preview the records in Datasheet View before running.</p>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Type</th><th scope="col">Purpose</th><th scope="col">SQL example</th></tr></thead><tbody>
<tr><td>Make-table</td><td>Creates a new table from query results</td><td><code>SELECT Customers.* INTO CustomersArchive FROM Customers WHERE DateJoined&lt;#1/1/2024#;</code></td></tr>
<tr><td>Append</td><td>Adds records to an existing table</td><td><code>INSERT INTO CustomersArchive SELECT Customers.* FROM Customers WHERE ...;</code></td></tr>
<tr><td>Update</td><td>Changes values in existing records</td><td><code>UPDATE Products SET UnitPrice=[UnitPrice]*1.05 WHERE Category="Accessories";</code></td></tr>
<tr><td>Delete</td><td>Removes records</td><td><code>DELETE FROM Products WHERE Discontinued=True;</code></td></tr>
</tbody></table></div>
<p>Action queries are shown with an exclamation mark in their icon in the navigation pane, as a warning that opening them changes data.</p>
<div class="example"><h4><svg class="i"><use href="#ic-bulb"/></svg>Worked example: a 5% price rise for accessories</h4>

<p>Referential integrity still applies to action queries. A delete query cannot remove a product that appears in OrderDetails unless cascade delete is enabled.</p>
</div>`,

  body: `
<p class="lede">Every Access query is stored as an <b>SQL</b> (Structured Query Language) statement. The design grid is a visual way of writing it. Select <span class="cmd">Home &gt; View &gt; SQL View</span> to see or edit the SQL.</p>
<div class="codeblock">SELECT Customers.FirstName, Customers.LastName
FROM Customers
WHERE Customers.City="London"
ORDER BY Customers.LastName;</div>
<div class="kv">
  <dt>SELECT</dt><dd>The fields to show (Field row with Show ticked).</dd>
  <dt>FROM</dt><dd>The tables and how they are joined.</dd>
  <dt>WHERE</dt><dd>Criteria applied to records (Criteria and Or rows).</dd>
  <dt>GROUP BY</dt><dd>Grouping for totals queries.</dd>
  <dt>HAVING</dt><dd>Criteria applied to groups after totals are calculated.</dd>
  <dt>ORDER BY</dt><dd>Sort order (ASC is the default; DESC for descending).</dd>
</div>
<p>Access SQL differs slightly from other database systems: it uses <code>*</code> and <code>?</code> as wildcards, <code>#</code> around dates (always month/day/year), double quotes for text, and <code>True</code>/<code>False</code> for Yes/No fields. A statement ends with a semicolon.</p>
<div class="example"><h4><svg class="i"><use href="#ic-sql"/></svg>Worked example: reading a join in SQL</h4>
<div class="codeblock">SELECT Customers.FirstName, Customers.LastName, Orders.OrderID, Orders.OrderDate
FROM Customers INNER JOIN Orders ON Customers.CustomerID = Orders.CustomerID
WHERE Customers.LastName="Khan"
ORDER BY Orders.OrderDate;</div>
<p>The FROM clause names both tables and the ON clause states the matching fields. Every query in the Query Lab shows its SQL alongside the results, so you can compare the grid with the statement it produces.</p>
<div data-embed="query" data-id="qryKhanOrders" data-sqlonly="1"></div>
</div>`,

  body: `
<p class="lede">A <b>form</b> is a screen for entering, editing and viewing records. Forms make databases easier and safer to use than working in tables directly.</p>
<h3>Creating forms</h3>
<ul>
  <li><span class="cmd">Create &gt; Form</span> builds a form instantly from the selected table or query.</li>
  <li><span class="cmd">Create &gt; Form Wizard</span> lets you choose fields, a layout (Columnar, Tabular, Datasheet or Justified) and a title.</li>
  <li><span class="cmd">Create &gt; Form Design</span> starts from a blank design.</li>
</ul>
<h3>Views</h3>
<p><b>Form View</b> is for using the form. <b>Layout View</b> shows live data while you resize and arrange controls. <b>Design View</b> gives full control over sections, properties and controls, but shows no data.</p>
<h3>Controls</h3>
<div class="kv">
  <dt>Bound control</dt><dd>Linked to a field through its <b>Control Source</b> property. Changes are saved to the table.</dd>
  <dt>Unbound control</dt><dd>No Control Source: labels, titles, lines, images, or text boxes used for temporary input.</dd>
  <dt>Calculated control</dt><dd>Control Source begins with =, for example <code>=[FirstName] &amp; " " &amp; [LastName]</code>. Displays a result but cannot be edited.</dd>
</div>
<p>The form's <b>Record Source</b> property names the table or query it displays. Open the <b>Property Sheet</b> with <span class="cmd">Form Design &gt; Property Sheet</span> (or F4).</p>
<h3>Layouts</h3>
<p>A <b>stacked</b> layout places labels to the left of each control, one record per screen. A <b>tabular</b> layout places labels across the top with one record per row. Apply them with <span class="cmd">Arrange &gt; Stacked</span> or <span class="cmd">Arrange &gt; Tabular</span>.</p>
<div class="example"><h4><svg class="i"><use href="#ic-form"/></svg>Worked example: frmCustomers (stacked layout)</h4>
<div class="form-mock" role="img" aria-label="Mock-up of a customer form with labels on the left and text boxes on the right showing Amira Khan's record">
  <div class="fm-title">Customer details</div>
  <div class="fm-row"><span>CustomerID</span><span class="fm-box">1</span><span class="fm-note">bound (AutoNumber, locked)</span></div>
  <div class="fm-row"><span>FirstName</span><span class="fm-box">Amira</span><span class="fm-note">bound</span></div>
  <div class="fm-row"><span>LastName</span><span class="fm-box">Khan</span><span class="fm-note">bound</span></div>
  <div class="fm-row"><span>City</span><span class="fm-box">London</span><span class="fm-note">bound</span></div>
  <div class="fm-row"><span>Full name</span><span class="fm-box calc">Amira Khan</span><span class="fm-note">calculated: =[FirstName] &amp; " " &amp; [LastName]</span></div>
  <div class="fm-row"><span>Member</span><span class="fm-box">&#9745;</span><span class="fm-note">bound check box</span></div>
  <div class="fm-nav">Record: 1 of 10</div>
</div>
</div>`,

<p class="lede">A <b>subform</b> is a form placed inside another form. It shows the "many" side of a one-to-many relationship: an order on the main form, with its order lines in the subform.</p>
<ul>
  <li>The subform control's <b>Link Master Fields</b> and <b>Link Child Fields</b> properties (both <code>OrderID</code>) keep the subform synchronised with the main form.</li>
  <li>The quickest method is the Form Wizard: choose fields from both Orders and OrderDetails and select <b>Form with subform(s)</b>.</li>
</ul>
<h3>Combo boxes</h3>
<p>A <b>combo box</b> shows a drop-down list. For Orders.CustomerID, it can list customer names while storing the CustomerID:</p>
<div class="kv">
  <dt>Row Source</dt><dd><code>SELECT CustomerID, LastName &amp; ", " &amp; FirstName FROM Customers ORDER BY LastName;</code></dd>
  <dt>Column Count</dt><dd><code>2</code></dd>
  <dt>Column Widths</dt><dd><code>0cm;4cm</code> (hides the ID column)</dd>
  <dt>Bound Column</dt><dd><code>1</code> (stores CustomerID)</dd>
  <dt>Limit To List</dt><dd><code>Yes</code></dd>
</div>
<h3>Command buttons</h3>
<p>With <span class="cmd">Form Design &gt; Use Control Wizards</span> switched on, drawing a <b>Button</b> starts the Command Button Wizard. Choose a category (Record Navigation, Record Operations, Form Operations, Report Operations) and an action, such as Go To Next Record or Close Form. The wizard writes an embedded macro (Level 5).</p>

  body: `
<p class="lede">Report <b>sections</b> control where information appears and how often it is repeated.</p>
<div class="kv">
  <dt>Report Header / Footer</dt><dd>Once at the start / end of the report: title, grand totals.</dd>
  <dt>Page Header / Footer</dt><dd>Top / bottom of every page: column headings, page numbers, print date.</dd>
  <dt>Group Header / Footer</dt><dd>Before / after each group: group name, subtotals.</dd>
  <dt>Detail</dt><dd>Once for every record.</dd>
</div>
<h3>Calculated controls</h3>
<ul>
  <li>Detail: <code>=[Quantity]*[UnitPrice]</code> gives each line total.</li>
  <li>Group footer: <code>=Sum([Quantity]*[UnitPrice])</code> gives the subtotal for the group.</li>
  <li>Report footer: the same expression gives the grand total.</li>
  <li>Page footer: <code>="Page " &amp; [Page] &amp; " of " &amp; [Pages]</code>.</li>
</ul>
<p>Sum works on fields and expressions, not on the names of other calculated controls. Repeat the expression inside Sum.</p>
<h3>Preparing to print</h3>
<p>In Print Preview, use <span class="cmd">Print Preview &gt; Margins</span>, <span class="cmd">Portrait</span> or <span class="cmd">Landscape</span>, and <span class="cmd">Page Setup</span>. Blank pages usually mean the report is wider than the page minus the margins. Set a group's <b>Keep Together</b> option to keep a group on one page, and a section's <b>Force New Page</b> property to start each group on a new page.</p>
<div class="example"><h4><svg class="i"><use href="#ic-report"/></svg>Worked example: rptSalesByCategory</h4>
<p>Based on a query joining OrderDetails and Products, grouped by Category, with a line total in the Detail section and <code>=Sum([Quantity]*[UnitPrice])</code> in the group and report footers. These subtotals match the totals query in Level 3:</p>
<div data-embed="query" data-id="qrySalesByCategory" data-resultsonly="1"></div>
<p>The report footer grand total is <b>£2,022.91</b>.</p>
</div>`,

<p class="lede">The <b>Expression Builder</b> helps you write expressions without typing every name. Open it by selecting the build button (...) next to a property, by pressing <kbd>Ctrl</kbd>+<kbd>F2</kbd>, or with <span class="cmd">Query Design &gt; Builder</span>.</p>
<p>It has three panes: <b>Expression Elements</b> (functions, tables, queries, forms, constants and operators), <b>Expression Categories</b> and <b>Expression Values</b>. Double-click an item to insert it. The builder also shows IntelliSense suggestions while you type.</p>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Function</th><th scope="col">Example</th><th scope="col">Result</th></tr></thead><tbody>
<tr><td>IIf</td><td><code>IIf([StockLevel]=0,"Out of stock","In stock")</code></td><td>Text depending on a condition</td></tr>
<tr><td>Nz</td><td><code>Nz([Discount],0)</code></td><td>0 when Discount is Null</td></tr>
<tr><td>Format</td><td><code>Format([OrderDate],"mmmm yyyy")</code></td><td>January 2025</td></tr>
<tr><td>DateDiff</td><td><code>DateDiff("d",[OrderDate],[ShippedDate])</code></td><td>Days to dispatch</td></tr>
<tr><td>Round</td><td><code>Round([UnitPrice]*1.2,2)</code></td><td>Price including VAT, two decimals</td></tr>
<tr><td>Left, Len, UCase</td><td><code>UCase(Left([LastName],3))</code></td><td>KHA</td></tr>
</tbody></table></div>
<div class="callout note">Round in Access uses banker's rounding: a value exactly halfway rounds to the nearest even number, so <code>Round(2.5,0)</code> gives 2 and <code>Round(3.5,0)</code> gives 4.</div>
<div class="example"><h4><svg class="i"><use href="#ic-bulb"/></svg>Worked example: testing expressions</h4>
<p>The tester below evaluates expressions using the RetailPractice data. Because there is no current record outside a query, use literal values or domain functions (next topic). Try changing the ProductID in the example.</p>
<div data-embed="expr" data-value='IIf(DLookup("StockLevel","Products","ProductID=4")=0,"Out of stock","In stock")'></div>
</div>`,

{
  id: 'l5t2', level: 5, obj: 'query', title: 'Domain aggregate functions: DLookup, DCount and DSum',
  objectives: [
    'Apply DLookup, DCount and DSum to retrieve and summarise values from a table.',
    'Construct criteria strings for number, text and date fields.',
    'Evaluate when a domain function is more suitable than a query.'
  ],
  body: `
<p class="lede"><b>Domain aggregate functions</b> look up or summarise values from a table or query (the <i>domain</i>) from anywhere an expression is allowed: forms, reports, macros, VBA and queries.</p>
<div class="codeblock">DLookup("Field", "Domain", "Criteria")
DCount("Field or *", "Domain", "Criteria")
DSum("Field or expression", "Domain", "Criteria")</div>
<p>All three arguments are text, so they go in quotation marks. The criteria argument is written like a WHERE clause without the word WHERE:</p>
<ul>
  <li>Number: <code>"ProductID=7"</code></li>
  <li>Text (single quotes inside double quotes): <code>"City='Leeds'"</code></li>
  <li>Value from a form control: <code>"CustomerID=" &amp; [CustomerID]</code></li>
  <li>Null test: <code>"ShippedDate Is Null"</code></li>
</ul>
<p>DAvg, DMin and DMax work in the same way. DLookup returns the first matching value, or Null if there is none.</p>
<div class="example"><h4><svg class="i"><use href="#ic-sigma"/></svg>Worked example: dashboard figures</h4>
<p>A main menu form could show live figures in calculated text boxes:</p>
<ul>
  <li>Orders awaiting dispatch: <code>=DCount("*","Orders","ShippedDate Is Null")</code></li>
  <li>Units of product 1 sold: <code>=DSum("Quantity","OrderDetails","ProductID=1")</code></li>
  <li>Customer 6's city: <code>=DLookup("City","Customers","CustomerID=6")</code> gives Leeds</li>
</ul>
<div data-embed="expr" data-value='DLookup("City","Customers","CustomerID=6")'></div>
</div>`,
  predict: {
    scenario: '<div class="codeblock">DCount("*","Orders","ShippedDate Is Null")</div>',
    q: 'What value does the expression return?',
    options: ['0', '4', '8', '12'],
    answer: 1,
    explain: 'Four orders (1007, 1010, 1011 and 1012) have no shipped date. Test it in the expression tester.'
  },
  practice: {
    intro: '<p>Work out each answer, then confirm it with the expression tester above.</p>',
    items: [
      { type: 'text', q: 'What does <code>DSum("Quantity","OrderDetails","ProductID=1")</code> return?', answers: ['6', 'six'], explain: 'Product 1 (Wireless Mouse) appears on three lines with quantities 2, 1 and 3.' },
      { type: 'text', q: 'What does <code>DLookup("ProductName","Products","ProductID=7")</code> return?', answers: ['Noise-Cancelling Headset', 'Noise Cancelling Headset'], explain: 'ProductID 7 is the Noise-Cancelling Headset.' },
      { type: 'text', q: 'What does <code>DCount("*","Customers","IsMember=True")</code> return?', answers: ['5', 'five'], explain: 'Amira, Chloe, Ella, Faisal and Isla are members.' },
      { type: 'mcq', q: 'Which criteria string correctly finds customers in Leeds?', options: ['"City=Leeds"', '"City=\'Leeds\'"', '"City="Leeds""', 'City=Leeds'], answer: 1, explain: 'Text values inside the criteria string need single quotes. Without them, Access treats Leeds as a field name.' }

    { msg: 'Error or #Error from <code>DLookup("City","Customers","LastName=Khan")</code>', cause: 'Text in the criteria is not quoted, so Khan is read as a field name.', fix: 'Write <code>"LastName=\'Khan\'"</code>.' },
    { msg: '"Data type mismatch in criteria expression."', cause: 'A number field was compared with quoted text, for example <code>"ProductID=\'7\'"</code>.', fix: 'Do not quote numbers: <code>"ProductID=7"</code>.' },
    { msg: 'Forms become slow', cause: 'Domain functions run a separate search each time they are calculated; many of them in a continuous form or query are slow.', fix: 'Use a join or totals query for large sets of records and keep domain functions for single values.' }
  ]
},
{

  body: `
<p class="lede">A <b>macro</b> is a list of actions that Access carries out in order, such as opening a form, applying a filter or showing a message. Macros are built by choosing actions from a list, so no programming is needed.</p>
<ul>
  <li><b>Standalone macros</b> appear in the Macros group of the navigation pane and can be run or reused from several places. Create one with <span class="cmd">Create &gt; Macro</span>.</li>
  <li><b>Embedded macros</b> are stored inside a form or report event property, such as a button's <b>On Click</b>. The Command Button Wizard creates these automatically.</li>
  <li>A macro named <b>AutoExec</b> runs automatically when the database opens. Hold <kbd>Shift</kbd> while opening the file to bypass it.</li>
</ul>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Action</th><th scope="col">Purpose</th></tr></thead><tbody>
<tr><td>OpenForm / OpenReport</td><td>Open an object, optionally with a Where Condition</td></tr>
<tr><td>MessageBox</td><td>Display a message</td></tr>
<tr><td>CloseWindow</td><td>Close an object</td></tr>
<tr><td>If / Else</td><td>Run actions only when a condition is true</td></tr>
<tr><td>GoToRecord, ApplyFilter</td><td>Move between or filter records</td></tr>
</tbody></table></div>
<div class="example"><h4><svg class="i"><use href="#ic-macro"/></svg>Worked example: open Audio products only</h4>
<div class="codeblock">OpenReport
    Report Name:     rptProductsByCategory
    View:            Print Preview
    Where Condition: [Category]="Audio"
MessageBox
    Message:         Showing Audio products only.
    Type:            Information</div>
</div>`,

{
  id: 'l5t5', level: 5, obj: 'module', title: 'Introduction to VBA event procedures', access: true,
  objectives: [
    'Explain how event procedures respond to events such as Click and BeforeUpdate.',
    'Construct a simple VBA event procedure using If, MsgBox and Me.',
    'Diagnose common compile and run-time errors.'
  ],
  body: `
<p class="lede"><b>VBA</b> (Visual Basic for Applications) is the programming language built into Access. Code is written in <b>event procedures</b> that run when something happens, such as a button being clicked or a record being saved.</p>
<ul>
  <li>Open the code window from a control's Property Sheet: Event tab, build button (...) next to the event, then <b>Code Builder</b>. Or press <kbd>Alt</kbd>+<kbd>F11</kbd>.</li>
  <li><code>Me</code> refers to the current form, so <code>Me.StockLevel</code> is the StockLevel control on that form.</li>
  <li><code>DoCmd</code> runs Access actions from code, for example <code>DoCmd.OpenForm "frmOrders"</code>.</li>
  <li>Add <code>Option Explicit</code> at the top of each module so that misspelt variable names are reported. Select <span class="cmd">Debug &gt; Compile</span> to check the code.</li>
</ul>
<div class="example"><h4><svg class="i"><use href="#ic-module"/></svg>Worked example: a stock check button on frmProducts</h4>
<div class="codeblock">Private Sub cmdCheckStock_Click()
    If Me.StockLevel = 0 Then
        MsgBox "This product is out of stock.", vbExclamation, "Stock check"
    Else
        MsgBox "Units in stock: " &amp; Me.StockLevel, vbInformation, "Stock check"
    End If
End Sub</div>
<p>A second procedure uses the form's <b>BeforeUpdate</b> event, which runs before a record is saved. Setting <code>Cancel = True</code> stops the save:</p>
<div class="codeblock">Private Sub Form_BeforeUpdate(Cancel As Integer)
    If Me.Discontinued = True And Me.StockLevel &gt; 0 Then
        MsgBox "Sell or remove remaining stock before discontinuing.", vbExclamation
        Cancel = True
    End If
End Sub</div>
</div>`,
  steps: [
    'Open the Level 5 practice database in Access and select <span class="cmd">Enable Content</span> (VBA does not run in Disabled Mode).',
    'Open <code>frmProducts</code> in Design View. Add a button (cancel the wizard), set its Name to <code>cmdCheckStock</code> and Caption to <code>Check stock</code>.',
    'On the Event tab, select the build button beside <b>On Click</b>, choose <b>Code Builder</b> and type the cmdCheckStock_Click procedure from the worked example between the Sub and End Sub lines.',
    'Check that <code>Option Explicit</code> appears at the top of the module. Select <span class="cmd">Debug &gt; Compile</span> and correct any errors.',
    'Return to Access, open the form in Form View and test the button on the Webcam HD and the USB-C Hub.',
    'Add the Form_BeforeUpdate procedure. Test it by ticking Discontinued on a product that still has stock and trying to save.',
    'Save the form. Close the VBA editor.'
  ],
  outcome: 'A Check stock button that shows the stock level or an out-of-stock warning, and a BeforeUpdate check that prevents discontinuing a product with stock remaining.',
  checklist: ['Created cmdCheckStock with an On Click event procedure', 'Compiled the code without errors', 'Tested both branches of the If statement', 'Added and tested the BeforeUpdate procedure'],

  },

    items: [
      { type: 'mcq', q: 'Which form event is used to check data and cancel the save if it is invalid?', options: ['On Click', 'On Open', 'Before Update', 'After Update'], answer: 2, explain: 'BeforeUpdate runs before the record is saved and can cancel it. AfterUpdate runs once the record has been saved.' },
      { type: 'text', q: 'Which VBA object runs Access actions such as OpenForm and OpenReport?', answers: ['DoCmd'], explain: 'DoCmd, for example DoCmd.OpenReport "rptSalesByCategory", acViewPreview.' },
      { type: 'mcq', q: 'What does the keyword Me refer to in a form module?', options: ['The current user', 'The current form', 'The database file', 'The VBA editor'], answer: 1, explain: 'Me refers to the form (or report) that the code belongs to.' }

  errors: [
    { msg: '"Compile error: Variable not defined"', cause: 'With Option Explicit on, a variable or control name is misspelt or not declared with Dim.', fix: 'Correct the spelling or declare the variable.' },
    { msg: '"Compile error: Method or data member not found"', cause: 'Me.SomeName refers to a control that does not exist on the form.', fix: 'Check the control\'s Name property and update the code.' },

{
  id: 'l5t6', level: 5, obj: 'db', title: 'Splitting a database and Compact and Repair', access: true,
  objectives: [
    'Explain the purpose of front-end and back-end databases.',
    'Apply the Database Splitter and Linked Table Manager.',
    'Apply Compact and Repair and evaluate its effect on file size.'
  ],
  body: `
<p class="lede">When several people use a database, it is good practice to <b>split</b> it into two files:</p>
<ul>
  <li>The <b>back end</b> (for example RetailPractice_be.accdb) contains only the tables. It is stored in a shared network location.</li>
  <li>The <b>front end</b> contains the queries, forms, reports, macros and modules, with <b>linked tables</b> pointing to the back end. Each user has their own copy.</li>
</ul>
<p>Splitting reduces network traffic, lets developers update the front end without touching the data and reduces the risk of corruption. Linked tables are shown with an arrow in the navigation pane. If the back end moves, use <span class="cmd">External Data &gt; Linked Table Manager</span> to relink.</p>
<h3>Compact and Repair</h3>
<p>Access files grow over time: deleted records and temporary objects leave unused space. <span class="cmd">Database Tools &gt; Compact and Repair Database</span> rewrites the file, recovering space and fixing minor corruption. Option: <span class="cmd">File &gt; Options &gt; Current Database &gt; Compact on Close</span>. Always back up first, and make sure no one else has the file open.</p>
<div class="example"><h4><svg class="i"><use href="#ic-db"/></svg>Worked example: file sizes</h4>
<p>A practice copy of RetailPractice is 1.6 MB. After importing and then deleting 50,000 test records, the file is 9.8 MB, even though the data is back to its original size. After Compact and Repair it returns to about 1.6 MB.</p>
</div>`,
  steps: [
    'Get the Level 5 practice database from your Canvas course page and save it in its own folder. Open it and select <span class="cmd">Enable Content</span>. Make a backup copy.',
    'Note the file size in File Explorer. Then select <span class="cmd">Database Tools &gt; Compact and Repair Database</span> and compare the size afterwards.',
    'Select <span class="cmd">Database Tools &gt; Access Database</span> (Database Splitter) and select <b>Split Database</b>. Save the back end as <code>RetailPractice_be.accdb</code> in the same folder.',
    'In the navigation pane, check that the tables now show a link arrow. Open a table and confirm the data is still available.',
    'Close Access. Move <code>RetailPractice_be.accdb</code> into a subfolder named <code>Data</code>. Reopen the front end and open a table to see the error.',
    'Select <span class="cmd">External Data &gt; Linked Table Manager</span>, tick the data source, select <b>Relink</b> and browse to the new location. Open a table to confirm.',
    'Set <span class="cmd">File &gt; Options &gt; Current Database &gt; Compact on Close</span> in the front end and close the database.'
  ],
  outcome: 'A front end with four linked tables pointing to RetailPractice_be.accdb in the Data folder, a record of file sizes before and after compacting, and Compact on Close switched on.',
  checklist: ['Recorded the file size before and after Compact and Repair', 'Split the database into front end and back end', 'Relinked tables after moving the back end', 'Set Compact on Close'],
  predict: {

  body: `
<p class="lede">A well-designed database is accurate, secure, easy to maintain and easy to use. The following practices bring together the ideas in this resource.</p>
<h3>Design</h3>
<ul>
  <li>Normalise to 3NF and give every table a primary key.</li>
  <li>Store atomic values (FirstName and LastName separately) and do not store values that can be calculated, such as Age or LineTotal.</li>
  <li>Use consistent names without spaces or reserved words: <code>OrderDate</code>, not <code>Date</code> or <code>Order Date</code>. Prefixes such as <code>qry</code>, <code>frm</code>, <code>rpt</code> and <code>mcr</code> make objects easy to identify.</li>
  <li>Choose the smallest suitable data type and Field Size, and use Required, validation rules and lookups to protect data quality.</li>
  <li>Create relationships with referential integrity enforced; avoid cascade delete unless it is clearly needed.</li>
  <li>Document the design with <span class="cmd">Database Tools &gt; Database Documenter</span>.</li>
</ul>
<h3>Security</h3>
<ul>
  <li><b>Trusted Locations</b> (<span class="cmd">File &gt; Options &gt; Trust Center</span>) let content run without enabling it each time. Only trust folders you control.</li>
  <li><b>Encrypt with Password</b> (<span class="cmd">File &gt; Info</span>, with the database opened in Exclusive mode) protects the file if it is lost or copied.</li>
  <li>An <b>ACCDE</b> file (<span class="cmd">File &gt; Save As &gt; Make ACCDE</span>) compiles the VBA and prevents users changing forms, reports and code. Keep the original ACCDB for development.</li>
  <li>Split the database, hide the navigation pane for general users, take regular backups, and collect and keep only the personal data you need, in line with UK GDPR.</li>
</ul>
<div class="example"><h4><svg class="i"><use href="#ic-target"/></svg>Worked example: reviewing a design</h4>
<div class="codeblock">tblStudent(Student Name, Age, Course1, Course2, Course3, Tutor, TutorPhone, TotalFees)</div>
<ul>
  <li>No primary key; Student Name is not atomic or unique. Add StudentID, FirstName and LastName.</li>
  <li>Age goes out of date: store DateOfBirth and calculate age.</li>
  <li>Course1 to Course3 is a repeating group: use a Bookings junction table.</li>
  <li>TutorPhone depends on Tutor: move tutor details to a Tutors table.</li>
  <li>TotalFees can be calculated from bookings and should not be stored.</li>
  <li>Spaces in names and the tbl prefix used inconsistently: choose one naming convention.</li>
</ul>
</div>`,

<p class="lede">Almost every organisation relies on databases, often without users realising it. Search engines, online shops, customer billing, stock control, manufacturing, logistics, healthcare records, banking and the creative industries (for example music rights or digital asset libraries) all store their data in databases.</p>
<h3>Data and information</h3>
<p><b>Data</b> is raw facts, such as <code>1004, 2025-02-04, 3</code>. <b>Information</b> is data that has been processed and given context so that it is meaningful: "Chloe Evans placed order 1004 on 4 February 2025". A database stores data; queries, forms and reports turn it into information that people can act on.</p>
<h3>Flat-file and relational databases</h3>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Flat file (one table, such as a spreadsheet)</th><th scope="col">Relational database (several linked tables)</th></tr></thead><tbody>
<tr><td>Data is repeated, for example the customer's email on every order</td><td>Each fact is stored once and linked by keys</td></tr>
<tr><td>Copies of the same data can become inconsistent</td><td>Referential integrity keeps related data consistent</td></tr>
<tr><td>Simple to set up for small, single-purpose lists</td><td>Needs more design effort, but scales to complex data</td></tr>
<tr><td>Limited querying and few controls on who can change data</td><td>Powerful querying with SQL, validation and user permissions</td></tr>
</tbody></table></div>
<h3>Features of an RDBMS</h3>
<p>A <b>relational database management system</b> is the software that creates and manages relational databases. Typical features are:</p>
<ul>
  <li><b>Data definition</b>: creating tables, fields, data types and keys (for example SQL <code>CREATE TABLE</code>).</li>
  <li><b>Data manipulation</b>: inserting, updating, deleting and retrieving data with SQL.</li>
  <li><b>Integrity</b>: primary keys, referential integrity and validation rules.</li>
  <li><b>Security</b>: user accounts, permissions and encryption.</li>
  <li><b>Multi-user access</b>: record locking so several people can work at once.</li>
  <li><b>Backup and recovery</b>, and a <b>data dictionary</b> (metadata describing the structure).</li>
</ul>
<p>Different products suit different environments. Microsoft Access suits small organisations and single departments: it is a single desktop file with a built-in interface for forms and reports. Server systems such as MySQL, PostgreSQL, Microsoft SQL Server and Oracle suit web applications and large organisations with many simultaneous users. SQLite is embedded inside apps and mobile phones.</p>
<h3>Databases and decision making</h3>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Level</th><th scope="col">Who decides</th><th scope="col">Example from RetailPractice</th></tr></thead><tbody>

<tr><td>Strategic (long term)</td><td>Senior managers</td><td>Sales trends over several years inform whether to open a new shop or stop selling a category.</td></tr>
</tbody></table></div>
<div class="example"><h4><svg class="i"><use href="#ic-chart"/></svg>Worked example: information for a tactical decision</h4>
<p>The manager must choose one category for a spring promotion. The totals query below turns 18 order lines into six figures that can be compared at a glance. Displays and Accessories generate the most sales; the manager might promote Audio, which has stock but lower sales.</p>

<p class="lede">SQL has two main parts. <b>Data definition language (DDL)</b> creates and changes the structure of the database. <b>Data manipulation language (DML)</b> adds, changes, deletes and retrieves the data.</p>
<div class="ds-wrap" style="max-height:none"><table class="datasheet"><thead><tr><th scope="col">Type</th><th scope="col">Statement</th><th scope="col">Example (Access SQL)</th></tr></thead><tbody>
<tr><td>DDL</td><td>CREATE TABLE</td><td><code>CREATE TABLE Suppliers (SupplierID COUNTER PRIMARY KEY, SupplierName TEXT(60) NOT NULL, Email TEXT(100))</code></td></tr>
<tr><td>DDL</td><td>ALTER TABLE</td><td><code>ALTER TABLE Suppliers ADD COLUMN Town TEXT(40)</code></td></tr>
<tr><td>DDL</td><td>DROP TABLE</td><td><code>DROP TABLE Suppliers</code></td></tr>
<tr><td>DML</td><td>INSERT INTO</td><td><code>INSERT INTO Suppliers (SupplierName, Email) VALUES ("Northern Tech Supplies", "sales@example.co.uk")</code></td></tr>
<tr><td>DML</td><td>UPDATE</td><td><code>UPDATE Products SET UnitPrice = UnitPrice * 1.05 WHERE Category = "Accessories"</code></td></tr>
<tr><td>DML</td><td>DELETE</td><td><code>DELETE FROM Products WHERE Discontinued = True</code></td></tr>
<tr><td>DML</td><td>SELECT</td><td><code>SELECT ProductName FROM Products WHERE UnitPrice &gt; 50</code></td></tr>
</tbody></table></div>
<p>Access SQL data types: <code>TEXT(n)</code> (Short Text), <code>MEMO</code> (Long Text), <code>LONG</code> or <code>INTEGER</code> (Number), <code>DOUBLE</code>, <code>CURRENCY</code>, <code>DATETIME</code>, <code>YESNO</code> and <code>COUNTER</code> (AutoNumber). A foreign key can be declared with <code>REFERENCES</code>, for example <code>SupplierID LONG REFERENCES Suppliers(SupplierID)</code>, which creates a relationship with referential integrity.</p>
<h3>Relational operations</h3>
<ul>
  <li><b>Selection</b> chooses rows that meet a condition (the WHERE clause).</li>
  <li><b>Projection</b> chooses columns (the field list after SELECT).</li>
  <li><b>Join</b> combines rows from related tables (INNER JOIN, LEFT JOIN, RIGHT JOIN).</li>
</ul>
<p>Every DML statement is still checked by the database: data types, Field Size, Required, validation rules, primary keys and referential integrity all apply, just as they do when typing into a form.</p>

  body: `
<p class="lede">An <b>entity relationship diagram (ERD)</b> shows the things a system stores data about (<b>entities</b>), their <b>attributes</b> and the <b>relationships</b> between them. It is drawn before the tables are built and is closely linked to normalisation.</p>
<ul>
  <li>An <b>entity</b> becomes a table, for example Owner or Animal. Use singular nouns.</li>
  <li>An <b>attribute</b> becomes a field, for example AnimalName.</li>
  <li><b>Cardinality</b> states how many of one entity relate to another: one-to-one, one-to-many or many-to-many.</li>
  <li>In <b>crow's foot notation</b>, a single bar means "one" and the three-pronged foot means "many". The foot is drawn at the entity that holds the foreign key.</li>
</ul>
<p>A many-to-many relationship cannot be built directly. Here an animal can stay on many bookings and a booking can include many animals, so a link entity, <b>BookingAnimal</b>, is added. Its composite key is BookingID + AnimalID, and it also stores the PenNumber for that animal on that booking.</p>
<div class="example"><h4><svg class="i"><use href="#ic-link"/></svg>Worked example: Pawsome Kennels ERD</h4>
<div data-embed="erd" data-id="kennels"></div>
<p>Read each relationship in both directions: "one owner makes many bookings; each booking is made by one owner".</p>
</div>`,

    scenario: '<p>Before the BookingAnimal entity was added, the designer drew a line directly between Booking and Animal.</p>',

  ],
  body: `
<p class="lede">Databases often hold personal data, so their design must follow the law and ethical practice. Many countries have their own data protection laws, for example the UK GDPR and Data Protection Act 2018, the EU GDPR, Brazil\'s LGPD and California\'s CCPA. Most share similar principles.</p>
<h3>Data protection principles (UK GDPR)</h3>
<ol>
  <li><b>Lawfulness, fairness and transparency</b>: tell people what is collected and why.</li>
  <li><b>Purpose limitation</b>: use data only for the stated purpose.</li>
  <li><b>Data minimisation</b>: collect only what is needed.</li>
  <li><b>Accuracy</b>: keep data correct and up to date.</li>
  <li><b>Storage limitation</b>: do not keep data longer than necessary.</li>
  <li><b>Integrity and confidentiality</b>: keep data secure.</li>
  <li><b>Accountability</b>: be able to show that the rules are followed.</li>
</ol>
<p>Individuals also have rights, including access to their data, correction and, in some cases, erasure. <b>Special category data</b>, such as health records, needs extra protection; medical databases are an example where this is critical. Laws on computer misuse (for example the UK Computer Misuse Act 1990) make unauthorised access to data a criminal offence.</p>
<h3>Ethical considerations</h3>
<p>Beyond the law, consider consent, honesty about how data is used, fair treatment of individuals, who in the organisation needs access, and the effect of errors on real people.</p>
<h3>Security measures in the design</h3>
<ul>
  <li>Split the database and store the back end in a protected network folder with permissions.</li>
  <li>Encrypt the file with a password; distribute an ACCDE front end so forms and code cannot be changed.</li>
  <li>Hide tables from general users with a navigation form; give access only to what each role needs.</li>
  <li>Take regular backups and keep them securely; plan how old records will be deleted.</li>
</ul>
<div class="example"><h4><svg class="i"><use href="#ic-warn"/></svg>Worked example: Pawsome Kennels</h4>
<p>Owner names, phone numbers, emails and addresses are personal data. The kennels needs them to contact owners about their animals, so collecting them is justified. Recording owners\' dates of birth or employers would break data minimisation. Animal health data is not personal data, but it is linked to the owner, so the whole database is protected. Records of owners who have not booked for several years should be reviewed and deleted.</p>
</div>`,

<p class="lede">Assessments and real projects often supply <b>raw data</b> in CSV (comma-separated values) or spreadsheet files. Access can import it into a new table or append it to an existing one.</p>
<ul>
  <li><span class="cmd">External Data &gt; New Data Source &gt; From File &gt; Text File</span> (CSV) or <span class="cmd">Excel</span>.</li>
  <li><b>Append a copy of the records to the table</b> keeps your designed structure, keys and validation. This is usually the best choice when the tables have been built from a data dictionary.</li>
  <li>In the Import Text Wizard, choose <b>Delimited</b>, the <b>Comma</b> delimiter, tick <b>First Row Contains Field Names</b>, and set the text qualifier to <code>"</code>.</li>
  <li>Import <b>parent tables first</b> (Owner, then Animal, then Booking, then BookingAnimal and Vaccination), otherwise referential integrity rejects the child records.</li>
</ul>
<h3>Common data problems</h3>
<ul>
  <li>Leading zeros removed from phone numbers when a column is imported as Number.</li>

  <li>Column names that do not match the field names.</li>
  <li>Extra spaces, inconsistent spelling ("dog", "Dog ", "DOG") and duplicate rows.</li>
</ul>
<p>When values cannot be converted, Access creates a table called <code>FileName_ImportErrors</code> listing the row, field and error, such as "Type Conversion Failure".</p>`,

  function openDoc(id, opts) {

  /* Crow's foot ERD drawn from a simple specification */
  function erdSVG(spec) {
    const W = 200, HEAD = 26, ROW = 18;
    const box = {}; spec.entities.forEach(e => { box[e.name] = { x: e.x, y: e.y, w: W, h: HEAD + e.attrs.length * ROW + 8 }; });
    let s = '<div class="schema-wrap"><svg class="schema-fig" viewBox="0 0 ' + spec.w + ' ' + spec.h + '" role="img" aria-labelledby="erd-t erd-d"><title id="erd-t">' + esc(spec.title) + '</title><desc id="erd-d">' + esc(spec.desc) + '</desc>';
    const line = (x1, y1, x2, y2) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--accent)" stroke-width="2"/>';
    spec.rels.forEach(r => {
      const a = box[r.one], b = box[r.many]; let p1, p2, d;
      if (Math.abs((a.x + a.w / 2) - (b.x + b.w / 2)) < W) { const x = Math.max(a.x, b.x) + 60; const top = a.y < b.y ? a : b; const bot = top === a ? b : a; p1 = [x, top === a ? a.y + a.h : a.y]; p2 = [x, top === a ? b.y : b.y + b.h]; d = [0, top === a ? 1 : -1]; }
      else { const left = a.x < b.x; const y = Math.max(a.y, b.y) + 40; p1 = [left ? a.x + a.w : a.x, y]; p2 = [left ? b.x : b.x + b.w, y]; d = [left ? 1 : -1, 0]; }
      s += line(p1[0], p1[1], p2[0], p2[1]);
      /* "one" end: two bars (exactly one) */
      [10, 16].forEach(k => { const cx = p1[0] + d[0] * k, cy = p1[1] + d[1] * k; s += line(cx - d[1] * 8, cy - d[0] * 8, cx + d[1] * 8, cy + d[0] * 8); });
      /* "many" end: crow's foot */
      const bx = p2[0] - d[0] * 14, by = p2[1] - d[1] * 14;
      s += line(bx, by, p2[0], p2[1]) + line(bx, by, p2[0] - d[1] * 9, p2[1] - d[0] * 9) + line(bx, by, p2[0] + d[1] * 9, p2[1] + d[0] * 9);
      const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
      s += '<text x="' + (mx + (d[0] ? 0 : 8)) + '" y="' + (my - (d[0] ? 6 : 0)) + '" font-size="12" font-style="italic" fill="var(--text-muted)"' + (d[0] ? ' text-anchor="middle"' : '') + '>' + esc(r.label) + '</text>';
    });
    spec.entities.forEach(e => {
      const bx = box[e.name];
      s += '<rect x="' + bx.x + '" y="' + bx.y + '" width="' + W + '" height="' + bx.h + '" rx="4" fill="var(--surface)" stroke="var(--border)"/>';
      s += '<rect x="' + bx.x + '" y="' + bx.y + '" width="' + W + '" height="' + HEAD + '" rx="4" fill="var(--tint)" stroke="var(--border)"/>';
      s += '<text x="' + (bx.x + 8) + '" y="' + (bx.y + 18) + '" font-size="13.5" font-weight="700" fill="var(--text)">' + esc(e.name) + '</text>';
      e.attrs.forEach((at, i) => {
        const y = bx.y + HEAD + 15 + i * ROW; const pk = /PK/.test(at[1] || '');
        s += '<text x="' + (bx.x + 10) + '" y="' + y + '" font-size="12.5" fill="var(--text)"' + (pk ? ' text-decoration="underline" font-weight="700"' : '') + '>' + esc(at[0]) + '</text>';
        if (at[1]) s += '<text x="' + (bx.x + W - 8) + '" y="' + y + '" font-size="11" text-anchor="end" fill="var(--text-muted)">' + esc(at[1]) + '</text>';
      });
    });
    return s + '</svg></div><p class="crumb">Key: underlined = primary key (PK); FK = foreign key; two bars = one; three-pronged foot = many.</p>';
  }

  /* ---------- Checking lab practice tasks ---------- */
  function firstSortName(def) {
    const c = def.cols.find(x => x.sort && x.field); if (!c) return null;
    const m = c.field.match(/^([^:]+):/);
    return { name: m ? m[1].trim() : c.field, desc: c.sort === 'Descending' };
  }
  function compareResults(stu, sol, ordered, solDef) {
    const key = (r, cols) => r.map((v, i) => Engine.formatValue(v, cols[i].type)).sort().join('\u0001');
    if (stu.columns.length !== sol.columns.length) return { ok: false, msg: 'The expected result has ' + sol.columns.length + ' column' + (sol.columns.length === 1 ? '' : 's') + ', but your query shows ' + stu.columns.length + '. Check the Field row and the Show boxes.' };
    if (stu.rows.length !== sol.rows.length) return { ok: false, msg: 'The expected result has ' + sol.rows.length + ' record' + (sol.rows.length === 1 ? '' : 's') + ', but your query returns ' + stu.rows.length + '. Review the criteria, the Or rows and the join type.' };
    const a = stu.rows.map(r => key(r, stu.columns)); const b = sol.rows.map(r => key(r, sol.columns));
    if (a.slice().sort().join('\n') !== b.slice().sort().join('\n')) return { ok: false, msg: 'The number of records is right, but some values differ. Compare your fields, calculations and criteria with the task.' };
    if (ordered) {
      const s = firstSortName(solDef);
      const idx = s ? stu.columns.findIndex(c => c.name.toLowerCase() === s.name.toLowerCase()) : -1;
      let inOrder;
      if (idx >= 0) { inOrder = stu.rows.every((r, i) => i === 0 || (s.desc ? Engine.compare(stu.rows[i - 1][idx], r[idx]) >= 0 : Engine.compare(stu.rows[i - 1][idx], r[idx]) <= 0)); }
      else inOrder = a.join('\n') === b.join('\n');
      if (!inOrder) return { ok: false, msg: 'The correct records are returned, but not in the required order. Check the Sort row.' };
    }
    return { ok: true, msg: 'Your query returns exactly the expected records.' };
  }
  function checkLabTask(slot, tid, i) {
    const task = tid ? { t: tid, i, item: TOPIC[tid].practice.items[i] } : Lab.task;

    let stu;
    try {

      stu = Engine.run(Lab.def, {});

    const sol = Engine.run(task.item.solution, {});
    const res = compareResults(stu, sol, task.item.ordered, task.item.solution);
    feedback(slot, res.ok, res.ok ? 'Correct' : 'Not yet', esc(res.msg));
    if (res.ok) { markPractice(task.t, task.i); announce('Correct. Practice task complete.'); }
  }

  function submitQuiz(form) {

      const ok = +ch.value === item.answer;
      $$('.opt', fs).forEach((lb, j) => { lb.classList.remove('correct', 'incorrect'); if (ok && j === item.answer) lb.classList.add('correct'); else if (!ok && j === +ch.value) lb.classList.add('incorrect'); });
      feedback(slot, ok, ok ? 'Correct' : 'Not quite. Try again', ok ? esc(item.explain) : 'Reread the explanation, then choose another option.');
      if (ok) markPractice(tid, idx); return;
    }
    if (a === 'p-text') {
      const fs = t.closest('fieldset'); const val = fs.querySelector('input').value; const slot = fs.querySelector('.fb-slot');
      if (!val.trim()) { feedback(slot, false, 'Enter an answer first'); return; }
      const ok = textMatches(item, val);
      feedback(slot, ok, ok ? 'Correct' : 'Not quite', ok ? esc(item.explain) : 'Check your working and try again, or select Show answer.');
      if (ok) markPractice(tid, idx); return;
    }
    if (a === 'p-rule' || a === 'p-mask') {
      const fs = t.closest('fieldset'); const val = fs.querySelector('input').value; const slot = fs.querySelector('.fb-slot');
      if (!val.trim()) { feedback(slot, false, 'Enter a ' + (a === 'p-rule' ? 'rule' : 'mask') + ' first'); return; }
      const rows = []; let allOk = true;
      item.cases.forEach(c => {
        let got, note = '';
        try {
          if (a === 'p-rule') got = Engine.testRule(val, c.v, item.fieldType).pass;
          else { const r = Engine.applyMask(val, c.v); got = r.ok; if (r.ok && c.show && r.display !== c.show) { got = 'display'; note = ' (stored as ' + r.display + ', expected ' + c.show + ')'; } }
        } catch (e) { got = 'error'; note = ' (' + e.message + ')'; }
        const pass = got === c.ok; if (!pass) allOk = false;
        rows.push('<li>' + (pass ? '&#10003;' : '&#10007;') + ' <code>' + esc(c.v) + '</code> should be ' + (c.ok ? 'accepted' : 'rejected') + (pass ? '' : '; your ' + (a === 'p-rule' ? 'rule' : 'mask') + ' ' + (got === true ? 'accepts it' : got === false ? 'rejects it' : 'gives a problem') + esc(note)) + '</li>');
      });
      feedback(slot, allOk, allOk ? 'Correct: every test value behaves as required' : 'Some test values are not handled correctly', '<ul>' + rows.join('') + '</ul>');
      if (allOk) markPractice(tid, idx); return;
    }
    if (a === 'p-show') {
      const fs = t.closest('fieldset'); const slot = fs.querySelector('.fb-slot');
      const ans = item.type === 'text' ? item.answers[0] : item.model;
      feedback(slot, null, 'Model answer', '<code>' + esc(ans) + '</code>' + (item.explain ? '<br>' + esc(item.explain) : '')); return;
    }
    if (a === 'p-lab-open') {
      loadLab({ tables: [item.solution.tables[0]], joins: {}, totals: false, cols: [] }, { task: { t: tid, i: idx, item } }); return;
    }
    if (a === 'p-lab-check') {
      const slot = t.closest('fieldset').querySelector('.fb-slot');
      if (!Lab.task || Lab.task.t !== tid || Lab.task.i !== idx) { feedback(slot, null, 'Open the Query Lab for this task first', 'Build the query there, then select Check my query in the lab or here.'); return; }
      checkLabTask(slot, tid, idx); return;
    }
    if (a === 'p-lab-solution') {
      const slot = t.closest('fieldset').querySelector('.fb-slot');
      let sql = ''; try { sql = Engine.toSQL(item.solution); } catch (e) { sql = e.message; }
      feedback(slot, null, 'One possible solution', tablesLine(item.solution) + gridReadonlyHTML(item.solution) + '<pre class="sqlview">' + esc(sql) + '</pre><button type="button" class="btn small" data-action="p-lab-load" data-t="' + tid + '" data-i="' + idx + '">Load this solution into the Query Lab</button>'); return;
    }
    if (a === 'p-sql') {
      const fs = t.closest('fieldset'); const slot = fs.querySelector('.fb-slot'); const txt = fs.querySelector('textarea').value;
      if (!txt.trim()) { feedback(slot, false, 'Write a SELECT statement first'); return; }
      if (!/^\s*SELECT\b/i.test(txt)) { feedback(slot, false, 'This task needs a SELECT statement', 'Statements that change data can be tried in the SQL console.'); return; }
      let stu, sol;
      try { stu = Engine.sql.run(txt); } catch (e) { feedback(slot, false, 'The statement could not run', esc(e.message)); return; }
      sol = Engine.sql.run(item.solution);
      const res = compareResults(stu, sol, false, null);
      feedback(slot, res.ok, res.ok ? 'Correct' : 'Not yet', esc(res.ok ? 'Your statement returns exactly the expected records.' : res.msg) + datasheetHTML(stu.columns, stu.rows, { caption: 'Your results' }));
      if (res.ok) markPractice(tid, idx); return;
    }
    if (a === 'p-sql-show') { feedback(t.closest('fieldset').querySelector('.fb-slot'), null, 'Model answer', '<pre class="sqlview">' + esc(item.solution) + '</pre>Other correct answers are possible, for example with different column names or the field list qualified with table names.'); return; }
    if (a === 'p-classify') {
      const fs = t.closest('fieldset'); const slot = fs.querySelector('.fb-slot'); let right = 0;
      item.items.forEach((x, j) => {
        const v = fs.querySelector('[data-cl="' + j + '"]').value; const ok = v === x.cat; if (ok) right++;
        fs.querySelector('[data-cc="' + j + '"]').className = v ? (ok ? 'good' : 'wrong') : 'wrong';
        let actual; try { actual = Engine.testRule(item.rule, x.v, item.fieldType).pass ? 'Accepted' : 'Rejected'; } catch (e) { actual = 'Rejected (not a valid ' + item.fieldType.toLowerCase() + ')'; }
        fs.querySelector('[data-cr="' + j + '"]').textContent = (ok ? '' : x.cat + '. ') + 'Access: ' + actual;
      });
      const all = right === item.items.length;
      feedback(slot, all, right + ' of ' + item.items.length + ' correct', all ? 'Normal and boundary values are accepted; erroneous values are rejected.' : 'Boundary values are the smallest and largest valid values. Values just outside the range are erroneous.');
      if (all) markPractice(tid, idx); return;
    }
    if (a === 'p-lab-load') { loadLab(item.solution, { run: true, task: { t: tid, i: idx, item } }); return; }
    if (a === 'quiz-reset') { const n = +t.dataset.n; const d = Docs.open.get('quiz:' + n); renderQuiz(d.panel, n); d.panel.querySelector('h2').focus(); return; }
  });
  document.addEventListener('submit', e => { const f = e.target.closest('form[data-quiz]'); if (f) { e.preventDefault(); submitQuiz(f); } });
  document.addEventListener('input', e => {
    if (e.target.id === 'nav-filter') { renderNav(); return; }
    if (e.target.id === 'ref-q') { refState.q = e.target.value; drawReference(Docs.open.get('reference').panel); return; }
    if (e.target.closest('#lab-grid')) labInput(e);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.checklist) {
      const id = el.dataset.checklist; const arr = state.checklists[id] || []; arr[+el.dataset.i] = el.checked; state.checklists[id] = arr; persist();
      const c = document.querySelector('[data-cl-count="' + id + '"]'); if (c) c.textContent = checklistCount(TOPIC[id]); return;
    }
    if (el.closest('#lab-grid')) { labInput(e); return; }
    if (el.dataset.addtable) {
      const d = Lab.def; const n = el.dataset.addtable;
      if (el.checked) { if (!d.tables.includes(n)) d.tables.push(n); }
      else {
        if (d.tables.length === 1) { el.checked = true; announce('A query needs at least one table.'); return; }
        d.tables = d.tables.filter(x => x !== n); d.cols.forEach(c => { if (c.table === n) { Object.assign(c, blankCol()); } });
      }
      renderLabTables(); renderLabGrid(); updateLabSQL(); const cb = labEl('[data-addtable="' + n + '"]'); if (cb) cb.focus(); return;
    }
    if (el.dataset.join) { Lab.def.joins[el.dataset.join] = el.value; updateLabSQL(); announce('Join type changed. Run the query to see the effect.'); }
  });
  /* Arrow-key navigation for tab lists (ribbon and documents) */
  document.addEventListener('keydown', e => {
    const tab = e.target.closest('[role="tab"]');
    if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
      const tl = tab.closest('[role="tablist"]'); const list = $$('[role="tab"]', tl); let i = list.indexOf(tab);
      i = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length;
      e.preventDefault(); list[i].click();
      const nt = $$('[role="tab"]', tl)[i]; if (nt) nt.focus();
      return;
    }
    if (e.key === 'Escape' && isNarrow() && $('#navpane').classList.contains('open')) { setNavOverlay(false); $('#nav-open-btn').focus(); }
    if (e.key === 'Enter' && e.target.id === 'rb-ref') { e.preventDefault(); runCmd('ref-search'); }
  });
  $('#nav-shutter').addEventListener('click', toggleNav);
  $('#nav-open-btn').addEventListener('click', () => setNavOverlay(!$('#navpane').classList.contains('open')));
  $('#theme-btn').addEventListener('click', cycleTheme);
  window.addEventListener('resize', () => { if (!isNarrow()) $('#navpane').classList.remove('open'); });

  /* ---------- Start-up ---------- */
  applyTheme();
  if (state.navCollapsed && !isNarrow()) toggleNav();
  renderRibbon();
  renderNav();
  openDoc('welcome', { focus: false });
  refreshProgressUI();
  setStatus(Store.isAvailable() ? 'Ready' : 'Ready (progress will not be saved: browser storage is unavailable)');
})();
</script>
</body>
</html>
