<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            color: #e2e8f0;
            line-height: 1.6;
            min-height: 100vh;
        }

        .nav-bar {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            z-index: 100;
            padding: 1rem 0;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
        }

        .nav-btn {
            padding: 0.75rem 1.5rem;
            background: #334155;
            border: none;
            color: #e2e8f0;
            cursor: pointer;
            border-radius: 0.375rem;
            white-space: nowrap;
            font-size: 0.875rem;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #475569;
        }

        .nav-btn.active {
            background: #2563eb;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .module-header {
            margin-bottom: 2rem;
        }

        .module-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #60a5fa 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .module-header p {
            color: #93c5fd;
            font-size: 1.125rem;
        }

        .content {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 0.5rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        section {
            margin-bottom: 2rem;
        }

        section:last-child {
            margin-bottom: 0;
        }

        h3 {
            font-size: 1.375rem;
            margin-bottom: 1rem;
            color: #60a5fa;
            border-bottom: 2px solid #1e40af;
            padding-bottom: 0.5rem;
        }

        .step-indicator {
            background: rgba(37, 99, 235, 0.2);
            border: 1px solid #3b82f6;
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1.5rem;
            color: #93c5fd;
        }

        .change-highlight {
            background: rgba(34, 197, 94, 0.2);
            border-left: 4px solid #22c55e;
            margin: 0.5rem 0;
            padding: 0.75rem;
            border-radius: 0.25rem;
        }

        .code-block {
            background: #0f172a;
            border: 1px solid #1e3a5f;
            border-radius: 0.375rem;
            padding: 1rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            position: relative;
        }

        .code-block code {
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            color: #e2e8f0;
            line-height: 1.5;
            display: block;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .code-line {
            display: flex;
            gap: 1rem;
        }

        .line-num {
            color: #64748b;
            min-width: 2.5rem;
            text-align: right;
            user-select: none;
        }

        .line-content {
            flex: 1;
        }

        .line-new {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
        }

        .line-modified {
            background: rgba(59, 130, 246, 0.15);
        }

        .line-removed {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            text-decoration: line-through;
        }

        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.5rem 1rem;
            background: #2563eb;
            border: none;
            color: white;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background: #1d4ed8;
        }

        .copy-btn.copied {
            background: #10b981;
        }

        .info-box {
            background: rgba(30, 100, 200, 0.1);
            border-left: 4px solid #60a5fa;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 0.375rem;
        }

        .info-box strong {
            color: #60a5fa;
        }

        .warning-box {
            background: rgba(200, 100, 30, 0.1);
            border-left: 4px solid #f59e0b;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 0.375rem;
        }

        .warning-box strong {
            color: #f59e0b;
        }

        .success-box {
            background: rgba(34, 197, 94, 0.1);
            border-left: 4px solid #10b981;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 0.375rem;
        }

        .success-box strong {
            color: #10b981;
        }

        ul, ol {
            margin-left: 1.5rem;
            margin-top: 0.75rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        .debug-section {
            background: rgba(200, 50, 50, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-top: 3rem;
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .debug-header h3 {
            margin: 0;
            color: #fca5a5;
            border: none;
            padding: 0;
        }

        .debug-toggle {
            font-size: 1.5rem;
            transition: transform 0.3s;
        }

        .debug-toggle.open {
            transform: rotate(180deg);
        }

        .debug-content {
            display: none;
            margin-top: 1.5rem;
        }

        .debug-content.show {
            display: block;
        }

        .debug-item {
            background: rgba(71, 85, 105, 0.5);
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid #ef4444;
            border-radius: 0.375rem;
        }

        .debug-item p {
            margin: 0.5rem 0;
        }

        .debug-item strong {
            color: #fca5a5;
        }

        @media (max-width: 768px) {
            .module-header h1 {
                font-size: 2rem;
            }

            .container {
                padding: 1rem;
            }

            .content {
                padding: 1rem;
            }
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .comparison-col h4 {
            color: #93c5fd;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .comparison {
                grid-template-columns: 1fr;
            }
        }

        .marker {
            color: #fbbf24;
            font-weight: bold;
        }
    </style>

            {
                cout &lt;&lt; "  You attack!" &lt;&lt; endl;
                
                for (int i = 0; i < 3; i++)
                {
                    if (enemies[i].isAlive())
                    {
                        enemies[i].takeDamage(player.damagePerRound);
                        if (!enemies[i].isAlive())
                        {
                            cout &lt;&lt; "  " &lt;&lt; enemies[i].type &lt;&lt; " defeated!" &lt;&lt; endl;
                            player.addScore(50);
                        }
                        break;
                    }
                }
            }
            else if (key == 'h' || key == 'H')
            {
                cout &lt;&lt; "  You heal!" &lt;&lt; endl;
                player.health = player.health + 10;
            }
            else if (key == 'q' || key == 'Q')
            {
                cout &lt;&lt; "You fled the battle!" &lt;&lt; endl;
                gameRunning = false;
            }
        }
        
        // ENEMY ATTACK
        int damageReceived = 0;
        for (int i = 0; i < 3; i++)
        {
            if (enemies[i].isAlive())
            {
                damageReceived = damageReceived + 5;
            }
        }
        
        if (damageReceived > 0)
        {
            player.takeDamage(damageReceived);
            cout &lt;&lt; "  Enemies attack for " &lt;&lt; damageReceived &lt;&lt; " damage!" &lt;&lt; endl;
        }
        
        // CHECK WIN/LOSE
        if (!player.isAlive())
        {
            cout &lt;&lt; "\\nGAME OVER! You survived " &lt;&lt; round &lt;&lt; " rounds!" &lt;&lt; endl;
            break;
        }
        
        bool allDead = true;
        for (int i = 0; i < 3; i++) if (enemies[i].isAlive()) allDead = false;
        
        if (allDead)
        {
            cout &lt;&lt; "\\nVICTORY! All enemies defeated!" &lt;&lt; endl;
            break;
        }
        
        round = round + 1;
        Sleep(500);</span>
    }
    
    cout &lt;&lt; string(50, '-') &lt;&lt; endl;
    cout &lt;&lt; "Final Score: " &lt;&lt; player.score &lt;&lt; endl;
    
    system("pause");
    return 0;

        let currentModule = 0;

        function switchModule(index) {
            currentModule = index;
            renderModule();
            window.scrollTo(0, 0);
        }

        function renderModule() {
            const mod = modules[currentModule];
            document.getElementById('moduleTitle').textContent = mod.title;
            document.getElementById('moduleSubtitle').textContent = mod.subtitle;
            document.getElementById('moduleContent').innerHTML = mod.content;
            
            const issues = debugIssues[currentModule] || [];
            let debugHTML = '';
            issues.forEach((item, idx) => {
                debugHTML += `
                    <div class="debug-item">
                        <p><strong>${idx + 1}. ${item.issue}</strong></p>
                        <p><strong>Solution:</strong> ${item.solution}</p>
                    </div>
                `;
            });
            document.getElementById('debugContent').innerHTML = debugHTML;
            
            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === currentModule);
            });
            
            document.querySelector('.debug-toggle').classList.remove('open');
            document.getElementById('debugContent').classList.remove('show');
        }

        function toggleDebug(header) {
            const toggle = header.querySelector('.debug-toggle');
            const content = document.getElementById('debugContent');
            toggle.classList.toggle('open');
            content.classList.toggle('show');
        }

        function copyCode(btn, code) {
            navigator.clipboard.writeText(code).then(() => {
                const original = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    btn.textContent = original;
                    btn.style.background = '';
                }, 2000);
            });
        }

        const navButtons = document.getElementById('navButtons');
        modules.forEach((mod, i) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
            btn.textContent = `${i + 1}. ${mod.title.split(':')[0]}`;
            btn.onclick = () => switchModule(i);
            navButtons.appendChild(btn);
        });

        renderModule();
    </script>
