        function copyCodeFromBlock(blockId) {
            // Get code from JavaScript object, not from DOM
            const code = codeExamples[blockId];
            
            if (!code) {
                console.error('Code not found for block:', blockId);
                alert('Error: Code not found');
                return;
            }
            
            // Copy to clipboard
            navigator.clipboard.writeText(code).then(() => {
                // Find button and show feedback
                const buttons = document.querySelectorAll('.copy-btn');
                const btn = Array.from(buttons).find(b => 
                    b.parentElement.id === blockId
                );
                
                if (btn) {
                    const original = btn.textContent;
                    btn.textContent = '✓ Copied!';
                    btn.classList.add('copied');
                    
                    setTimeout(() => {
                        btn.textContent = original;
                        btn.classList.remove('copied');
                    }, 2000);
                }
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy code');
            });
        }

                btn.classList.toggle('active', i === currentModule);
            });
            
            document.querySelector('.debug-toggle').classList.remove('open');
            document.getElementById('debugContent').classList.remove('show');
        }

        function toggleDebug(header) {
            const toggle = header.querySelector('.debug-toggle');
            const content = document.getElementById('debugContent');
            toggle.classList.toggle('open');
            content.classList.toggle('show');
        }

        const navButtons = document.getElementById('navButtons');
        modules.forEach((mod, i) => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
            btn.textContent = `${i + 1}. ${mod.title.split(':')[0]}`;
            btn.onclick = () => switchModule(i);
            navButtons.appendChild(btn);
        });

        renderModule();
    </script>
</body>
</html>
