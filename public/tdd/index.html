<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test-Driven Development: Learn by Doing</title>
<meta name="description" content="A step-by-step interactive course on test-driven development, with live tests and a GitHub issues and projects workflow.">
<meta name="color-scheme" content="light dark">
<script>
/* Set the theme before the page paints so there is no flash. */
try { var t = localStorage.getItem('tdd-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2;
  --text: #1f2328; --muted: #59636e;
  --border: #707a86;      /* controls: 3:1+ */
  --line: #d1d9e0;        /* decorative dividers only */
  --accent: #0860c8; --on-accent: #ffffff; --focus: #0860c8;
  --btn-bg: #1a7f37; --btn-text: #ffffff;
  --ok: #116329; --ok-bg: #dafbe1; --ok-line: #1a7f37;
  --bad: #a40e26; --bad-bg: #ffebe9; --bad-line: #cf222e;
  --warn: #7d4e00; --warn-bg: #fff8c5; --warn-line: #9a6700;
  --done: #8250df; --on-done: #ffffff;
  --code-bg: #eff2f5;
  --tk-c: #59636e; --tk-s: #0a3069; --tk-k: #a40e26; --tk-n: #0550ae;
  --bar-bg: #25292e; --bar-text: #ffffff; --bar-muted: #d1d9e0;
  --tip-bg: #25292e; --tip-text: #ffffff;
  --red: #a40e26; --green: #116329; --blue: #0550ae;
  --shadow: 0 8px 24px rgba(31,35,40,.25);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #151b23; --surface-2: #212830;
  --text: #e6edf3; --muted: #9198a1;
  --border: #7d8590; --line: #3d444d;
  --accent: #58a6ff; --on-accent: #0d1117; --focus: #58a6ff;
  --btn-bg: #238636; --btn-text: #ffffff;
  --ok: #56d364; --ok-bg: #0f2a18; --ok-line: #2ea043;
  --bad: #ff8f87; --bad-bg: #2d1517; --bad-line: #f85149;
  --warn: #e3b341; --warn-bg: #2b2108; --warn-line: #bb8009;
  --done: #8957e5; --on-done: #ffffff;
  --code-bg: #151b23;
  --tk-c: #9198a1; --tk-s: #a5d6ff; --tk-k: #ff7b72; --tk-n: #79c0ff;
  --bar-bg: #010409; --bar-text: #ffffff; --bar-muted: #d1d9e0;
  --tip-bg: #e6edf3; --tip-text: #0d1117;
  --red: #ff8f87; --green: #56d364; --blue: #79c0ff;
  --shadow: 0 8px 24px rgba(1,4,9,.8);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #0d1117; --surface: #151b23; --surface-2: #212830;
  --text: #e6edf3; --muted: #9198a1;
  --border: #7d8590; --line: #3d444d;
  --accent: #58a6ff; --on-accent: #0d1117; --focus: #58a6ff;
  --btn-bg: #238636; --btn-text: #ffffff;
  --ok: #56d364; --ok-bg: #0f2a18; --ok-line: #2ea043;
  --bad: #ff8f87; --bad-bg: #2d1517; --bad-line: #f85149;
  --warn: #e3b341; --warn-bg: #2b2108; --warn-line: #bb8009;
  --done: #8957e5; --on-done: #ffffff;
  --code-bg: #151b23;
  --tk-c: #9198a1; --tk-s: #a5d6ff; --tk-k: #ff7b72; --tk-n: #79c0ff;
  --bar-bg: #010409; --bar-text: #ffffff; --bar-muted: #d1d9e0;
  --tip-bg: #e6edf3; --tip-text: #0d1117;
  --red: #ff8f87; --green: #56d364; --blue: #79c0ff;
  --shadow: 0 8px 24px rgba(1,4,9,.8);
  color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 1rem; }
@media (min-width: 62rem) { html { scroll-padding-top: 8rem; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5rem; }
h2 { font-size: 1.75rem; }
h3 { font-size: 1.15rem; }
h4 { font-size: 1rem; margin-top: 1rem; }
p { margin: 0 0 1rem; max-width: 68ch; }
ul, ol { margin: 0 0 1rem; padding-left: 1.4rem; max-width: 68ch; }
li { margin-bottom: .35rem; }
a { color: var(--accent); text-underline-offset: 3px; }
code, kbd { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: .88em; background: var(--code-bg); padding: .15em .4em; border-radius: 6px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
svg.ico { vertical-align: -2px; flex: none; }

.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: .5rem; top: -4rem; background: var(--accent); color: var(--on-accent); padding: .6rem 1rem; border-radius: 6px; z-index: 100; font-weight: 600; }
.skip:focus { top: .5rem; }

/* ---------- GitHub-style header ---------- */
.top { z-index: 20; background: var(--bg); }
@media (min-width: 62rem) { .top { position: sticky; top: 0; } }
.gh-bar { background: var(--bar-bg); color: var(--bar-text); }
.gh-bar-in { max-width: 80rem; margin: 0 auto; padding: .65rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.crumb { display: flex; align-items: center; gap: .6rem; min-width: 0; }
.crumb h1 { margin: 0; font-size: 1rem; font-weight: 400; color: var(--bar-text); }
.crumb h1 strong { font-weight: 700; }
.crumb .sep { color: var(--bar-muted); padding: 0 .2rem; }
.crumb small { display: block; color: var(--bar-muted); font-size: .8rem; }
.prog-wrap { background: var(--surface); border-bottom: 1px solid var(--line); }
.prog { max-width: 80rem; margin: 0 auto; padding: .5rem 1rem; display: flex; align-items: center; gap: .75rem; }
.bar { flex: 1; height: .7rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; background: var(--ok-line); width: 0; transition: width .4s ease; }
.prog-text { font-size: .9rem; color: var(--muted); white-space: nowrap; }
.tools { display: flex; gap: .5rem; align-items: center; }

.btn { font: inherit; font-weight: 600; font-size: .95rem; min-height: 2.5rem; padding: .4rem 1rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-text); }
.btn:hover { filter: brightness(1.1); }
.btn.sec { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn.sec:hover { background: var(--surface-2); filter: none; }
.btn[aria-disabled="true"] { opacity: .6; cursor: not-allowed; }
.btn.icon { padding: .4rem .8rem; }
.gh-bar .btn.sec { background: transparent; color: var(--bar-text); border-color: #8b949e; }
.gh-bar .btn.sec:hover { background: rgba(255,255,255,.12); }
.gh-bar :focus-visible { outline-color: #79b8ff; }

/* ---------- Layout ---------- */
.shell { max-width: 80rem; margin: 0 auto; padding: 1rem; display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 62rem) {
  .shell { grid-template-columns: 19rem minmax(0, 1fr); gap: 2rem; padding-top: 1.5rem; }
  .side { position: sticky; top: 8rem; align-self: start; max-height: calc(100vh - 9rem); overflow-y: auto; }
  .side-toggle { display: none; }
}
@media (max-width: 61.99rem) {
  .side-list { display: none; }
  .side.open .side-list { display: block; }
  .side-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; }
}
.side-list { border: 1px solid var(--line); border-radius: 6px; padding: .75rem; background: var(--bg); }
.side-title { font-size: .85rem; margin: 0 0 .5rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.side-title.second { margin-top: 1.25rem; }
.mods { list-style: none; padding: 0; margin: 0; max-width: none; }
.mods li { margin: 0 0 .15rem; }
.mod { width: 100%; text-align: left; font: inherit; color: var(--text); background: transparent; border: 0; border-radius: 6px; padding: .5rem .75rem .5rem 1rem; cursor: pointer; display: grid; gap: .1rem; position: relative; }
.mod:hover { background: var(--surface-2); }
.mod[aria-current="true"] { background: var(--surface-2); }
.mod[aria-current="true"] .n { font-weight: 700; }
.mod[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: .5rem; bottom: .5rem; width: 4px; border-radius: 4px; background: var(--accent); }
.mod[aria-disabled="true"] { cursor: not-allowed; color: var(--muted); }
.mod[aria-disabled="true"]:hover { background: transparent; }
.mod .n { font-weight: 600; }
.mod .st { font-size: .85rem; color: var(--muted); }
.mod .st.done { color: var(--ok); font-weight: 600; }
.contrib { display: flex; gap: 3px; flex-wrap: wrap; }
.ccol { display: flex; flex-direction: column; gap: 3px; }
.contrib i { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: block; }
.contrib i.on { background: var(--ok-line); border-color: var(--ok-line); }
.contrib i.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.contrib-note { font-size: .85rem; color: var(--muted); margin: .5rem 0 0; }

.main:focus { outline: none; }
.mod-head { margin-bottom: 1.25rem; }
.mod-head h2 { padding-bottom: .3em; border-bottom: 1px solid var(--line); }
.mod-head .kicker { color: var(--muted); font-size: .9rem; margin: 0 0 .25rem; }
.goal { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: .75rem 1rem; border-radius: 6px; margin: .75rem 0 0; }

/* ---------- Step cards (GitHub "Box") ---------- */
.step { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; background: var(--bg); margin-bottom: 1.25rem; }
.step.is-done { border-left-color: var(--ok-line); }
.step-top { display: flex; flex-wrap: wrap; gap: .4rem 1rem; justify-content: space-between; align-items: center; padding: .65rem 1.1rem; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 0 6px 0 0; }
.step-top h3 { margin: 0; }
.step-top h3:focus { outline: none; }
.step-top h3:focus-visible { outline: 3px solid var(--focus); }
.step-body { padding: 1rem 1.1rem 1.25rem; }
.step-no { color: var(--muted); font-size: .85rem; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; font-weight: 600; padding: .1rem .65rem; border-radius: 2em; border: 1px solid currentColor; }
.chip.ok { color: var(--ok); background: var(--ok-bg); }
.chip.now { color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; align-items: center; }
.note { background: var(--warn-bg); border: 1px solid var(--warn-line); padding: .6rem .9rem; border-radius: 6px; margin: 0 0 1rem; max-width: 68ch; }
.note strong { color: var(--warn); }
.callout { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .75rem 1rem; margin: 0 0 1rem; max-width: 68ch; }

/* ---------- Red / Green / Refactor ---------- */
.loop { display: grid; gap: .75rem; margin: 0 0 1rem; padding: 0; list-style: none; max-width: none; }
@media (min-width: 40rem) { .loop { grid-template-columns: repeat(3, 1fr); } }
.loop li { border: 2px solid; border-radius: 6px; padding: .75rem 1rem; margin: 0; background: var(--surface); }
.loop .l-red { border-color: var(--red); } .loop .l-red h4 { color: var(--red); }
.loop .l-green { border-color: var(--green); } .loop .l-green h4 { color: var(--green); }
.loop .l-blue { border-color: var(--blue); } .loop .l-blue h4 { color: var(--blue); }
.loop h4 { margin: 0 0 .25rem; font-size: 1.1rem; }
.loop p { margin: 0; font-size: .97rem; }
.loop-note { text-align: center; color: var(--muted); font-weight: 600; max-width: none; }

/* ---------- Code ---------- */
.codebox { margin: 0 0 1rem; max-width: 52rem; }
.codebox .cap { display: flex; justify-content: space-between; align-items: center; gap: .5rem; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; padding: .25rem .5rem .25rem .75rem; font-size: .85rem; font-weight: 600; color: var(--muted); }
.codebox .cap .btn { min-height: 1.9rem; padding: .05rem .7rem; font-size: .85rem; }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 0 0 6px 6px; padding: .75rem 1rem; overflow-x: auto; font: .88rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; }
pre.code code { background: none; padding: 0; font-size: inherit; }
.tk-c { color: var(--tk-c); font-style: italic; } .tk-s { color: var(--tk-s); } .tk-k { color: var(--tk-k); } .tk-n { color: var(--tk-n); }
textarea.editor { width: 100%; display: block; min-height: 9rem; resize: vertical; margin: 0 0 .25rem; font: .88rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; background: var(--code-bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: .75rem 1rem; }
label.lbl { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
.hint-text { font-size: .9rem; color: var(--muted); margin: 0 0 .5rem; }

/* ---------- Results ---------- */
.results { margin-top: 1rem; }
.results .sum { font-weight: 700; margin: 0 0 .5rem; }
.results ul { list-style: none; padding: 0; margin: 0; max-width: 52rem; }
.results li { display: grid; grid-template-columns: auto 1fr; gap: .1rem .6rem; padding: .5rem .75rem; border-radius: 6px; margin-bottom: .4rem; border: 1px solid; }
.results li.pass { background: var(--ok-bg); border-color: var(--ok-line); }
.results li.fail { background: var(--bad-bg); border-color: var(--bad-line); }
.badge { font-weight: 700; font-size: .82rem; padding: .05rem .5rem; border-radius: 2em; align-self: start; white-space: nowrap; }
.pass .badge { color: var(--ok); border: 1px solid var(--ok-line); } .fail .badge { color: var(--bad); border: 1px solid var(--bad-line); }
.results .msg { grid-column: 2; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88rem; overflow-wrap: anywhere; }
.result-ok { color: var(--ok); } .result-bad { color: var(--bad); }
.hints { margin-top: .75rem; }
.hints .callout { border-left: 4px solid var(--accent); }

/* ---------- Quiz and checklist ---------- */
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 600; padding: 0; margin-bottom: .6rem; max-width: 68ch; }
.opt { display: flex; gap: .75rem; align-items: flex-start; padding: .6rem .8rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: .5rem; cursor: pointer; max-width: 52rem; min-height: 2.5rem; background: var(--bg); }
.opt:hover { background: var(--surface); }
.opt input { margin-top: .35rem; width: 1.1rem; height: 1.1rem; flex: none; accent-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--surface); box-shadow: inset 0 0 0 1px var(--accent); }
.feedback { margin-top: .75rem; padding: .6rem .9rem; border-radius: 6px; border: 1px solid; max-width: 52rem; }
.feedback.ok { background: var(--ok-bg); border-color: var(--ok-line); }
.feedback.bad { background: var(--bad-bg); border-color: var(--bad-line); }
.feedback strong.ok { color: var(--ok); } .feedback strong.bad { color: var(--bad); }

/* ---------- GitHub-style mock cards ---------- */
.gh { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0 0 1rem; max-width: 40rem; background: var(--bg); }
.gh-h { background: var(--surface); border-bottom: 1px solid var(--line); padding: .55rem .9rem; font-weight: 600; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.gh-h .num { color: var(--muted); font-weight: 400; }
.gh-b { padding: .75rem .9rem; }
.gh-b p, .gh-b ul { margin-bottom: .5rem; }
.gh-b ul { list-style: none; padding-left: 0; }
.gh-b li { display: flex; gap: .5rem; align-items: baseline; }
.lab { display: inline-block; font-size: .78rem; font-weight: 600; border: 1px solid var(--border); border-radius: 2em; padding: 0 .55rem; margin-right: .3rem; }
.state { display: inline-flex; align-items: center; gap: .35rem; border-radius: 2em; padding: .1rem .7rem; font-weight: 600; font-size: .85rem; color: #ffffff; background: var(--btn-bg); }
.state.merged, .state.closed { background: var(--done); color: var(--on-done); }
.board { display: grid; gap: .6rem; margin: 0 0 1rem; padding: 0; list-style: none; max-width: none; }
@media (min-width: 40rem) { .board { grid-template-columns: repeat(5, 1fr); } }
.board li { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: .5rem .7rem; margin: 0; font-size: .92rem; }
.board b { display: block; }
.map { width: 100%; max-width: 52rem; border-collapse: collapse; margin: 0 0 1rem; font-size: .95rem; }
.map th, .map td { border: 1px solid var(--line); padding: .45rem .7rem; text-align: left; vertical-align: top; }
.map th { background: var(--surface); }

/* ---------- Interactive GitHub simulations ---------- */
.sim { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 1rem; max-width: 56rem; background: var(--bg); }
.sim-bar { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: center; justify-content: space-between; background: var(--surface); border-bottom: 1px solid var(--line); padding: .5rem .9rem; font-weight: 600; border-radius: 6px 6px 0 0; }
.sim-tag { font-weight: 400; font-size: .82rem; color: var(--muted); }
.sim-body { padding: 1rem; }
.field { margin: 0 0 .9rem; }
.field label, .field .fl { display: block; font-weight: 600; margin-bottom: .3rem; }
.text { width: 100%; font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: .45rem .7rem; }
textarea.text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9rem; }
.chipcheck { display: inline-flex; align-items: center; gap: .4rem; margin: 0 .5rem .4rem 0; padding: .2rem .7rem; border: 1px solid var(--border); border-radius: 2em; cursor: pointer; font-size: .9rem; min-height: 2rem; }
.chipcheck:has(input:checked) { border-color: var(--accent); background: var(--surface-2); }
.chipcheck input { accent-color: var(--accent); }
.kanban { display: grid; gap: .6rem; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0 0 1rem; padding: 0; list-style: none; max-width: none; }
@media (max-width: 47.99rem) { .kanban { grid-template-columns: 1fr; } }
.kcol { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: .5rem; min-height: 5.5rem; margin: 0; }
.kcol.is-here { border: 2px solid var(--accent); padding: calc(.5rem - 1px); }
.kcol h4 { margin: 0 0 .4rem; font-size: .9rem; }
.kcard { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: .45rem .6rem; font-size: .9rem; }
.pr-title { font-size: 1.3rem; margin: 0 0 .5rem; }
.pr-title .num { color: var(--muted); font-weight: 400; }
.pr-meta { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 0 0 1rem; max-width: none; }
.commits { list-style: none; padding: 0; margin: 0 0 1rem; max-width: 52rem; border: 1px solid var(--line); border-radius: 6px; }
.commits li { margin: 0; padding: .5rem .8rem; border-top: 1px solid var(--line); display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.commits li:first-child { border-top: 0; }
.tag { font-size: .78rem; font-weight: 700; border: 1px solid currentColor; border-radius: 2em; padding: 0 .55rem; }
.tag.red { color: var(--red); } .tag.green { color: var(--green); } .tag.blue { color: var(--blue); }
.checks { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 1rem; max-width: 52rem; }
.checks-h { display: flex; gap: .6rem; align-items: center; padding: .6rem .9rem; font-weight: 700; background: var(--surface); border-radius: 6px 6px 0 0; border-bottom: 1px solid var(--line); }
.checks-h.ok { color: var(--ok); } .checks-h.bad { color: var(--bad); }
.checks-b { padding: .75rem .9rem; }
.checks-b.results { margin-top: 0; }
.merge-box { border: 1px solid var(--line); border-radius: 6px; padding: .8rem .9rem; max-width: 52rem; }
.merge-box.blocked { border-color: var(--bad-line); }
.merge-box.ready { border-color: var(--ok-line); }

/* ---------- Tooltips (absolutely positioned) ---------- */
.tipw { position: relative; display: inline-block; }
.tip { font: inherit; color: inherit; background: none; border: 0; padding: 0 1px; cursor: help; border-bottom: 2px dotted var(--accent); font-weight: 600; text-align: inherit; }
.tipbox {
  position: absolute; z-index: 40; left: 50%; bottom: calc(100% + 10px);
  transform: translateX(calc(-50% + var(--tx, 0px)));
  width: max-content; max-width: min(19rem, calc(100vw - 32px));
  background: var(--tip-bg); color: var(--tip-text); border-radius: 6px;
  padding: .55rem .75rem; font-size: .9rem; font-weight: 400; line-height: 1.45; text-align: left; box-shadow: var(--shadow);
  display: none;
}

<script>
'use strict';
/* =====================================================================
   1. Settings and saved progress
   Progress is a single number: how many steps are done, in order.
   There is no skip and no reset in the interface.
   ===================================================================== */
var KEY = 'tdd-progress-v1';
var storageOK = true;
var R = String.raw;

function loadState() {
  try {
    var raw = localStorage.getItem(KEY);
    var p = raw ? JSON.parse(raw) : {};
    return {
      n: 0,
      doneIds: Array.isArray(p.done) ? p.done.filter(function (x) { return typeof x === 'string'; }) : null,
      legacyN: Math.max(0, parseInt(p.n, 10) || 0), /* older saves stored one number */
      drafts: (p.drafts && typeof p.drafts === 'object') ? p.drafts : {},
      view: Number.isInteger(p.view) ? p.view : null
    };
  } catch (e) { storageOK = false; return { n: 0, doneIds: null, legacyN: 0, drafts: {}, view: null }; }
}
var state = loadState();
var ALL = [], LEGACY = [];
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ v: 2, done: ALL.slice(0, state.n).map(function (x) { return x.id; }), drafts: state.drafts, view: state.view })); }
  catch (e) { storageOK = false; var n = document.getElementById('storagenote'); if (n) n.hidden = false; }
}
/* Progress is always the unbroken run of finished steps from the start. */
function resolveProgress() {
  var set = {};
  (state.doneIds || LEGACY.slice(0, state.legacyN)).forEach(function (id) { set[id] = 1; });
  var n = 0;
  while (n < ALL.length && set[ALL[n].id]) n++;
  state.n = n;
}

/* =====================================================================
   2. Glossary tooltips and code helpers
   ===================================================================== */
var GLOSSARY = {
  tdd: ['TDD', 'Test-driven development. You write a small test first, then only enough code to make it pass.'],
  test: ['test', 'A small piece of code that checks another piece of code does what you expect.'],
  assertion: ['assertion', 'A check that says what the result must be. If it is wrong, the test fails.'],
  expect: ['expect', 'Starts an assertion. expect(result) means: here is the value I got.'],
  tobe: ['toBe', 'Checks that two values are exactly the same, for example 5 and 5.'],
  red: ['Red', 'The test fails. This is the starting point of every lap of the loop.'],
  green: ['Green', 'The test passes. You wrote just enough code to get here.'],
  refactor: ['Refactor', 'Tidy the code without changing what it does. The tests tell you if you broke something.'],
  regression: ['regression', 'A bug where something that used to work stops working after a change.'],
  edge: ['edge case', 'An unusual input at the limit of what is allowed, like zero, an empty string or the biggest value.'],
  boundary: ['boundary', 'The exact point where behaviour changes. If 8 characters is allowed and 7 is not, 7 and 8 are the boundary.'],
  unit: ['unit test', 'A test for one small piece of code, such as a single function.'],
  stub: ['stub', 'An unfinished version of a function, just enough code for the tests to run.'],
  mutant: ['planted bug', 'A copy of the code with a bug added on purpose. Good tests catch it by failing. This idea is called mutation testing.'],
  aaa: ['Arrange, Act, Assert', 'Arrange: set up the data. Act: run the code. Assert: check the result.'],
  story: ['user story', 'One sentence about what a person needs: As a [who], I want [what], so that [why].'],
  criteria: ['acceptance criteria', 'A checklist that says when the work is finished. Each point should be easy to test.'],
  issue: ['issue', 'A GitHub page that describes one piece of work, such as a feature or a bug. You can discuss it, label it and assign it.'],
  project: ['GitHub Project', 'A board or table on GitHub where issues are tracked as cards that move across columns.'],
  label: ['label', 'A coloured tag on an issue, such as bug or tdd, used to filter and organise.'],
  branch: ['branch', 'Your own copy of the code to work on safely, away from the main version.'],
  commit: ['commit', 'A saved snapshot of your changes with a short message describing them.'],
  pr: ['pull request', 'A request to merge your branch into main. Others can review it and tests can run on it.'],
  ci: ['CI', 'Continuous integration. A service such as GitHub Actions runs your tests automatically on every push.'],
  main: ['main branch', 'The trusted version of the code. Only reviewed, passing work should reach it.']
};
var tipN = 0;
function T(key, label) {
  var g = GLOSSARY[key]; var id = 'tip' + (++tipN);
  return '<span class="tipw"><button type="button" class="tip" aria-describedby="' + id + '">' + (label || g[0]) + '</button>' +
         '<span role="tooltip" id="' + id + '" class="tipbox">' + g[1] + '</span></span>';
}
function UITIP(label, text, extraClass, attrs) {
  var id = 'tip' + (++tipN);
  return '<span class="tipw right"><button type="button" class="btn sec icon ' + (extraClass || '') + '" aria-describedby="' + id + '" ' + (attrs || '') + '>' + label + '</button>' +
         '<span role="tooltip" id="' + id + '" class="tipbox">' + text + '</span></span>';
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function hl(code) {
  var re = /(\/\/.*$)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|\b(const|let|var|function|return|if|else|for|while|new|throw|true|false|null|undefined|typeof)\b|\b(\d+(?:\.\d+)?)\b/gm;
  var out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    var c = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : 'n';
    out += '<span class="tk-' + c + '">' + esc(m[0]) + '</span>';
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function svgIcon(inner) { return '<svg class="ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>'; }
var ICON = {
  issue: svgIcon('<circle cx="8" cy="8" r="6.25"/><circle cx="8" cy="8" r="1" fill="currentColor"/>'),
  pr: svgIcon('<circle cx="4" cy="3.5" r="1.75"/><circle cx="4" cy="12.5" r="1.75"/><circle cx="12" cy="12.5" r="1.75"/><path d="M4 5.25v5.5M12 10.75V6.5a2 2 0 0 0-2-2H8.5"/>'),
  check: svgIcon('<path d="m3 8.5 3.2 3.2L13 4.8"/>'),
  x: svgIcon('<path d="m4 4 8 8M12 4l-8 8"/>')
};
var COPY = [];
/* C(code, {title, lang, copy}) -> a captioned code block. */
function C(code, o) {
  o = o || {}; code = code.replace(/^\n/, '').replace(/\s+$/, '');
  var body = o.lang === 'text' ? esc(code) : hl(code);
  var btn = '';
  if (o.copy) { COPY.push(code); btn = '<button type="button" class="btn sec" data-copy="' + (COPY.length - 1) + '">Copy</button>'; }
  return '<div class="codebox"><div class="cap"><span>' + esc(o.title || 'JavaScript') + '</span>' + btn + '</div><pre class="code" tabindex="0" aria-label="' + esc(o.title || 'Code example') + '"><code>' + body + '</code></pre></div>';
}

/* =====================================================================
   3. Course content
   Step types: read, demo, quiz, task (fix | refactor | write-test), checklist
   ===================================================================== */
var MODULES = [

/* ---------------- 1 ---------------- */
{ id: 'idea', title: 'The big idea', time: 8,
  goal: 'Explain what ' + '{TDD}' + ' is and describe the Red, Green, Refactor loop in your own words.',
  steps: [
    { title: 'Test first, code second', type: 'read', html:
      '<p>Most people write code first, then click around to see if it works. ' + '{TDD}' + ' flips this around.</p>' +
      '<ol><li>You write a small ' + '{test}' + ' that describes what the code <em>should</em> do.</li>' +
      '<li>The test fails, because the code does not exist yet.</li>' +
      '<li>You write the code that makes the test pass.</li></ol>' +
      '<p>Think of a marking scheme. If you know exactly how your essay will be marked <em>before</em> you start writing, you write a better essay. A test is a marking scheme for your code.</p>' },
    { title: 'The loop: Red, Green, Refactor', type: 'read', html:
      '<p>TDD works in short laps. Each lap takes a few minutes.</p>' +
      '<ol class="loop"><li class="l-red"><h4>1. {red}</h4><p>Write one test for one tiny behaviour. Run it. It must fail.</p></li>' +
      '<li class="l-green"><h4>2. {green}</h4><p>Write the simplest code that makes the test pass. Nothing extra.</p></li>' +
      '<li class="l-blue"><h4>3. {refactor}</h4><p>Tidy up your code and your test. Run the tests again. They stay green.</p></li></ol>' +
      '<p class="loop-note">Then go round again with the next small behaviour.</p>' +
      '<p>The colours come from test runners, which show failing tests in red and passing tests in green.</p>' },
    { title: 'Why bother?', type: 'read', html:
      '<ul><li><strong>You catch mistakes early.</strong> A failing test tells you the problem within seconds.</li>' +
      '<li><strong>You can change code without fear.</strong> If something breaks, a {regression} shows up straight away.</li>' +
      '<li><strong>You think before you type.</strong> Writing the test makes you decide what "correct" means.</li>' +
      '<li><strong>Your tests explain the code.</strong> New people can read them to see what each part is meant to do.</li></ul>' +
      '<p class="note"><strong>Be honest about limits:</strong> TDD is less useful for quick throw-away experiments or for deciding how a page should look. It shines on logic: calculations, rules and data handling.</p>' },
    { title: 'Check: what comes first?', type: 'quiz',
      q: 'In TDD, what is the very first thing you do on each lap?',
      opts: [
        { t: 'Write the code for the feature', why: 'In TDD the code comes second. You need a test to aim at first.' },
        { t: 'Write a test that fails', why: 'Right. A failing test proves the behaviour is missing and gives you a target.' },
        { t: 'Tidy up the code', why: 'Tidying (refactoring) is the last part of the lap, not the first.' },
        { t: 'Ask someone to review it', why: 'Review matters, but it happens later, once the work exists.' }
      ], correct: 1 },
    { title: 'Check: put the loop in order', type: 'quiz',
      q: 'Which order is the TDD loop?',
      opts: [
        { t: 'Green, Red, Refactor', why: 'Green cannot come first. There must be a failing test before you make anything pass.' },
        { t: 'Refactor, Red, Green', why: 'You refactor working code, so it comes last.' },
        { t: 'Red, Green, Refactor', why: 'Correct. Fail, pass, then tidy.' },
        { t: 'Red, Refactor, Green', why: 'You should not tidy while a test is failing. Get to green first.' }
      ], correct: 2 }
  ] },

/* ---------------- 2 ---------------- */
{ id: 'anatomy', title: 'Anatomy of a test', time: 12,
  goal: 'Read a test, run it, understand a failure message, and make your first failing test pass.',
  steps: [
    { title: 'Three parts of every test', type: 'read', html:
      '<p>Most tests follow {aaa}.</p>' +
      C('test(\'adds two numbers\', () => {\n  const result = add(2, 3);   // Arrange and Act\n  expect(result).toBe(5);     // Assert\n});', { title: 'A test in JavaScript' }) +
      '<ul><li><code>test(\'name\', ...)</code> gives the test a name that says what should happen.</li>' +
      '<li><code>add(2, 3)</code> runs the code being tested.</li>' +
      '<li><code>{expect}(result).{tobe}(5)</code> is the {assertion}. If result is not 5, the test fails.</li></ul>' +
      '<p>All the examples in this course are in JavaScript, but the idea is the same in Python, Java, C# and others.</p>' },
    { title: 'Run a passing test', type: 'demo', expect: 'pass',
      intro: '<p>Here is a function and two tests. Press <strong>Run tests</strong>. Everything should go green.</p>',
      code: 'function add(a, b) {\n  return a + b;\n}',
      tests: 'test(\'adds two positive numbers\', () => {\n  expect(add(2, 3)).toBe(5);\n});\n\ntest(\'adds a negative number\', () => {\n  expect(add(5, -2)).toBe(3);\n});' },
    { title: 'Run a failing test', type: 'demo', expect: 'fail',
      intro: '<p>Now the code has a bug: it subtracts instead of adding. Run the tests. <strong>They should fail.</strong> A failing test is not a problem. It is the test doing its job.</p><p>Read the message under each failure. "Expected 5 but got -1" tells you what the test wanted and what the code gave.</p>',
      code: 'function add(a, b) {\n  return a - b;   // bug!\n}',
      tests: 'test(\'adds two positive numbers\', () => {\n  expect(add(2, 3)).toBe(5);\n});\n\ntest(\'adds a negative number\', () => {\n  expect(add(5, -2)).toBe(3);\n});' },
    { title: 'Check: spot the parts', type: 'quiz',
      q: 'In expect(total).toBe(10), which part is the value your code produced?',
      opts: [
        { t: 'toBe', why: 'toBe is the type of check. It compares two values.' },
        { t: 'total', why: 'Correct. total is the actual result. 10 is the expected result.' },

    { title: 'Your turn: make it green', type: 'task', kind: 'fix',
      brief: '<p>The tests below are already written. They fail, because <code>doubleIt</code> does nothing yet. Write the code so every test passes.</p><p><span class="chip now">Goal</span> Get from {red} to {green}.</p>',
      stub: 'function doubleIt(n) {\n  // your code here\n}',
      tests: 'test(\'doubles a positive number\', () => {\n  expect(doubleIt(2)).toBe(4);\n});\n\ntest(\'doubling zero gives zero\', () => {\n  expect(doubleIt(0)).toBe(0);\n});\n\ntest(\'doubles a negative number\', () => {\n  expect(doubleIt(-3)).toBe(-6);\n});\n\ntest(\'doubles a decimal\', () => {\n  expect(doubleIt(2.5)).toBe(5);\n});',
      hints: ['Run the tests first. Read what each one expects.', 'The function needs a return statement.', 'Doubling means multiplying by 2: return n * 2;'] }

/* ---------------- 3 ---------------- */
{ id: 'red', title: 'Red: write the failing test', time: 12,
  goal: 'Choose a tiny behaviour, write a test that fails for the right reason, and write your own tests.',
  steps: [
    { title: 'Start with the smallest behaviour', type: 'read', html:
      '<p>Do not try to test everything at once. Pick <strong>one</strong> small behaviour and write one test for it.</p>' +
      '<p>Say you need a function called <code>isEven</code>. A good first test is just one example:</p>' +
      C('test(\'returns true for an even number\', () => {\n  expect(isEven(4)).toBe(true);\n});', { title: 'One small test' }) +
      '<p>Name tests like sentences: what does the code do, and in which situation? <code>returns true for an even number</code> is far more useful than <code>test 1</code>.</p>' },
    { title: 'See it fail', type: 'demo', expect: 'fail',
      intro: '<p>We have <strong>not</strong> written <code>isEven</code> yet, only the test. Run it and read the message.</p><p>"isEven is not defined" is a good {red}. It fails because the code is missing, which is exactly the reason we expect.</p>',
      code: '// isEven does not exist yet.',
      tests: 'test(\'returns true for an even number\', () => {\n  expect(isEven(4)).toBe(true);\n});' },
    { title: 'Fail for the right reason', type: 'read', html:
      '<p>A red test is only useful if it fails <em>for the reason you expect</em>.</p>' +
      '<ul><li><strong>Good red:</strong> "Expected true but got false". The behaviour is missing.</li>' +
      '<li><strong>Bad red:</strong> a typo in the test, or a missing bracket. That tells you nothing about your code.</li>' +
      '<li><strong>Suspicious:</strong> a new test that passes straight away. Either the behaviour already existed or the test checks nothing.</li></ul>' +

    { title: 'Your turn: write the tests', type: 'task', kind: 'write-test', fn: 'isEven', minTests: 3,
      brief: '<p>This time <strong>you</strong> write the tests. The function below is a {stub}, an unfinished version that always returns false.</p>' +
        '<p>Write at least <strong>3 tests</strong> for <code>isEven</code>. The checker will confirm that:</p>' +
        '<ul><li>your tests {red} (fail) against the unfinished code,</li><li>they all pass against a correct version, so they are testing the right thing,</li><li>they catch some {mutant}s.</li></ul>',
      stub: 'function isEven(n) {\n  return false;\n}',
      starter: '// Write at least 3 tests for isEven.\n// Shape: test(\'name\', () => { expect(...).toBe(...); });\n',
      reference: 'function isEven(n) {\n  return n % 2 === 0;\n}',
      mutants: ['function isEven(n) { return true; }', 'function isEven(n) { return n > 10; }', 'function isEven(n) { return n % 2 === 1; }'],
      hints: ['Test one even number, one odd number and zero.', 'An even number test looks like: expect(isEven(4)).toBe(true);', 'Example set: isEven(4) is true, isEven(7) is false, isEven(0) is true.'] }
  ] },

/* ---------------- 4 ---------------- */
{ id: 'green', title: 'Green: the simplest code', time: 12,
  goal: 'Write just enough code to pass each test, and let new tests grow the solution step by step.',
  steps: [
    { title: 'Write the simplest thing', type: 'read', html:
      '<p>In the {green} step your only job is to make the failing test pass. Do not add extra features. Do not guess what you might need later.</p>' +
      '<p>This feels strange at first. It keeps your code small and means every line exists because a test asked for it.</p>' +
      '<p class="note"><strong>Rule of thumb:</strong> if no test needs the line, do not write it yet.</p>' },
    { title: 'Fake it, then prove it', type: 'read', html:
      '<p>Imagine your first test says <code>fizzBuzz(1)</code> should give <code>\'1\'</code>. The simplest passing code is:</p>' +
      C('function fizzBuzz(n) {\n  return \'1\';   // fake it!\n}') +
      '<p>That is allowed. Now add the next test: <code>fizzBuzz(2)</code> should give <code>\'2\'</code>. The fake no longer works, so you are forced to write real logic:</p>' +
      C('function fizzBuzz(n) {\n  return String(n);\n}') +
      '<p>Each new test pushes the code to become more general. Adding tests to force better code is called <em>triangulation</em>.</p>' },
    { title: 'Check: what is "simplest"?', type: 'quiz',
      q: 'You have one test: add(1, 1) should be 2. What does "the simplest code" mean here?',
      opts: [
        { t: 'Any code that passes it, even return 2. The next test will force a real solution.', why: 'Right. Pass the test you have, then let the next test push the code forward.' },

        { t: 'Copy a finished solution from the internet', why: 'Then you would not learn what the tests are driving you towards.' }
      ], correct: 0 },
    { title: 'Your turn: grow FizzBuzz', type: 'task', kind: 'fix',
      brief: '<p>Time to run the loop. <code>fizzBuzz(n)</code> must follow these rules:</p><ul><li>Multiples of 3 give <code>\'Fizz\'</code>.</li><li>Multiples of 5 give <code>\'Buzz\'</code>.</li><li>Multiples of both give <code>\'FizzBuzz\'</code>.</li><li>Anything else gives the number as text.</li></ul>' +

{ id: 'refactor', title: 'Refactor: tidy up safely', time: 12,

    { title: 'Before: working but repetitive', type: 'demo', expect: 'pass',
      intro: '<p>This code works, and the tests prove it. But it repeats itself.</p>',
      code: 'function levelName(n) {\n  if (n === 1) {\n    return \'Beginner\';\n  } else if (n === 2) {\n    return \'Intermediate\';\n  } else if (n === 3) {\n    return \'Advanced\';\n  } else {\n    return \'Unknown\';\n  }\n}',
      tests: 'test(\'level 1 is Beginner\', () => {\n  expect(levelName(1)).toBe(\'Beginner\');\n});\n\ntest(\'level 2 is Intermediate\', () => {\n  expect(levelName(2)).toBe(\'Intermediate\');\n});\n\ntest(\'level 3 is Advanced\', () => {\n  expect(levelName(3)).toBe(\'Advanced\');\n});\n\ntest(\'other levels are Unknown\', () => {\n  expect(levelName(99)).toBe(\'Unknown\');\n});' },
    { title: 'After: same tests, tidier code', type: 'demo', expect: 'pass',
      intro: '<p>We replaced the chain with a lookup table. The <strong>tests did not change</strong>, and they still pass. That is how you know the behaviour stayed the same.</p>',
      code: 'const LEVELS = {\n  1: \'Beginner\',\n  2: \'Intermediate\',\n  3: \'Advanced\'\n};\n\nfunction levelName(n) {\n  return LEVELS[n] || \'Unknown\';\n}',
      tests: 'test(\'level 1 is Beginner\', () => {\n  expect(levelName(1)).toBe(\'Beginner\');\n});\n\ntest(\'level 2 is Intermediate\', () => {\n  expect(levelName(2)).toBe(\'Intermediate\');\n});\n\ntest(\'level 3 is Advanced\', () => {\n  expect(levelName(3)).toBe(\'Advanced\');\n});\n\ntest(\'other levels are Unknown\', () => {\n  expect(levelName(99)).toBe(\'Unknown\');\n});' },
    { title: 'Your turn: refactor', type: 'task', kind: 'refactor',
      brief: '<p>This function works and the tests pass. Your job is to <strong>refactor</strong> it so it has <strong>no <code>if</code> statements</strong> (or one at most), for example by using a lookup object. The tests must stay green the whole time.</p>' +
        '<p>The check needs two things: all tests pass, and the code is different from the starting point.</p>',
      stub: 'function colourCode(name) {\n  if (name === \'red\') {\n    return \'#ff0000\';\n  } else if (name === \'green\') {\n    return \'#00ff00\';\n  } else if (name === \'blue\') {\n    return \'#0000ff\';\n  } else {\n    return \'#000000\';\n  }\n}',
      tests: 'test(\'red\', () => {\n  expect(colourCode(\'red\')).toBe(\'#ff0000\');\n});\n\ntest(\'green\', () => {\n  expect(colourCode(\'green\')).toBe(\'#00ff00\');\n});\n\ntest(\'blue\', () => {\n  expect(colourCode(\'blue\')).toBe(\'#0000ff\');\n});\n\ntest(\'unknown colours are black\', () => {\n  expect(colourCode(\'pink\')).toBe(\'#000000\');\n});',
      maxIf: 1,
      hints: ['Run the tests before you change anything so you know they start green.', 'Create an object with the colour names as keys and the hex codes as values.', 'Look up the name in the object. For unknown names, fall back with ||: return COLOURS[name] || \'#000000\';'] },
    { title: 'Check: when is it safe?', type: 'quiz',
      q: 'When is it safe to refactor?',
      opts: [
        { t: 'While a test is failing, so you can fix both at once', why: 'Mixing a fix and a tidy-up makes it hard to tell what broke. Get to green first.' },
        { t: 'When all tests are green', why: 'Correct. Green tests are your safety net.' },
        { t: 'Before writing any tests', why: 'Without tests you cannot tell whether you changed the behaviour.' },
        { t: 'Only at the very end of a project', why: 'Small tidy-ups every lap stop mess from piling up.' }
      ], correct: 1 }
  ] },

/* ---------------- 6 ---------------- */
{ id: 'good', title: 'Good tests and edge cases', time: 15,
  goal: 'Write clear tests, hunt for edge cases, and prove your tests can catch real bugs.',
  steps: [
    { title: 'Clear tests', type: 'read', html:
      '<p>Good tests are easy to read and fail for one reason only.</p>' +
      '<ul><li><strong>Name it like a sentence.</strong> <code>returns 0 for an empty basket</code>, not <code>test 3</code>.</li>' +
      '<li><strong>One idea per test.</strong> If it fails, you know what is wrong.</li>' +
      '<li><strong>Keep it simple.</strong> A test should not need its own tests.</li>' +
      '<li><strong>Keep tests independent.</strong> One test should never rely on another having run first.</li></ul>' +
      C('test(\'returns 0 for an empty basket\', () => {\n  const basket = [];              // Arrange\n  const total = basketTotal(basket); // Act\n  expect(total).toBe(0);          // Assert\n});') },
    { title: 'Hunt for edge cases', type: 'read', html:
      '<p>Bugs love the edges. For every function, ask: what happens at the limits? Try the <strong>Zero, One, Many, Edge</strong> list:</p>' +
      '<ul><li><strong>Zero:</strong> 0, an empty string, an empty list.</li><li><strong>One:</strong> a single item.</li><li><strong>Many:</strong> a typical example with several items.</li><li><strong>Edge:</strong> negative numbers, the exact {boundary}, the biggest and smallest allowed values, wrong types.</li></ul>' +
      '<p>If a rule says "at least 8 characters", test 7 characters (too short) <em>and</em> 8 characters (just enough). Most real bugs hide on that line.</p>' +
      '<p>These are all {edge}s.</p>' },
    { title: 'Check: the best test name', type: 'quiz',
      q: 'Which test name is the most useful when it fails?',
      opts: [
        { t: 'test 1', why: 'When this fails you have to open the test to learn what it was checking.' },
        { t: 'works', why: 'Too vague. What works, and in which situation?' },
        { t: 'returns the minimum when the number is below the range', why: 'Correct. It names the behaviour and the situation.' },
        { t: 'clampTest', why: 'It names the function but not what should happen.' }
      ], correct: 2 },
    { title: 'Do your tests catch bugs?', type: 'read', html:
      '<p>Passing tests do not prove the code is right. They only prove the code is right <em>for the cases you wrote</em>.</p>' +
      '<p>A smart way to check test quality is to add a bug on purpose and see if the tests notice. We call that a {mutant}. If your tests still pass, they have a gap.</p>' +
      '<p>In the next task the checker has several hidden buggy versions of the function. Your tests need to fail on every one of them. The only way to do that is to cover the edges.</p>' },
    { title: 'Your turn: test the edges', type: 'task', kind: 'write-test', fn: 'clamp', minTests: 5,
      brief: '<p><code>clamp(n, min, max)</code> keeps a number inside a range. If <code>n</code> is below <code>min</code> it returns <code>min</code>. If it is above <code>max</code> it returns <code>max</code>. Otherwise it returns <code>n</code>.</p>' +
        '<p>Write at least <strong>5 tests</strong>. The checker will plant bugs in the code, and your tests must catch all of them.</p>',
      stub: 'function clamp(n, min, max) {\n  return n;\n}',
      starter: '// Example: clamp(15, 0, 10) should give 10\n// Think: below the range, above the range, inside it, and exactly on each boundary.\n',
      reference: 'function clamp(n, min, max) {\n  return Math.min(Math.max(n, min), max);\n}',
      mutants: ['function clamp(n, min, max) { return Math.max(n, min); }',
                'function clamp(n, min, max) { return Math.min(n, max); }',
                'function clamp(n, min, max) { if (n <= min) return min + 1; if (n > max) return max; return n; }',
                'function clamp(n, min, max) { if (n < min) return min; if (n >= max) return max - 1; return n; }'],
      hints: ['You need at least one test for each of: below the range, above the range, inside the range.', 'Some bugs only show on the boundary. Test n equal to min and n equal to max.', 'Example set for clamp(n, 0, 10): -5 gives 0, 15 gives 10, 5 gives 5, 0 gives 0, 10 gives 10.'] }
  ] },

/* ---------------- 7 ---------------- */
{ id: 'plan', title: 'Plan it with GitHub issues and Projects', time: 15,
  goal: 'Turn an idea into a GitHub issue with testable acceptance criteria and track it on a Project board.',
  steps: [
    { title: 'From idea to issue', type: 'read', html:
      '<p>Before you write any test you need to know what you are building. On GitHub, that starts with an {issue}.</p>' +
      '<p>A good issue has a short title, a {story} and {criteria}:</p>' +
      '<div class="gh"><div class="gh-h"><span>Password strength checker</span><span class="open">Open</span></div><div class="gh-b">' +
      '<p><span class="lab">tdd</span><span class="lab">feature</span></p>' +
      '<p><strong>User story:</strong> As a new user, I want to know if my password is strong, so that my account is safe.</p>' +
      '<p><strong>Acceptance criteria</strong></p><ul><li>&#9744; Returns false if shorter than 8 characters</li><li>&#9744; Returns false if it has no number</li><li>&#9744; Returns true for "Sunny2day"</li></ul></div></div>' +
      '<p>Each issue is <em>one</em> small piece of work. If it feels big, split it into several issues.</p>' },
    { title: 'Criteria become test names', type: 'read', html:
      '<p>Here is the link between GitHub and TDD. <strong>Every acceptance criterion becomes at least one test.</strong> You do not need to invent tests from nothing.</p>' +
      '<table class="map"><caption class="sr-only">Acceptance criteria and matching tests</caption><thead><tr><th scope="col">Acceptance criterion</th><th scope="col">Test name</th></tr></thead><tbody>' +
      '<tr><td>Returns false if shorter than 8 characters</td><td><code>rejects a password shorter than 8 characters</code></td></tr>' +
      '<tr><td>Returns false if it has no number</td><td><code>rejects a password with no number</code></td></tr>' +
      '<tr><td>Returns true for "Sunny2day"</td><td><code>accepts a strong password</code></td></tr></tbody></table>' +
      '<p>When all the tests are green, all the criteria are met, and the issue is finished.</p>' },
    { title: 'Check: a testable criterion', type: 'quiz',
      q: 'Which acceptance criterion is easiest to turn into a test?',
      opts: [
        { t: 'The password checker should be good', why: 'What does "good" mean? Nobody can write a test for that.' },
        { t: 'Returns false when the password has fewer than 8 characters', why: 'Correct. It has a clear input and a clear expected output.' },
        { t: 'It should feel secure to users', why: 'Feelings cannot be tested with code.' },
        { t: 'Code should be clean', why: 'Important, but it is not a behaviour to test. Refactoring covers that.' }
      ], correct: 1 },
    { title: 'Track work on a Project board', type: 'read', html:
      '<p>A {project} shows all your issues as cards on one board. Your team sees at a glance what is waiting, what is being built and what is done.</p>' +
      '<ol class="board"><li><b>Backlog</b>Ideas not yet planned</li><li><b>Ready</b>Has acceptance criteria</li><li><b>In progress</b>Red, Green, Refactor happens here</li><li><b>In review</b>A {pr} is open</li><li><b>Done</b>Merged and closed</li></ol>' +
      '<p>An issue is <strong>Ready</strong> only when its acceptance criteria are written. That is your "definition of ready" for TDD.</p>' +
      '<h4>How to set one up</h4><ol><li>Open your repository on GitHub and choose <strong>Projects</strong>, then <strong>New project</strong>.</li><li>Pick the <strong>Board</strong> template.</li><li>Rename the Status columns to match the five above.</li><li>Choose <strong>Add item</strong> and search for an issue, or press <kbd>+</kbd> in a column to create one.</li></ol>' +
      '<p>Use {label}s such as <code>tdd</code>, <code>bug</code> and <code>feature</code> to filter the board.</p>' },
    { title: 'Copy the issue template', type: 'read', html:
      '<p>Use this body whenever you create a new issue. It forces you to write acceptance criteria <em>before</em> any code.</p>' +
      C('## User story\nAs a [who], I want [what], so that [why].\n\n## Acceptance criteria\n- [ ] Criterion one (becomes a test)\n- [ ] Criterion two (becomes a test)\n- [ ] Criterion three (becomes a test)\n\n## Notes\nEdge cases to remember: zero, empty, boundaries.', { title: 'Issue body (Markdown)', lang: 'text', copy: true }) +
      '<p class="callout">This repository already includes it as an issue form in <code>.github/ISSUE_TEMPLATE</code>. If you copy or fork the repository, the same form appears when you press <strong>New issue</strong>.</p>' },
    { id: 'plan-issue-sim', isNew: true, title: 'Showcase: create the issue', type: 'showcase', demo: 'issue',
      intro: '<p>Practise on a safe copy of GitHub\'s <strong>New issue</strong> page. Fill it in for a password strength checker (or any idea you like). Replace the example criteria with your own, then press <strong>Submit new issue</strong>.</p>' },
    { id: 'plan-board-sim', isNew: true, title: 'Showcase: move the card across the board', type: 'showcase', demo: 'board',
      intro: '<p>Your issue is now a card on a {project} board. Move it from <strong>Backlog</strong> to <strong>Done</strong>. Each column has a rule that must be met first, just like a real team\'s "definition of done". The buttons work with a keyboard, so no dragging is needed.</p>' },
    { title: 'Try it in your own repository', type: 'checklist',
      intro: '<p>Do these on GitHub, then tick each box. These are honour-based, so be honest: the next module builds on them.</p>',
      items: ['I have a repository to practise in (a new empty one is fine).', 'I created a Project using the Board template.', 'I created an issue with a user story and at least three acceptance criteria as a checklist.', 'I added the issue to my Project and moved it to Ready.'] }
  ] },

/* ---------------- 8 ---------------- */
{ id: 'ship', title: 'Branch, commit, review, merge', time: 15,
  goal: 'Work on an issue in a branch, record Red, Green, Refactor in your commits, and merge through a pull request that runs your tests.',
  steps: [
    { title: 'One issue, one branch', type: 'read', html:
      '<p>Never build on the {main}. Create a {branch} for each issue. Put the issue number in the name so it is easy to link back:</p>' +
      C('12-password-checker', { title: 'Branch name', lang: 'text' }) +
      '<p>The easy way: open the issue on GitHub, find <strong>Development</strong> in the right-hand sidebar and choose <strong>Create a branch</strong>. GitHub links the branch to the issue for you.</p>' },
    { title: 'Commits tell the Red, Green, Refactor story', type: 'read', html:
      '<p>A {commit} is a saved snapshot. Make a small one at the end of each step of the loop. Run your tests before every commit.</p>' +
      C('test: add failing test for password under 8 characters   (Red)\nfeat: reject passwords shorter than 8 characters            (Green)\nrefactor: extract MIN_LENGTH constant                       (Refactor)', { title: 'Commit messages', lang: 'text', copy: true }) +
      '<p>Anyone reading your history can see that you wrote the test first. It is also easy to undo one small commit if something goes wrong.</p>' },
    { title: 'Check: which commit?', type: 'quiz',
      q: 'You just made a new test pass and all tests are green. Which commit message fits best?',
      opts: [
        { t: 'stuff', why: 'Messages should say what changed. "stuff" helps nobody.' },
        { t: 'test: add failing test for empty password', why: 'That describes a Red step. Your test is already passing now.' },
        { t: 'feat: reject empty passwords', why: 'Correct. It describes the behaviour you just added (Green).' },
        { t: 'fixed it', why: 'Say what you fixed. Future you will not remember.' }
      ], correct: 2 },
    { title: 'Open a pull request that closes the issue', type: 'read', html:
      '<p>When the work is done, push your branch and open a {pr}. Link the issue in the description:</p>' +
      C('## What changed\nAdds isStrongPassword with tests.\n\n## How I tested\n- [x] Wrote the failing tests first\n- [x] All tests pass\n- [x] Refactored with tests green\n\nCloses #12', { title: 'Pull request description (Markdown)', lang: 'text', copy: true }) +
      '<p>The words <code>Closes #12</code> are special. When the pull request is merged, GitHub <strong>closes issue 12 automatically</strong> and the card on your Project moves to Done.</p>' +
      '<p>This repository includes this as a pull request template in <code>.github</code>.</p>' },
    { title: 'Let GitHub run your tests', type: 'read', html:
      '<p>{ci} runs your tests on every push so nobody has to remember to. On GitHub it is called <strong>GitHub Actions</strong>. Save this file in your repository as <code>.github/workflows/tests.yml</code> (this example is for a Node project that has an <code>npm test</code> script):</p>' +
      C('name: Tests\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - run: npm ci\n      - run: npm test', { title: '.github/workflows/tests.yml', lang: 'text', copy: true }) +
      '<p>You will see a green tick or a red cross on every pull request. In <strong>Settings, Branches</strong> you can require that check to pass before anything is merged into main.</p>' },
    { id: 'ship-pr-sim', isNew: true, title: 'Showcase: a pull request with live checks', type: 'showcase', demo: 'pr',
      intro: '<p>This is a simulated {pr}. The checks run <strong>real tests</strong> on each commit. Start with the Red commit, watch the check fail and block the merge, then push the next commits and merge once it turns green.</p>' },
    { title: 'Check: what does it do?', type: 'quiz',
      q: 'You write "Closes #12" in a pull request description. What happens when the pull request is merged?',
      opts: [
        { t: 'Nothing. It is just a comment.', why: 'GitHub reads those words and acts on them.' },
        { t: 'Issue 12 is closed automatically.', why: 'Correct. The issue closes and any linked Project card moves to Done.' },
        { t: 'The branch is renamed to 12.', why: 'Branch names are not changed by this.' },
        { t: 'The tests are skipped.', why: 'It has no effect on tests. Your Actions workflow still runs them.' }
      ], correct: 1 },
    { title: 'Try it in your own repository', type: 'checklist',
      intro: '<p>Use the issue from the last module. Tick each box when it is done on GitHub.</p>',
      items: ['I created a branch from my issue (the name includes the issue number).', 'I made at least three commits: one Red, one Green and one Refactor.', 'I opened a pull request with "Closes #" and the issue number.', 'I merged the pull request and saw the issue close and the card move to Done.'] }
  ] },

{ id: 'final', title: 'Final challenge: password checker', time: 20,
  goal: 'Put it all together: start from an issue, write tests first, make them pass, and be ready to ship.',
  steps: [
    { title: 'The issue', type: 'read', html:
      '<p>A teammate has put this issue in <strong>Ready</strong> on your board. You will do the work in two parts, just like a real lap of TDD.</p>' +
      '<div class="gh"><div class="gh-h"><span>Password strength checker</span><span class="open">Ready</span></div><div class="gh-b">' +
      '<p><span class="lab">tdd</span><span class="lab">feature</span></p>' +
      '<p><strong>User story:</strong> As a new user, I want to know if my password is strong, so that my account is safe.</p>' +
      '<p><strong>Acceptance criteria</strong></p><ul><li>&#9744; Returns true only if the password has at least 8 characters</li><li>&#9744; and at least one number</li><li>&#9744; and at least one capital letter</li><li>&#9744; Returns false for anything that is not text</li></ul></div></div>' +
      '<ol><li><strong>Part 1, {red}:</strong> write your own tests from the criteria.</li><li><strong>Part 2, {green}:</strong> make your team\'s tests pass.</li></ol>' },
    { title: 'Part 1: write the tests (Red)', type: 'task', kind: 'write-test', fn: 'isStrongPassword', minTests: 6,
      brief: '<p>Turn the acceptance criteria into at least <strong>6 tests</strong>. Remember the boundary at 8 characters, a password with no number, and a password with no capital letter. The checker plants bugs in hidden versions of the function, and your tests must catch every one.</p>',
      stub: 'function isStrongPassword(pw) {\n  return false;\n}',
      starter: '// One test per acceptance criterion, plus edge cases.\n// Strong example: \'Sunny2day\'\n',
      reference: 'function isStrongPassword(pw) {\n  return typeof pw === \'string\' && pw.length >= 8 && /[0-9]/.test(pw) && /[A-Z]/.test(pw);\n}',
      mutants: ['function isStrongPassword(pw) { return pw.length >= 7 && /[0-9]/.test(pw) && /[A-Z]/.test(pw); }',
                'function isStrongPassword(pw) { return pw.length > 8 && /[0-9]/.test(pw) && /[A-Z]/.test(pw); }',
                'function isStrongPassword(pw) { return pw.length >= 8 && /[A-Z]/.test(pw); }',
                'function isStrongPassword(pw) { return pw.length >= 8 && /[0-9]/.test(pw); }'],
      hints: ['Write one test that should return true, such as Sunny2day.', 'Then one test that breaks each rule on its own: too short, no number, no capital.', 'Add boundary tests: exactly 8 characters (should pass) and 7 characters (should fail), both with a number and a capital.'] },
    { title: 'Part 2: make the tests pass (Green)', type: 'task', kind: 'fix',
      brief: '<p>Your teammate wrote these tests from the same issue. The function is a {stub} that always returns false. Write <code>isStrongPassword</code> so every test passes. Run often, and fix one failure at a time.</p>',
      stub: 'function isStrongPassword(pw) {\n  return false;\n}',
      tests: 'test(\'accepts a long password with a number and a capital\', () => {\n  expect(isStrongPassword(\'Sunny2day\')).toBe(true);\n});\n\ntest(\'accepts exactly 8 characters\', () => {\n  expect(isStrongPassword(\'Abcdef12\')).toBe(true);\n});\n\ntest(\'rejects 7 characters\', () => {\n  expect(isStrongPassword(\'Abcde12\')).toBe(false);\n});\n\ntest(\'rejects a password with no number\', () => {\n  expect(isStrongPassword(\'Sunnyyday\')).toBe(false);\n});\n\ntest(\'rejects a password with no capital letter\', () => {\n  expect(isStrongPassword(\'sunny2day\')).toBe(false);\n});\n\ntest(\'rejects an empty string\', () => {\n  expect(isStrongPassword(\'\')).toBe(false);\n});\n\ntest(\'rejects something that is not text\', () => {\n  expect(isStrongPassword(null)).toBe(false);\n  expect(isStrongPassword(12345678)).toBe(false);\n});',
      hints: ['Check one rule at a time. Start by returning pw.length >= 8.', 'Test for a number with /[0-9]/.test(pw) and for a capital with /[A-Z]/.test(pw).', 'First check typeof pw === \'string\', then join the checks with &&. That also handles null and numbers without crashing.'] },
    { title: 'Ready to ship', type: 'checklist',
      intro: '<p>Final step. Before you would merge this in a real project, you check the whole loop. Be honest with each one.</p>',
      items: ['I wrote the tests before the code and saw them fail.', 'I wrote only enough code to make them pass.', 'I could refactor the code and the tests would tell me if I broke it.', 'I know how to link my work to an issue and a Project board with a branch and pull request.'] }
  ] }
];

/* =====================================================================
   4. Test runner: runs in a Web Worker so a bad loop can be stopped
   ===================================================================== */
var WORKER_SRC = '(' + function () {
  self.onmessage = function (ev) {
    var code = ev.data.code, tests = ev.data.tests, queue = [], prefix = [];
    function fmt(v) { if (typeof v === 'string') return '"' + v + '"'; if (v === undefined) return 'undefined'; try { var j = JSON.stringify(v); return j === undefined ? String(v) : j; } catch (e) { return String(v); } }
    function deq(a, b) {
      if (Object.is(a, b)) return true;
      if (typeof a !== 'object' || typeof b !== 'object' || !a || !b) return false;
      if (Array.isArray(a) !== Array.isArray(b)) return false;
      var ka = Object.keys(a), kb = Object.keys(b);
      if (ka.length !== kb.length) return false;
      return ka.every(function (k) { return deq(a[k], b[k]); });
    }
    function describe(n, fn) { prefix.push(n); try { fn(); } finally { prefix.pop(); } }
    function test(n, fn) { queue.push({ name: prefix.concat(n).join(' > '), fn: fn }); }
    function make(a, neg) {
      function chk(ok, msg, nmsg) { if (neg ? ok : !ok) throw new Error(neg ? nmsg : msg); }
      return {
        toBe: function (b) { chk(Object.is(a, b), 'Expected ' + fmt(b) + ' but got ' + fmt(a), 'Expected not to get ' + fmt(b)); },
        toEqual: function (b) { chk(deq(a, b), 'Expected ' + fmt(b) + ' but got ' + fmt(a), 'Expected not to equal ' + fmt(b)); },
        toBeTruthy: function () { chk(!!a, 'Expected a truthy value but got ' + fmt(a), 'Expected a falsy value'); },
        toBeFalsy: function () { chk(!a, 'Expected a falsy value but got ' + fmt(a), 'Expected a truthy value'); },

/* ---------- read ---------- */

/* ---------- results ---------- */

/* ---------- demo ---------- */
function bDemo(s, getCard) {

    '<div class="actions"><button type="button" class="btn">Run tests</button></div><div class="results" aria-live="polite"></div></div>');

/* ---------- tasks ---------- */
function bTask(s, getCard) {

  var html = s.brief;
  if (write) html += C(s.stub, { title: 'Unfinished code (read-only)' });
  else html += C(s.tests, { title: 'Tests (read-only)' });
  html += '<label class="lbl" for="ta-' + s.id + '">' + (write ? 'Your tests' : s.kind === 'refactor' ? 'Your refactored code' : 'Your code') + '</label>' +
    '<p class="hint-text">Press Ctrl+Enter (or Cmd+Enter) to run. Press Tab to move on, so type spaces to indent.</p>' +
    '<textarea class="editor" id="ta-' + s.id + '" rows="' + rows + '" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>' +
    '<div class="actions"><button type="button" class="btn" data-run>' + (write ? 'Check my tests' : 'Run tests') + '</button>' +

    '<div class="results" aria-live="polite"></div><div class="hints" aria-live="polite"></div>';

    hintBox.innerHTML += '<div class="callout"><strong>Hint ' + (hintN + 1) + ' of ' + s.hints.length + ':</strong> ' + esc(s.hints[hintN]) + '</div>';

  var form = $('form', f.body), fb = $('.fb', f.body), out = $('.out', f.body);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('#si-title', f.body).value.trim(), story = $('#si-story', f.body).value.trim(), crit = parseCriteria($('#si-crit', f.body).value);
    var errs = [];
    if (title.length < 5) errs.push('Give the issue a short title (at least 5 characters).');
    if (!/i want/i.test(story) || !/so that/i.test(story)) errs.push('Write the user story as: As a [who], I want [what], so that [why].');
    if (crit.length < 3) errs.push('Add at least 3 acceptance criteria, each on its own line starting with "- [ ] ".');
    else if (crit.some(function (c) { return /becomes a test/i.test(c); })) errs.push('Replace the example criteria with your own. Each one should describe something you could test.');
    else if (crit.some(function (c) { return c.length < 8; })) errs.push('Make each criterion a full sentence (at least 8 characters).');
    if (errs.length) { fb.innerHTML = '<div class="feedback bad" role="alert"><strong class="bad">Fix these first:</strong><ul>' + errs.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'; out.innerHTML = ''; return; }
    fb.innerHTML = '';
    var labels = [].map.call(form.querySelectorAll('.chipcheck input:checked'), function (c) { return c.parentNode.textContent.trim(); });
    out.innerHTML = '<h4>Issue created</h4><div class="gh"><div class="gh-h">' + ICON.issue + '<span>' + esc(title) + '</span><span class="num">#12</span><span class="state">Open</span></div><div class="gh-b">' +
      '<p>' + labels.map(function (l) { return '<span class="lab">' + esc(l) + '</span>'; }).join('') + '</p><p><strong>User story:</strong> ' + esc(story) + '</p><p><strong>Acceptance criteria</strong></p><ul>' +
      crit.map(function (c) { return '<li>&#9744; ' + esc(c) + '</li>'; }).join('') + '</ul></div></div>' +
      '<h4>Your criteria give you these tests</h4>' + C(crit.map(function (c) { return "test('" + c.replace(/'/g, '') + "', () => { /* ... */ });"; }).join('\n'), { title: 'Starter tests, one per criterion' });
    say('Issue created. Your criteria have been turned into starter tests.');
    if (!done) finish();
  });
  return f;
}

/* ---- Projects board ---- */
function simBoard(s, done, finish) {
  var COLS = ['Backlog', 'Ready', 'In progress', 'In review', 'Done'];
  var NOTE = [
    'Ideas wait here. An issue can only move on once the team knows what "finished" means.',
    'The issue has acceptance criteria. Someone picks it up and creates a branch.',
    'This is where Red, Green and Refactor happen. Every lap has to be completed.',
    'A pull request is open. CI runs the tests and a teammate reads the code.',
    'Merged and closed. The pull request said "Closes #12", so this happened automatically.'
  ];
  var GATES = [
    ['The acceptance criteria are written'],
    ['A branch has been created from the issue'],
    ['Red: I wrote a failing test', 'Green: I made it pass with simple code', 'Refactor: I tidied up with the tests green'],
    ['The CI checks are green', 'A teammate has reviewed the code'],
    []
  ];
  var col = done ? 4 : 0;
  var f = simFrame('Project board: Password strength checker');
  function draw(refocus) {
    var h = '<ol class="kanban" aria-label="Board columns">';
    COLS.forEach(function (c, i) { h += '<li class="kcol' + (i === col ? ' is-here' : '') + '"><h4>' + c + (i === col ? ' <span class="sr-only">(card is here)</span>' : '') + '</h4>' + (i === col ? '<div class="kcard">' + ICON.issue + ' #12 Password checker</div>' : '') + '</li>'; });
    h += '</ol>';
    if (col < 4) {
      h += '<div class="callout"><p><strong>' + COLS[col] + ':</strong> ' + NOTE[col] + '</p><fieldset><legend class="sr-only">Before moving on, confirm each item</legend>';
      GATES[col].forEach(function (g) { h += '<label class="opt"><input type="checkbox"><span>' + esc(g) + '</span></label>'; });
      h += '</fieldset><button type="button" class="btn mv">Move card to ' + COLS[col + 1] + '</button><div class="fb" aria-live="polite"></div></div>';
    } else h += '<div class="feedback ok"><strong class="ok">&#10003; Done.</strong> ' + NOTE[4] + '</div>';
    f.body.innerHTML = h;
    var mv = $('.mv', f.body);
    if (mv) mv.addEventListener('click', function () {
      var left = [].filter.call(f.body.querySelectorAll('input[type=checkbox]'), function (c) { return !c.checked; }).length;
      if (left) { $('.fb', f.body).innerHTML = '<p class="feedback bad"><strong class="bad">' + left + ' to confirm.</strong> The card cannot move until the rule for this column is met.</p>'; return; }
      col++; draw(true); say('Card moved to ' + COLS[col] + '.');
      if (col === 4 && !done) finish();
    });
    if (refocus) { var t = $('.mv', f.body) || $('.feedback', f.body); if (t) { if (!t.hasAttribute('tabindex') && t.tagName !== 'BUTTON') t.setAttribute('tabindex', '-1'); t.focus(); } }
  }
  draw(false); return f;
}

/* ---- Pull request with real checks ---- */
var PR_TESTS = "test('accepts a strong password', () => {\n  expect(isStrongPassword('Sunny2day')).toBe(true);\n});\n\ntest('rejects a short password', () => {\n  expect(isStrongPassword('Ab1')).toBe(false);\n});";
var PR_COMMITS = [
  { msg: 'test: add failing tests for password strength', tag: 'Red', cls: 'red', code: 'function isStrongPassword(pw) {\n  return false;\n}' },
  { msg: 'feat: accept passwords with 8+ characters and a number', tag: 'Green', cls: 'green', code: 'function isStrongPassword(pw) {\n  return pw.length >= 8 && /[0-9]/.test(pw);\n}' },
  { msg: 'refactor: name the minimum length', tag: 'Refactor', cls: 'blue', code: 'const MIN_LENGTH = 8;\n\nfunction isStrongPassword(pw) {\n  return pw.length >= MIN_LENGTH && /[0-9]/.test(pw);\n}' }
];
function simPR(s, done, finish) {
  var head = done ? 2 : 0, merged = done, run = null, busy = false;
  var f = simFrame('Pull request');
  function check(i) {
    busy = true; run = 'running'; draw();
    runTests(PR_COMMITS[i].code, PR_TESTS).then(function (r) { busy = false; run = r; draw(); say(allPass(r) ? 'All checks have passed.' : 'Some checks were not successful. Merging is blocked.'); });
  }
  function draw() {
    var c = PR_COMMITS[head], ok = run && run !== 'running' && allPass(run), h = '';
    h += '<h3 class="pr-title">Add password strength checker <span class="num">#13</span></h3><p class="pr-meta"><span class="state ' + (merged ? 'merged' : '') + '">' + ICON.pr + (merged ? 'Merged' : 'Open') + '</span><span>Branch <code>12-password-checker</code> into <code>main</code>. The description says <code>Closes #12</code>.</span></p>';
    h += '<h4>Commits (' + (head + 1) + ')</h4><ol class="commits">' + PR_COMMITS.slice(0, head + 1).map(function (x) { return '<li><span class="tag ' + x.cls + '">' + x.tag + '</span><span>' + esc(x.msg) + '</span></li>'; }).join('') + '</ol>';
    h += C(c.code, { title: 'isStrongPassword.js at this commit' });
    h += '<div class="checks"><div class="checks-h ' + (run === null || run === 'running' ? '' : ok ? 'ok' : 'bad') + '">' + (run === null ? 'Checks have not run yet' : run === 'running' ? 'Checks are running&hellip;' : ok ? ICON.check + ' All checks have passed' : ICON.x + ' Some checks were not successful') + '</div><div class="checks-b results" id="pr-res" aria-live="polite"></div></div>';
    if (merged) h += '<div class="feedback ok"><strong class="ok">&#10003; Pull request merged.</strong> Because the description says <code>Closes #12</code>, GitHub closed the issue <span class="state closed">' + ICON.issue + 'Closed</span> and moved its card to Done. Your tests were the gate that got it here.</div>';
    else h += '<div class="merge-box ' + (ok ? 'ready' : 'blocked') + '"><p>' + (ok ? '<strong class="result-ok">This branch has no conflicts and all required checks passed.</strong>' : '<strong class="result-bad">Merging is blocked.</strong> The required check <code>Tests</code> has not passed.') + '</p><div class="actions" style="margin-top:0"><button type="button" class="btn" data-merge' + (ok ? '' : ' aria-disabled="true"') + '>Merge pull request</button>' + (head < 2 ? '<button type="button" class="btn sec" data-push' + (busy ? ' aria-disabled="true"' : '') + '>Push next commit (' + PR_COMMITS[head + 1].tag + ')</button>' : '') + '</div></div>';
    f.body.innerHTML = h;
    var box = $('#pr-res', f.body);
    if (run === null) box.innerHTML = '<p>Press <strong>Run checks</strong> to start the <code>Tests</code> workflow on this commit.</p><button type="button" class="btn sec" data-run>Run checks</button>';
    else if (run === 'running') box.innerHTML = '<p>Running the tests on this commit&hellip;</p>';
    else renderTests(box, run);
    var b;
    if ((b = $('[data-run]', f.body))) b.addEventListener('click', function () { if (!busy) check(head); });
    if ((b = $('[data-push]', f.body))) b.addEventListener('click', function () { if (busy) return; head++; run = null; check(head); });
    if ((b = $('[data-merge]', f.body))) b.addEventListener('click', function () {
      if (!ok) { say('Merging is blocked until the Tests check passes.'); return; }
      merged = true; draw(); say('Pull request merged. Issue 12 closed automatically.'); if (!done) finish();
    });
  }
  if (done) { draw(); run = null; } else draw();
  return f;
}

/* =====================================================================
   6. Tooltips, copy buttons, theme, start-up
   ===================================================================== */
function placeTip(w) {
  var box = $('.tipbox', w); if (!box) return;
  w.classList.remove('below'); w.style.removeProperty('--tx'); box.style.removeProperty('--tx');
  box.style.setProperty('--tx', '0px');
  var r = box.getBoundingClientRect(), vw = document.documentElement.clientWidth, tx = 0;
  if (r.top < 130) { w.classList.add('below'); }
  if (r.left < 8) tx = 8 - r.left; else if (r.right > vw - 8) tx = (vw - 8) - r.right;
  box.style.setProperty('--tx', tx + 'px');
}
function openTip(w) { document.querySelectorAll('.tipw.open').forEach(function (o) { if (o !== w) o.classList.remove('open'); }); w.classList.add('open'); placeTip(w); }
function closeTip(w) { w.classList.remove('open'); }
document.addEventListener('mouseover', function (e) { var w = e.target.closest && e.target.closest('.tipw'); if (w && !w.classList.contains('open')) openTip(w); });
document.addEventListener('mouseout', function (e) { var w = e.target.closest && e.target.closest('.tipw'); if (w && !w.contains(e.relatedTarget) && !w.contains(document.activeElement)) closeTip(w); });
document.addEventListener('focusin', function (e) { var w = e.target.closest && e.target.closest('.tipw'); if (w) openTip(w); });
document.addEventListener('focusout', function (e) { var w = e.target.closest && e.target.closest('.tipw'); if (w && !w.contains(e.relatedTarget)) closeTip(w); });
document.addEventListener('click', function (e) {
  document.querySelectorAll('.tipw.open').forEach(function (o) { if (!o.contains(e.target)) closeTip(o); });
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.querySelectorAll('.tipw.open').forEach(closeTip); });
window.addEventListener('resize', function () { document.querySelectorAll('.tipw.open').forEach(placeTip); });

document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[data-copy]'); if (!b) return;
  var text = COPY[+b.dataset.copy];
  var done = function () { b.textContent = 'Copied'; say('Copied to clipboard'); setTimeout(function () { b.textContent = 'Copy'; }, 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  else { fallbackCopy(text); done(); }
});
function fallbackCopy(text) { var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); }

/* Theme: follows the device until the learner picks one. */
function systemDark() { return window.matchMedia('(prefers-color-scheme: dark)').matches; }
function currentTheme() { return document.documentElement.dataset.theme || (systemDark() ? 'dark' : 'light'); }
function themeButton() {
  var dark = currentTheme() === 'dark';
  $('#tools').innerHTML = UITIP(dark ? 'Light mode' : 'Dark mode', dark ? 'Switch to a light background.' : 'Switch to a dark background.', '', 'id="themebtn" aria-pressed="' + dark + '"');
  $('#themebtn').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('tdd-theme', next); } catch (e) {}
    themeButton(); $('#themebtn').focus(); say(next === 'dark' ? 'Dark mode on' : 'Light mode on');
  });
}
$('#sidetoggle').addEventListener('click', function () {
  var open = $('#side').classList.toggle('open'); this.setAttribute('aria-expanded', String(open));
});

themeButton();
view = (state.view !== null && state.view >= 0 && state.view < MODULES.length && moduleUnlocked(state.view)) ? state.view : currentModule();
showModule(view, false);
</script>
